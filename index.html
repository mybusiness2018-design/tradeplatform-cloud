/* ---- 加密：优先 Web Crypto AES-GCM；file:// 无 subtle 时降级为混淆锁（仅防随手翻看） ---- */
function b64enc(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));}
function b64dec(s){var b=atob(s);var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function fbKeystream(pw,len){var h=2166136261;for(var i=0;i<pw.length;i++){h^=pw.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}var out=[],s=h||1;for(var i=0;i<len;i++){s=(Math.imul(s,1103515245)+12345)&0x7fffffff;out.push(s&0xff);}return out;}
function xorBytes(bytes,pw){var ks=fbKeystream(pw,bytes.length);var o=new Uint8Array(bytes.length);for(var i=0;i<bytes.length;i++)o[i]=bytes[i]^ks[i];return o;}
async function deriveKey(pw,salt){
 if(HAS_SUBTLE){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
 }
 return {pw:pw};
}
async function encBlob(obj){
 var j=JSON.stringify(obj);
 if(HAS_SUBTLE){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},CK,new TextEncoder().encode(j));
  return 'a:'+b64enc(iv)+':'+b64enc(ct);
 }
 return 'x:'+b64enc(xorBytes(new TextEncoder().encode(j),CK.pw));
}
async function decBlob(str){
 var p=str.split(':');
 if(p[0]==='a'){
  var iv=b64dec(p[1]),ct=b64dec(p[2]);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},CK,ct);
  return JSON.parse(new TextDecoder().decode(pt));
 }
 return JSON.parse(new TextDecoder().decode(xorBytes(b64dec(p[1]),CK.pw)));
}

async function doUnlock(){

 CK=await deriveKey(pw,b64dec(localStorage.getItem(KEY+'salt')||''));
 try{var tok=await decBlob(verStr);if(tok!==VER_TOKEN)throw 0;}catch(e){lkErr(TX('密码错误','Wrong password'));CK=null;return;}
 MEM={};
 var storeStr=localStorage.getItem(KEY+'store');
 if(storeStr){try{var blob=await decBlob(storeStr);for(var k in blob)MEM[k]=blob[k];}catch(e){lkErr(TX('解密失败，数据可能损坏','Decrypt failed'));CK=null;return;}}
 ENC_ON=true;hideLock();buildState();unlocked();
}
async function doSetPw(){

 if(pw!==cf){lkErr(TX('两次输入不一致','Mismatch'));return;}
 var salt=crypto.getRandomValues(new Uint8Array(16));
 CK=await deriveKey(pw,salt);
 var obj={};PERSIST_KEYS.forEach(function(k){obj[k]=(S&&S[k]!==undefined)?S[k]:load(k,null);});
 MEM=obj;
 localStorage.setItem(KEY+'salt',b64enc(salt));
 localStorage.setItem(KEY+'ver',await encBlob(VER_TOKEN));
 localStorage.setItem(KEY+'store',await encBlob(obj));
 localStorage.setItem(KEY+'enc','1');
 PERSIST_KEYS.forEach(function(k){localStorage.removeItem(KEY+k);});
 ENC_ON=true;hideLock();toast(TX('已开启加密锁','Encryption on'));refreshAll();
}

 var days=Math.round((new Date(todayStr())-new Date(l.last))/864e5);
 if(days<=3)s+=10;else if(days<=7)s+=5;else if(days>=21)s-=8;
 if(l.amount>=2000)s+=8;else if(l.amount>0)s+=4;

}

 h+='<div class="field"><label>'+TX('主打市场','Main market')+'</label><input id="f_mkt" placeholder="'+TX('中东/东南亚/欧美/非洲','Mid-East/SEA/EU-US/Africa')+'" value="'+esc(m.market)+'"></div>';

function wsUrl(p,q){

function wsVariants(q){
 q=String(q||'').trim();
 if(!q)return [];
 return [q,'wholesale '+q,'bulk '+q,q+' supplier',q+' manufacturer',q+' factory price',q+' MOQ',q+' OEM ODM'];
}
function wsMatrix(q,plat){
 var vs=wsVariants(q);
 if(!vs.length)return [];
 var ps=(plat&&plat!=='all')?[plat]:WS_PFS;
 var out=[],i,j;
 for(i=0;i<vs.length;i++){for(j=0;j<ps.length;j++){out.push({p:ps[j],q:vs[i]});}}
 return out;
}
function wsUnesc(t){
 return String(t||'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ').replace(/&amp;/g,'&');
}
function wsParse(html){
 var out=[];
 var blocks=String(html||'').split('<li class="b_algo"');
 for(var i=1;i<blocks.length&&out.length<25;i++){
  var b=blocks[i];
  var a=/<a[^>]+href="(https?:\/\/[^"]+)"[^>]*>([\s\S]*?)<\/a>/.exec(b);
  if(!a)continue;
  var t=wsUnesc(String(a[2]).replace(/<[^>]+>/g,'')).trim();
  if(!t||t.length<3)continue;
  var pm=/<p[^>]*>([\s\S]*?)<\/p>/.exec(b);
  var sn=pm?wsUnesc(String(pm[1]).replace(/<[^>]+>/g,'')).trim():'';
  out.push({t:t,u:a[1],s:sn.slice(0,240)});
 }
 return out;
}
function wsFetch(url,ms){
 var limit=ms||7000;
 return new Promise(function(resolve,reject){
  var done=false,opt={};
  var to=setTimeout(function(){if(!done){done=true;reject(new Error('timeout'));}},limit);
  try{
   if(typeof AbortController!=='undefined'){
    var c=new AbortController();opt.signal=c.signal;
    setTimeout(function(){try{c.abort();}catch(e){}},limit);
   }
  }catch(e){}
  fetch(url,opt).then(function(r){
   if(done)return;
   done=true;clearTimeout(to);
   if(!r.ok){reject(new Error('HTTP '+r.status));return;}
   resolve(r.text());
  }).catch(function(e){if(!done){done=true;clearTimeout(to);reject(e);}});
 });
}

function fmtD(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}

function cpParse(text){
 var t=String(text||'');
 var lines=t.split(/\r?\n/);
 var out=[],seen={};
 var RE_P=/(?:US\s?\$|USD\s?|\$)\s?(\d[\d,]*(?:\.\d{1,2})?)/;
 var RE_PCTX=/(?:price|单价|unit\s*price|cost|amount|金额|报价)\D*?(\d[\d,]*(?:\.\d{1,2})?)/i;
 var RE_M1=/MOQ[^0-9]{0,15}(\d[\d,]*)/i;
 var RE_M2=/(?:Min\.?\s*Order|Minimum\s*Order)[^0-9]{0,15}(\d[\d,]*)/i;
 var RE_M3=/(\d[\d,]*)\s*(?:pcs|pieces|sets|units)\b/i;
 for(var i=0;i<lines.length&&out.length<30;i++){
  var L=lines[i];
  if(!L||L.length<4)continue;
  var pm=RE_P.exec(L);
  if(!pm)pm=RE_PCTX.exec(L);
  if(!pm)continue;
  var price=String(pm[1]).replace(/,/g,'');
  var v=parseFloat(price);
  if(isNaN(v)||v<=0||v>100000)continue;
  var moq='';
  var mm=RE_M1.exec(L)||RE_M2.exec(L)||RE_M3.exec(L);
  if(mm)moq=String(mm[1]).replace(/,/g,'');
  var name=L.replace(RE_P,' ').replace(/\s+/g,' ').trim();
  name=name.replace(/[\-–—\/|]\s*$/,'').trim();
  if(name.length>60)name=name.slice(0,60);
  if(!name)name=TX('(未识别名称)','(name N/A)');
  var key=name+'|'+price+'|'+moq;
  if(seen[key])continue;
  seen[key]=1;
  out.push({name:name,price:price,moq:moq});
 }
 return out;
}

function csvCell(v){v=(v===undefined||v===null)?'':String(v);return /[",\n\r]/.test(v)?('"'+v.replace(/"/g,'""')+'"'):v;}
function parseCsv(text){
 var rows=[],row=[],cur='',q=false;
 text=String(text||'').replace(/^﻿/,'');
 for(var i=0;i<text.length;i++){
  var c=text.charAt(i);
  if(q){
   if(c==='"'){if(text.charAt(i+1)==='"'){cur+='"';i++;}else q=false;}
   else cur+=c;
  } else {
   if(c==='"')q=true;
   else if(c===','){row.push(cur);cur='';}
   else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
   else if(c==='\r'){}
   else cur+=c;
  }
 }
 if(cur!==''||row.length){row.push(cur);rows.push(row);}
 return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
}
function csvMap(head){
 var m={};
 head.forEach(function(h,i){
  var k=String(h||'').trim().toLowerCase().replace(/[\s_]/g,'');
  if(!k)return;
  if(/^(客户名|客户|名称|name|client|customer)$/.test(k))m.name=i;
  else if(/^(国家|country|nation)$/.test(k))m.country=i;

function onLeadFile(e){
 var file=(e.target.files||[])[0];if(!file)return;
 var r=new FileReader();
 r.onload=function(){
  var text=String(r.result||'');var list=null;
  var t=text.replace(/^\s+/,'');
  if(/\.json$/i.test(file.name)||t.charAt(0)==='{'||t.charAt(0)==='['){
   try{var d=JSON.parse(text);list=(d&&d.leads)?d.leads:(Object.prototype.toString.call(d)==='[object Array]'?d:null);}catch(err){list=null;}
  }
  if(!list){
   var rows=parseCsv(text);
   if(rows.length<2){toast(TX('文件为空或格式不对','Empty or bad format'));return;}
   var m=csvMap(rows[0]);
   if(m.name===undefined){toast(TX('未识别到「客户名」列，请保留表头','No Name column; keep the header row'));return;}
   list=[];
   for(var i=1;i<rows.length;i++){
    var rr=rows[i];
    var nv=(rr[m.name]||'').trim();if(!nv)continue;
    list.push({name:nv,country:(m.country!==undefined?(rr[m.country]||'').trim():''),market:(m.market!==undefined?(rr[m.market]||'').trim():''),wa:(m.wa!==undefined?(rr[m.wa]||'').trim():''),email:(m.email!==undefined?(rr[m.email]||'').trim():''),product:(m.product!==undefined?(rr[m.product]||'').trim():''),stage:(m.stage!==undefined?(rr[m.stage]||'').trim():''),amount:(m.amount!==undefined?(rr[m.amount]||'').trim():''),last:(m.last!==undefined?(rr[m.last]||'').trim():''),note:(m.note!==undefined?(rr[m.note]||'').trim():''),source:(m.source!==undefined?(rr[m.source]||'').trim():'')});
   }
  }
  if(!list||!list.length){toast(TX('没有可导入的客户','No clients found'));return;}
  var add=0,upd=0;
  list.forEach(function(x){
   var hit=null;
   for(var j=0;j<S.leads.length;j++){var l=S.leads[j];if(String(l.name||'').trim()===String(x.name||'').trim()&&String(l.country||'').trim()===String(x.country||'').trim()){hit=l;break;}}
   if(hit)upd++;else add++;
  });
  S._impList=list;
  var pv=list.slice(0,5).map(function(x){return x.name+(x.country?('('+x.country+')'):'');}).join('、');
  openModal(TX('确认导入客户','Confirm import'),TX('共解析到 ','Parsed ')+list.length+TX(' 条：新增 ',' records: new ')+add+TX(' 条，更新 ',' , update ')+upd+TX(' 条。匹配规则：客户名+国家；更新时只覆盖非空字段，不会清空已有内容。',' . Matched by name+country; only non-empty fields overwrite.')+(pv?(' '+TX('预览：','Preview: ')+pv+(list.length>5?'…':'')):''),function(){doImportLeads();});
 };
 r.readAsText(file);
}
function doImportLeads(){
 var list=S._impList||[];var add=0,upd=0;
 list.forEach(function(x){
  var hit=null;
  for(var j=0;j<S.leads.length;j++){var l=S.leads[j];if(String(l.name||'').trim()===String(x.name||'').trim()&&String(l.country||'').trim()===String(x.country||'').trim()){hit=l;break;}}
  if(hit){
   ['market','wa','email','product','stage','amount','last','note'].forEach(function(k){
    if(x[k]!==undefined&&String(x[k]).trim()!==''){
     if(k==='stage'){if(PIPE.indexOf(x.stage)>=0)hit.stage=x.stage;}
    else if(k==='source'){hit.source=x.source;}
     else if(k==='amount'){var n=Number(String(x.amount).replace(/[^0-9.\-]/g,''));if(!isNaN(n))hit.amount=n;}
     else hit[k]=x[k];
    }
   });
   if(!hit.logs)hit.logs=[];
   upd++;
  } else {
   var st=(PIPE.indexOf(x.stage)>=0)?x.stage:'待开发';
   var am=Number(String(x.amount||'').replace(/[^0-9.\-]/g,''));if(isNaN(am))am=0;
   S.leads.push({id:uid(),name:x.name,country:x.country||'',market:x.market||'',wa:x.wa||'',email:x.email||'',product:x.product||'',stage:st,amount:am,last:x.last||todayStr(),note:x.note||'',source:x.source||'',logs:[]});
   add++;
  }
 });
 save('leads',S.leads);S._impList=null;
 toast(TX('导入完成：新增 ','Imported: new ')+add+TX(' 条，更新 ',' , updated ')+upd+TX(' 条',''));
 refreshAll();
}

"stage": "开发信 / Outreach",
"title": "首封冷开发信 / First cold outreach",
"en": "Subject: {产品} supplier for {国家} importers — {公司}\n\nHi {姓名},\n\nThis is {公司} — we supply Muslim prayer pillows, gift boxes and 3C accessories to importers across the Middle East and Southeast Asia.\n\nWhy buyers choose us:\n- Stable Ramadan stock, no out-of-stock in peak season\n- FOB Ningbo, 30% deposit / 70% before shipment\n- OEM & custom embroidery available\n\nCould I send you our best-seller catalog and a sample quote?\n\nBest,\n{公司}",
"zh": "首封冷开发信要点：一句话亮明身份+核心品类；用 3 条差异化（斋月库存稳、付款友好、可定制）降低信任门槛；结尾给一个低门槛动作（发目录/报价），不要直接要订单。"
},
{
"stage": "开发信 / Outreach",
"title": "展会后跟进开发信 / Post-trade-show follow-up",
"en": "Subject: Great meeting you at {展会} — {产品} catalog attached\n\nHi {姓名},\n\nIt was a pleasure talking with you at {展会}. As promised, here is our latest {产品} catalog with FOB prices.\n\nBuyers from {国家} especially like our Ramadan gift sets. MOQ starts at 300 pcs, 20-day lead time.\n\nShall we schedule a short call next week to discuss your Q4 plan?\n\nBest,\n{公司}",
"zh": "展会跟进要点：用「见过面」建立连接，立刻兑现展会上的承诺（发目录）；点出对方市场偏好增强相关性；用「下周短会」推动到下一步，别让热度冷却。"
},
{
"stage": "开发信 / Outreach",
"title": "老客户转介绍开发信 / Warm intro from a partner",
"en": "Subject: {推荐人} suggested I contact you — {产品} for {国家}\n\nHi {姓名},\n\n{推荐人} (our happy client in {国家}) recommended I reach out. We have supplied them with {产品} for 3 years with zero quality claims.\n\nI believe we can support your business too. May I share our line sheet and a reference price?\n\nBest,\n{公司}",
"zh": "转介绍开发信要点：借老客户背书降低戒备；给出具体合作年限/零客诉等可信证据；动作轻（发资料），不急着要下单。"
},
{
"stage": "开发信 / Outreach",
"title": "LinkedIn / 社媒开发信 / Social outreach",
"en": "Subject: {产品} sourcing idea for {国家}\n\nHi {姓名},\n\nI came across your profile and saw you distribute gifts/accessories in {国家}. We help brands like yours private-label {产品} with fast 15-day sampling.\n\nWould a quick look at our portfolio help your next season plan?\n\nBest,\n{公司}",
"zh": "社媒开发信要点：先证明你做过功课（知道他卖什么、在哪卖）；主打「快打样/私牌」痛点；用「看一眼作品集」这种零压力动作开场。"
},
{
"stage": "询盘回复 / Inquiry",
"title": "收到询盘首复 / First reply to inquiry",
"en": "Subject: Re: Your inquiry about {产品} — {公司}\n\nHi {姓名},\n\nThanks for your interest in our {产品}! Glad to help.\n\nTo quote accurately, could you confirm:\n1) Target market & quantity per order\n2) Preferred material / spec\n3) Need OEM logo or neutral packing\n\nI will send a tailored quote within 24h once confirmed.\n\nBest,\n{公司}",
"zh": "询盘首复要点：先感谢+表意愿；不要立刻瞎报价，先问清数量/规格/包装三要素，避免来回折腾；承诺24h内出精准报价，建立专业感。"
},
{
"stage": "询盘回复 / Inquiry",
"title": "问清参数再报价 / Clarify specs before quote",
"en": "Subject: A few details to quote your {产品} correctly\n\nHi {姓名},\n\nBefore quoting, may I confirm:\n- Size / color / print: ______\n- Certification needed (CE, LFGB, Halal?): ______\n- Packing: color box or bulk: ______\n- Destination port: ______\n\nThis helps us match the exact cost. Looking forward!\n\nBest,\n{公司}",
"zh": "参数确认要点：用清单式提问降低客户思考成本；认证/港口等影响价格的项必须问；清晰=专业，也避免后续改价伤信任。"
},
{
"stage": "询盘回复 / Inquiry",
"title": "询盘转样品/目录 / Route to sample or catalog",
"en": "Subject: Catalog + sample plan for your {产品} inquiry\n\nHi {姓名},\n\nHere is our {产品} catalog (attached). For a real feel of quality, I suggest a sample set — $XX including express, deductible from your first order.\n\nWant me to prepare the sample invoice?\n\nBest,\n{公司}",
"zh": "询盘转样品要点：先给目录满足即时需求；顺势用「样品可抵大货」降低付费阻力；把目录→样品→订单串成一条顺滑路径。"
},
{
"stage": "询盘回复 / Inquiry",
"title": "久未回复的二次跟进 / Nudge a silent inquiry",
"en": "Subject: Following up on {产品} quote — {公司}\n\nHi {姓名},\n\nJust circling back on my last email about {产品}. Did the specs/price work for your plan?\n\nIf timing isn't right now, no worries — I can hold the current FOB price for 7 days. Happy to adjust MOQ or terms if needed.\n\nBest,\n{公司}",
"zh": "沉默询盘跟进要点：轻量提醒，不施压；用「价格保留7天」制造温和稀缺；主动提出可让步（MOQ/条款），给台阶下。"
},
{
"stage": "报价 / Quotation",
"title": "正式报价 / Formal quotation",
"en": "Subject: Quotation — {产品} for {公司}\n\nHi {姓名},\n\nThanks for your interest. Quotation as below:\n- Item: {产品}\n- Unit price: $X FOB Ningbo\n- MOQ: 500 pcs\n- Lead time: 20 days after deposit\n- Payment: 30% deposit, 70% before shipment\n\nAttached PI for your review. Ready to start on receipt of deposit.\n\nBest,\n{公司}",
"zh": "正式报价要点：一次性给全价格/MOQ/交期/付款四要素+PI；结构清晰像报价单；结尾明确「收到定金即可排产」，推动成交。"
},
{
"stage": "报价 / Quotation",
"title": "阶梯报价（量大优惠）/ Tiered pricing",
"en": "Subject: Volume pricing for {产品} — better rate at scale\n\nHi {姓名},\n\nOur tiered FOB price for {产品}:\n- 500-1,000 pcs: $X\n- 1,001-5,000 pcs: $X-0.3\n- 5,000+ pcs: $X-0.6\n\nThe more you consolidate, the better your margin. Which tier fits your first order?\n\nBest,\n{公司}",
"zh": "阶梯报价要点：用数量换单价，引导客户把单做厚；明确每档价差，让客户自己算账；结尾问「哪一档适合首单」，推动决策。"
},
{
"stage": "报价 / Quotation",
"title": "报价有效期提醒 / Quote validity reminder",
"en": "Subject: {产品} quote valid until {日期} — {公司}\n\nHi {姓名},\n\nA quick note: our quote for {产品} (FOB $X) is valid until {日期}, as raw material costs may shift before Ramadan.\n\nLock the price now and we secure your slot. Need a revised PI?\n\nBest,\n{公司}",
"zh": "报价有效期要点：给截止日+理由（原料波动/斋月），制造合理紧迫；「现在锁价=保交期保价」，把催单包装成帮客户省钱。"
},
{
"stage": "报价 / Quotation",
"title": "客户嫌贵 — 价值锚定 / Handle too expensive",
"en": "Subject: Why {产品} pricing protects your margin\n\nHi {姓名},\n\nI understand price matters. Compared with cheaper options, our {产品} uses {材质/工艺} that cuts your return rate and repeat-complaint cost — lower total cost, not just unit price.\n\nHappy to offer a mixed trial order so you can compare quality side by side.\n\nBest,\n{公司}",
"zh": "嫌贵应对要点：不盲目降价，转谈总拥有成本（退换货/客诉更低）；用「混批试单」让客户自己比出质量差；守住底价也守住利润。"
},
{
"stage": "样品 / Sample",
"title": "寄样前确认 / Confirm before sending sample",
"en": "Subject: Sample arrangement for {产品}\n\nHi {姓名},\n\nHappy to send {产品} samples. To ship correctly, please confirm:\n- Full address & phone (for DHL/FedEx)\n- Sample cost: $XX (deductible from first order)\n- Any specific color/spec to include\n\nI will issue the sample invoice once confirmed.\n\nBest,\n{公司}",
"zh": "寄样前确认要点：先要准地址+电话避免退件；明示样品费可抵大货，降低付费抵触；确认规格再发，避免发错白花钱。"
},
{
"stage": "样品 / Sample",
"title": "样品已寄出 / Sample shipped",
"en": "Subject: Your {产品} sample — tracking & next step\n\nHi {姓名},\n\nYour {产品} sample shipped on {日期}. Tracking: {单号}.\n\nMay I know:\n1) Did the quality / embroidery meet your expectation?\n2) Shall we prepare a bulk quotation (MOQ 500)?\n\nWe can lock Ramadan stock for you if you confirm this week.\n\nBest,\n{公司}",
"zh": "样品寄出要点：给单号+物流节点；用两个问题引导反馈（质量如何+要不要大货报价）；「本周确认锁库存」软性催单。"
},
{
"stage": "样品 / Sample",
"title": "样品费抵扣说明 / Sample cost deductible",
"en": "Subject: Your $XX sample fee credited to first order\n\nHi {姓名},\n\nGood news — the $XX you paid for {产品} samples will be fully deducted from your first bulk order (MOQ 500).\n\nNo extra cost to try us. Ready when you are — shall I prepare the PI?\n\nBest,\n{公司}",
"zh": "样品费抵扣要点：明确「全额抵首单」，把已付费变成首单优惠，消除损失感；顺势请付PI推进成交。"
},
{
"stage": "样品 / Sample",
"title": "样品反馈收集 / Collect sample feedback",
"en": "Subject: How did the {产品} sample perform?\n\nHi {姓名},\n\nA few days after delivery — how is the {产品} sample received by your team / buyers?\n\nAny tweak on color, fabric or print we should apply to the bulk run? Your feedback directly shapes production.\n\nBest,\n{公司}",
"zh": "样品反馈收集要点：主动在到样后跟进，体现重视；问具体可改项（色/料/版），把反馈转化为大货改进，提升成交率。"
},
{
"stage": "订单 / Order",
"title": "确认订单细节（PI前核对）/ Verify order before PI",
"en": "Subject: Let's confirm {产品} order details\n\nHi {姓名},\n\nBefore issuing PI, please double-check:\n- Qty & SKU: ______\n- Unit price: $X FOB ______\n- Delivery: ______ days after deposit\n- Packing: ______\n\nOnce confirmed I'll send the PI for signature. Helps avoid costly changes later.\n\nBest,\n{公司}",
"zh": "PI前核对要点：把数量/SKU/价/交期/包装列清让客户确认，签字前纠错成本最低；体现严谨，也保护自己不被改单扯皮。"
},
{
"stage": "订单 / Order",
"title": "订单确认回执 / Order confirmation",
"en": "Subject: Order confirmed — {产品} / PO {单号}\n\nHi {姓名},\n\nConfirmed receipt of your PO {单号} for {产品}. Summary:\n- Qty: ______ / Total: $______\n- Deposit 30% ($______) received\n- ETD: {日期}\n\nProduction started. I'll send a mid-production update.\n\nBest,\n{公司}",
"zh": "订单确认回执要点：复述关键数字（数量/金额/定金/ETD）让双方对齐；明确「已开工+会中期汇报」，建立确定感。"
},
{
"stage": "订单 / Order",
"title": "生产进度中期汇报 / Mid-production update",
"en": "Subject: {产品} production update — 50% done\n\nHi {姓名},\n\nYour {产品} order is 50% through production, on schedule for ETD {日期}.\n\nAttached: workshop photos. We are now doing in-line QC on embroidery & color fastness.\n\nNext update at finishing stage.\n\nBest,\n{公司}",
"zh": "中期汇报要点：给完成百分比+ETA不变承诺；附车间照+在制品控项，增加透明度；定期更新让客户安心、减少催问。"
},
{
"stage": "订单 / Order",
"title": "订单完成待发货 / Order finished, ready to ship",
"en": "Subject: {产品} order finished — ready for booking\n\nHi {姓名},\n\nGreat news: your {产品} order passed final QC and is packed, ready to ship.\n\nPlease arrange the 70% balance so we can book space. ETD can be {日期} upon balance received.\n\nBest,\n{公司}",
"zh": "待发货通知要点：宣布「过终检、已包好」，制造完成确定感；把付尾款与订舱挂钩，自然推进回款。"
},
{
"stage": "出货 / Shipment",
"title": "发货通知 / Shipment advice",
"en": "Subject: {产品} shipped — B/L & details inside\n\nHi {姓名},\n\nYour {产品} order shipped on {日期}.\n- Vessel: {船名} / ETD {港口} {日期}\n- ETA: {日期}\n- B/L no.: {单号}\n\nAttached: B/L, commercial invoice, packing list. Track via {链接}.\n\nBest,\n{公司}",
"zh": "发货通知要点：给船名/ETD/ETA/提单号四要素+三单（提单/发票/箱单）；附查询链接，客户自助跟踪，减少追问。"
},
{
"stage": "出货 / Shipment",
"title": "装柜照片/装箱单发送 / Loading photos & packing list",
"en": "Subject: {产品} loading photos + packing list\n\nHi {姓名},\n\nAttached: container loading photos and final packing list for {产品}.\n- Containers: ______ / Seal no.: {单号}\n- Total cartons: ______ / Gross weight: ______ kg\n\nEverything matches the PI. Vessel departs as scheduled.\n\nBest,\n{公司}",
"zh": "装柜照+箱单要点：发装柜照+封条号+总箱数+毛重，证明「按PI装齐」；让客户提前对单，到港清关更顺。"
},
{
"stage": "出货 / Shipment",
"title": "延迟出货致歉 / Delay apology",
"en": "Subject: Important — {产品} shipment delay\n\nHi {姓名},\n\nI owe you transparency: your {产品} shipment is delayed to {新日期} due to {原因}.\n\nWe've added overtime to recover. As a goodwill, {补偿方案}. I'm truly sorry for the impact on your plan.\n\nBest,\n{公司}",
"zh": "延迟致歉要点：第一时间坦白+新日期+原因；给补偿方案（折扣/免部分运费）显诚意；道歉要具体，不甩锅。"
},
{
"stage": "出货 / Shipment",
"title": "到港提醒+清关协助 / Arrival notice & customs help",
"en": "Subject: {产品} arriving {日期} — clearance checklist\n\nHi {姓名},\n\nYour {产品} arrives {港口} around {日期}.\nPlease prepare:\n- Original B/L / telex release\n- Commercial invoice & packing list\n- Any certificate required by {国家}\n\nNeed a certificate of origin? I can issue it today.\n\nBest,\n{公司}",
"zh": "到港提醒要点：给预计到港日+清关文件清单；主动提出可办原产地证，帮客户扫清清关障碍，减少滞港。"
},
{
"stage": "催款 / Collection",
"title": "首催（尾款到期提醒）/ First gentle reminder",
"en": "Subject: Friendly reminder — balance for {产品} due\n\nHi {姓名},\n\nHope the {产品} arrived well. A quick note: the 70% balance ($______) was due on {日期}.\n\nOnce received, I'll release the original B/L / telex release. Thank you for your prompt settlement!\n\nBest,\n{公司}",
"zh": "首催要点：以「货已到、请结尾款放单」为理由，礼貌不急躁；绑定提单释放动作，给明确交代。"
},
{
"stage": "催款 / Collection",
"title": "逾期温和二次催 / Second nudge on overdue",
"en": "Subject: Re: Balance due for {产品} — {公司}\n\nHi {姓名},\n\nFollowing up again on the $______ balance for {产品}, now {N} days overdue.\n\nCould you share the payment date? If the B/L is needed urgently, I can arrange telex release upon proof of remittance.\n\nBest,\n{公司}",
"zh": "二次催要点：点明逾期天数+金额；提供「凭汇款底单电放」的灵活方案降低对方阻力；语气仍合作不敌对。"
},
{
"stage": "催款 / Collection",
"title": "严重逾期最后通牒 / Final notice",
"en": "Subject: FINAL NOTICE — outstanding $______ for {产品}\n\nHi {姓名},\n\nDespite previous reminders, the $______ balance remains unpaid {N} days after goods arrival.\n\nPlease settle by {日期}, or we must pause further cooperation and pursue collection. I truly hope it won't come to that.\n\nBest,\n{公司}",
"zh": "最后通牒要点：明确「最终期限+后果（暂停合作/追收）」；语气严肃但留余地（「希望不至如此」）；仅在前两封无效后使用。"
},
{
"stage": "催款 / Collection",
"title": "分期/放宽付款协商 / Negotiate payment terms",
"en": "Subject: Payment plan for {产品} balance\n\nHi {姓名},\n\nI understand cash flow can be tight. To keep things smooth, I can accept the $______ balance in two parts: 50% by {日期A}, 50% by {日期B}.\n\nPlease confirm and I'll send the revised agreement.\n\nBest,\n{公司}",
"zh": "分期协商要点：主动给分期方案显弹性，保住关系也保住回款；要对方确认+签补充协议，避免口头承诺落空。"
},
{
"stage": "售后 / After-sales",
"title": "收到客诉致歉+方案 / Apology & solution",
"en": "Subject: Sorry about the {产品} issue — here's our fix\n\nHi {姓名},\n\nReally sorry to hear about the {问题} with {产品}. This is not the quality we stand for.\n\nOur solution: {补发/折扣/退款}. Please send photos of the defect so we can root-cause and prevent recurrence.\n\nBest,\n{公司}",
"zh": "客诉处理要点：先共情道歉，不辩解；给出具体补救（补发/折扣/退款）；要缺陷照片既为取证也为杜绝再发，转危为机。"
},
{
"stage": "售后 / After-sales",
"title": "质量问题补发/折扣 / Defect remedy",
"en": "Subject: Remedy for {产品} quality issue\n\nHi {姓名},\n\nFor the {问题} in {产品}, we'll:\n- Ship FREE replacement of {数量} pcs with your next order, OR\n- Credit $______ to your account\n\nYour choice. We'll also tighten QC on that process immediately.\n\nBest,\n{公司}",
"zh": "质量补救要点：给二选一（免费补发/账户抵扣），把决定权给客户显尊重；同步说明已加严该工序QC，重建信心。"
},
{
"stage": "售后 / After-sales",
"title": "退货/退款流程 / Return & refund process",
"en": "Subject: Return/refund steps for {产品}\n\nHi {姓名},\n\nTo process your {产品} return:\n1) Send photos + invoice number\n2) We issue return label / approve destruction\n3) Refund $______ within 7 days of confirmation\n\nHappy to walk you through it.\n\nBest,\n{公司}",
"zh": "退换流程要点：把步骤编号化降低客户操作成本；明确退款时限（确认后7天）建立确定感；主动表示可协助，减少摩擦。"
},
{
"stage": "售后 / After-sales",
"title": "售后回访+改进反馈 / Follow-up & improvement",
"en": "Subject: How is the {产品} selling? + 1 quick question\n\nHi {姓名},\n\nA few weeks post-delivery — how is {产品} performing with your buyers?\n\nOne thing we're improving: {改进点}. Your input last time directly shaped it. Anything else to tweak?\n\nBest,\n{公司}",
"zh": "售后回访要点：交付后主动问动销，体现长期主义；点出「你的反馈改了产品」，让客户有参与感，为复购埋线。"
},
{
"stage": "其他 / Other",
"title": "节假日问候（非宗教）/ Seasonal greeting",
"en": "Subject: Happy {节日} from {公司}\n\nHi {姓名},\n\nWishing you and your team a joyful {节日}!\n\nThank you for your trust this year. We'll be on a short break {日期区间} but reachable by email. Talk soon.\n\nBest,\n{公司}",
"zh": "节日问候要点：选中性节日（元旦/国庆）避免宗教敏感；简短祝福+感谢+值班说明，维系温度不越界。"
},
{
"stage": "其他 / Other",
"title": "公司资质/认证说明 / Certificates & credentials",
"en": "Subject: Our certifications for {产品} — {公司}\n\nHi {姓名},\n\nTo support your compliance, we hold:\n- ISO 9001 / BSCI\n- {CE / LFGB / Halal} as needed\n- Third-party inspection (SGS/BV) welcome\n\nHappy to send copies or arrange a factory audit.\n\nBest,\n{公司}",
"zh": "资质说明要点：列出认证+可第三方验厂，用证据消除合规顾虑；主动「可发副本/可审厂」，降低大客户决策风险。"
},
{
"stage": "其他 / Other",
"title": "展会邀请 / Trade show invitation",
"en": "Subject: Visit us at {展会} — Booth {展位}\n\nHi {姓名},\n\nWe'll exhibit at {展会} ({日期}, {城市}). Booth {展位} — come see our new {产品} line and Ramadan collection.\n\nI'd love to meet in person. Shall I reserve a time slot?\n\nBest,\n{公司}",
"zh": "展会邀请要点：给展会展位+时间+城市，降低见面门槛；指明「新品/斋月系列」给看展理由；主动约时段显重视。"
},
{
"stage": "其他 / Other",
"title": "市场资讯分享（增值）/ Market insight share",
"en": "Subject: {国家} {品类} trend you may find useful\n\nHi {姓名},\n\nSharing a quick read: {国家} demand for {品类} is up X% this season, with buyers favoring {趋势}.\n\nMight inform your next assortment. Happy to brainstorm matching products.\n\nBest,\n{公司}",
"zh": "资讯分享要点：发与客户市场相关的趋势数据，做「顾问」而非只推销；结尾「可帮选品」，把价值转化为商机。"
},
{
"stage": "PI确认 / PI",
"title": "发送PI待签 / Send PI for signature",
"en": "Subject: Proforma Invoice {单号} for {产品} — please sign\n\nHi {姓名},\n\nAttached is PI {单号} for your {产品} order:\n- Total: $______ / Deposit 30%: $______\n- Lead time: {日期} after deposit\n\nKindly sign & return, then arrange the deposit to lock production.\n\nBest,\n{公司}",
"zh": "发PI要点：附件PI+复述总额/定金/交期；明确要求「签字回传+付定金」两步走，流程清晰不拖沓。"
},
{
"stage": "PI确认 / PI",
"title": "PI修改后重发 / Revised PI",
"en": "Subject: Revised PI {单号} — {产品} updated\n\nHi {姓名},\n\nPer your request, revised PI {单号} attached with:\n- Qty: ______ (was ______)\n- Unit price: $______\n- New total: $______\n\nPlease confirm so we can proceed.\n\nBest,\n{公司}",
"zh": "PI改版要点：列出「改了什么（数量/价/总额）」的对比，让客户一眼看清变更；确认后即推进，避免反复。"
},
{
"stage": "PI确认 / PI",
"title": "催签PI（临近排产）/ Push to sign PI",
"en": "Subject: PI {单号} signature — production slot closing\n\nHi {姓名},\n\nTo keep your {产品} in our production plan, please sign PI {单号} and send the 30% deposit by {日期}.\n\nAfter that we reserve materials. A day later may shift your ETD.\n\nBest,\n{公司}",
"zh": "催签PI要点：把「签字+定金」与「保留产能/物料」绑定，制造合理紧迫；「晚一天可能延交期」点明代价。"
},
{
"stage": "PI确认 / PI",
"title": "PI已签+请付定金 / PI signed, request deposit",
"en": "Subject: PI {单号} received — please arrange deposit\n\nHi {姓名},\n\nGot your signed PI {单号}, thank you! Please arrange the 30% deposit ($______) at your earliest.\n\nOn receipt we issue the deposit invoice and start production immediately.\n\nBest,\n{公司}",
"zh": "PI已签跟进要点：确认收到签字PI并表示感谢；立刻引导付定金，并承诺「到账即开工」，给明确正向反馈。"
},
{
"stage": "订单变更 / Order change",
"title": "客户要求改数量/规格确认 / Confirm qty/spec change",
"en": "Subject: Change request for PO {单号} — {产品}\n\nHi {姓名},\n\nNoted your request to change {产品} to {新数量/规格}. Before we apply:\n- Current stage: {已生产比例}\n- If changeable: new total $______, ETD {新日期}\n- If started, a {改单费} may apply\n\nShall I proceed?\n\nBest,\n{公司}",
"zh": "改单确认要点：先告知当前生产进度，判断能否改；说明改后金额/交期或可能改单费；让客户知情后决策，避免事后扯皮。"
},
{
"stage": "订单变更 / Order change",
"title": "改交期协商 / Renegotiate delivery date",
"en": "Subject: New ETD for PO {单号} — {产品}\n\nHi {姓名},\n\nYou asked to move {产品} ETD to {新日期}. Feasible — production will shift accordingly, new ETD {新日期}, no extra cost.\n\nPlease confirm in writing so we update the plan and PI.\n\nBest,\n{公司}",
"zh": "改交期要点：确认可行+新日期+是否加费；要求书面确认再改PI，留痕防赖账。"
},
{
"stage": "订单变更 / Order change",
"title": "取消部分订单 / Cancel part of order",
"en": "Subject: Partial cancellation of PO {单号} — {产品}\n\nHi {姓名},\n\nRegarding your request to cancel {数量} pcs of {产品}:\n- Unproduced portion: fully cancellable\n- Already-made portion: can ship separately or hold 30 days\n\nHow would you like to handle the made units?\n\nBest,\n{公司}",
"zh": "部分取消要点：区分「未产/已产」分别处理，已产的可分批发或暂存；把已产部分的处置决定权交给客户，减少损失。"
},
{
"stage": "订单变更 / Order change",
"title": "涨价/跌价后改单条款 / Reprice on cost move",
"en": "Subject: Price update for PO {单号} — {产品}\n\nHi {姓名},\n\nRaw material moved {方向} since PI {单号}. For the unchanged balance, new unit price $______ (was $______).\n\nOptions: (a) accept new price, or (b) keep old price by confirming & depositing within {日期}.\n\nBest,\n{公司}",
"zh": "涨跌价改单要点：说明成本变动原因+新单价；给客户二选一（接受新价 / 期限内按旧价付定锁定），把被动涨价变主动选择。"
},
{
"stage": "包装唛头 / Packing",
"title": "确认包装方式 / Confirm packing method",
"en": "Subject: Packaging for {产品} — please confirm\n\nHi {姓名},\n\nFor {产品}, default packing: {彩盒/中性袋/散装}. Please confirm or choose:\n- Gift box (MOQ +X days)\n- Neutral packing (no logo)\n- Custom mailer box\n\nThis affects both cost and lead time.\n\nBest,\n{公司}",
"zh": "包装确认要点：给出默认+可选方案（彩盒/中性/定制），点明各自对成本交期影响；让客户按渠道选，避免到时投诉。"
},
{
"stage": "包装唛头 / Packing",
"title": "唛头内容确认 / Confirm shipping marks",
"en": "Subject: Shipping marks for {产品} — need your artwork\n\nHi {姓名},\n\nPlease provide the carton shipping marks for {产品}: brand, model, qty/carton, country of origin, and any warning icons.\n\nSend your AI/PDF file and we'll print exactly as approved.\n\nBest,\n{公司}",
"zh": "唛头确认要点：清单式索要唛头要素（品牌/型号/箱规/原产地/警示）；要客户给矢量文件，按「已确认稿」印刷，杜绝错印。"
},
{
"stage": "包装唛头 / Packing",
"title": "条码/标签要求 / Barcode & label requirement",
"en": "Subject: Barcode & label spec for {产品}\n\nHi {姓名},\n\nFor {国家} retail, please confirm label needs:\n- Barcode type (EAN-13 / UPC)\n- Language on label (EN / {国家} lang)\n- Compliance marks (CE, recycling)\n\nWe'll apply before cartoning.\n\nBest,\n{公司}",
"zh": "条码标签要点：按目标国确认条码类型/语种/合规标识；标签在装箱前贴，避免到港被拒；体现专业合规。"
},
{
"stage": "包装唛头 / Packing",
"title": "特殊包装（礼品/防压）/ Special packing",
"en": "Subject: Protective packing for {产品} (gift)\n\nHi {姓名},\n\nSince {产品} is gift-grade, we'll add: inner EPE sleeve, double carton, FRAGILE marks, and desiccant for humidity.\n\nSlight +$X/ctn but protects your brand at shelf. OK to proceed?\n\nBest,\n{公司}",
"zh": "特殊包装要点：针对礼品/易损主动加防护（内衬/双箱/易碎标/干燥剂）；说明加价但护品牌，让客户觉得值。"
},
{
"stage": "验货 / Inspection",
"title": "申请第三方验货排期 / Book 3rd-party inspection",
"en": "Subject: Pre-shipment inspection for {产品} — {日期}\n\nHi {姓名},\n\nWe've booked SGS/BV inspection for {产品} on {日期} at our factory.\n\nScope: qty, workmanship, function, packing vs PI. Report within 48h. If fail, we rework free before loading.\n\nBest,\n{公司}",
"zh": "第三方验货要点：主动约期+明确验货范围（数/工/功/包 vs PI）；承诺48h出报告、不合格免费返工，给客户质量确定性。"
},
{
"stage": "验货 / Inspection",
"title": "验货前自检清单发送 / Self-check list before QC",
"en": "Subject: {产品} self-inspection checklist (pre-QC)\n\nHi {姓名},\n\nBefore official QC, our inline checks on {产品}:\n- Qty / color / style vs PI\n- No loose threads / stains\n- Size tolerance plus/minus 1cm\n- Marks & labels correct\n\nPhotos attached. Confident it passes.\n\nBest,\n{公司}",
"zh": "验货前自检要点：用清单展示已自查项，附照增强可信；传递「我们有把握通过」，减少客户疑心。"
},
{
"stage": "验货 / Inspection",
"title": "验货不合格整改通知 / Fail & rework notice",
"en": "Subject: {产品} inspection result — rework plan\n\nHi {姓名},\n\nInspection found {缺陷} on {产品} (defect rate X%). We'll:\n- 100% re-screen the affected batch\n- Rework free, ETD shifts to {新日期}\n- Share corrected photos before loading\n\nSorry for the slip; it won't ship unchecked.\n\nBest,\n{公司}",
"zh": "验货不合格要点：坦白缺陷率+整改（全检/免费返工/新ETD/发整改照）；道歉并承诺「不带病出货」，把危机变信任。"
},
{
"stage": "验货 / Inspection",
"title": "验货通过放行 / Pass & release",
"en": "Subject: {产品} passed inspection — ready to load\n\nHi {姓名},\n\nGood news: {产品} passed {机构} inspection (AQL X, zero critical). Report attached.\n\nWe'll load per plan and send the loading report. Original B/L follows after balance.\n\nBest,\n{公司}",
"zh": "验货通过要点：宣布通过+标准（AQL等级/零严重缺陷）+附报告；衔接装柜与放单，给客户放行确定感。"
},
{
"stage": "订舱 / Booking",
"title": "委托货代订舱 / Booking request to forwarder",
"en": "Subject: Booking request — {产品}, {柜型}, ETD {日期}\n\nHi {货代},\n\nPlease book space for {产品}:\n- 1x20GP / 40HQ, ______ cbm, ______ kg\n- POL {起运港} / POD {目的港}\n- Cargo ready {日期}, prefer vessel ETD {日期}\n\nQuote freight + surcharges. Need SI cut-off time.\n\nBest,\n{公司}",
"zh": "订舱委托要点：给柜型/体积/重量/起目的港/货好日/期望船期+要运费报价与截单时间；信息齐货代才能准确订舱。"
},
{
"stage": "订舱 / Booking",
"title": "确认订舱放舱通知 / Booking confirmed",
"en": "Subject: Booking confirmed — {船名} / {单号}\n\nHi {公司},\n\nSpace booked:\n- Vessel: {船名} / Voyage {航次}\n- ETD {起运港} {日期} / ETA {日期}\n- Cut-off: {日期}\n\nPlease send SI and VGM in time. Draft B/L to follow.\n\nBest,\n{货代}",
"zh": "放舱通知要点：确认船名/航次/ETD/ETA/截关日；提醒按时交补料(SI)与VGM；这是订舱闭环关键节点。"
},
{
"stage": "订舱 / Booking",
"title": "改配船期 / Change vessel",
"en": "Subject: Re-booking — {产品} to later sailing\n\nHi {货代},\n\nCargo not ready, please move {产品} to next sailing ETD {新日期}.\n\nKeep same POD. Any freight difference? Send updated SO. Cut-off now {新日期}.\n\nBest,\n{公司}",
"zh": "改船期要点：说明原因（货未好）+新期望船期+同目的港；问运费差额并要新订舱单(SO)，保持信息同步。"
},
{
"stage": "订舱 / Booking",
"title": "拼箱/整柜说明 / LCL vs FCL note",
"en": "Subject: LCL or FCL for {产品}?\n\nHi {货代},\n\nFor {产品} ({体积} cbm): is FCL 20GP cheaper than LCL now? If volume grows, we may top up to full container.\n\nAdvise best cost option and transit time.\n\nBest,\n{公司}",
"zh": "拼整柜选择要点：让货代比对LCL与FCL成本与时效；预留「可凑整柜」的空间，为后续降本留口子。"
},
{
"stage": "单据 / Documents",
"title": "发送提单/发票/箱单 / Send B/L, invoice, packing list",
"en": "Subject: Shipping documents for {产品} — {单号}\n\nHi {姓名},\n\nAttached for {产品}:\n- Bill of Lading {单号}\n- Commercial Invoice\n- Packing List\n- (Certificate of Origin if needed)\n\nFor telex release, balance must be settled. Let me know.\n\nBest,\n{公司}",
"zh": "单据发送要点：一次给齐提单/发票/箱单(+产地证)；说明电放需付清尾款，把放单与回款挂钩。"
},
{
"stage": "单据 / Documents",
"title": "原产地证(CO)办理 / Certificate of Origin",
"en": "Subject: Certificate of Origin for {产品}\n\nHi {姓名},\n\nTo help your duty rate in {国家}, we can issue FORM E / CO. Need:\n- HS code\n- Invoice value\n- Consignee details\n\nLead time 2-3 days after shipment. Confirm?\n\nBest,\n{公司}",
"zh": "产地证要点：说明办证可降关税的好处+所需资料（HS码/发票额/收货人）；给办理时效，主动帮客户省清关税。"
},
{
"stage": "单据 / Documents",
"title": "单据不符点处理 / Discrepancy handling",
"en": "Subject: LC discrepancy on {产品} — quick fix\n\nHi {姓名},\n\nBank flagged {不符点} on {产品} docs. To avoid rejection:\n- Option A: amend LC (your bank, 2-3 days)\n- Option B: accept with tolerance (fee)\n\nWhich do you prefer? I'll adjust docs meanwhile.\n\nBest,\n{公司}",
"zh": "不符点处理要点：列出不符点+两选项（改证/接受不符交费）；边改单边等客户决定，缩短 LC 交单周期。"
},
{
"stage": "单据 / Documents",
"title": "电放/正本提单选择 / Telex vs original B/L",
"en": "Subject: B/L type for {产品} — telex or original?\n\nHi {姓名},\n\nFor {产品}, choose:\n- Telex release: faster, no paper B/L, needs balance paid\n- Original B/L: slower, safer for new partners\n\nDefault telex if balance settled. Your call.\n\nBest,\n{公司}",
"zh": "提单方式要点：对比电放（快/需付清）与正本（慢/新客更稳）；默认电放但尊重客户选择，平衡效率与风险。"
},
{
"stage": "新产品 / New product",
"title": "新品发布预告 / New product teaser",
"en": "Subject: New {产品} just launched — early look for you\n\nHi {姓名},\n\nWe just launched our new {产品} line — {卖点}. First batch ready {日期}.\n\nAs a valued partner, you get first pick before public release. Want the lookbook?\n\nBest,\n{公司}",
"zh": "新品预告要点：宣布上新+核心卖点+首批时间；给老客「公开发售前优先选货」特权，制造专属感促关注。"
},
{
"stage": "新产品 / New product",
"title": "老客优先看样邀请 / VIP sample preview",
"en": "Subject: Exclusive sample preview — new {产品}\n\nHi {姓名},\n\nBefore anyone else, I'd love your read on our new {产品}. Samples ready next week.\n\nYour market insight shaped past best-sellers — keen to hear yours first.\n\nBest,\n{公司}",
"zh": "老客看样要点：强调「比别人早」的专属+借其过往选品眼光；用「想先听你的」激发参与与忠诚度。"
},
{
"stage": "新产品 / New product",
"title": "新品目录发送 / Send new catalog",
"en": "Subject: 2026 {产品} catalog — fresh designs inside\n\nHi {姓名},\n\nAttached: our 2026 {产品} catalog with FOB prices and MOQs.\n\nHot this season: {爆款}. Happy to quote any combination or do a mixed trial order.\n\nBest,\n{公司}",
"zh": "新品目录要点：发带价的年度目录+点名本季爆款；鼓励组合报价或混批试单，降低首单门槛。"
},
{
"stage": "新产品 / New product",
"title": "联名/定制开发邀约 / Co-development invite",
"en": "Subject: Let's co-develop a {产品} for {国家}\n\nHi {姓名},\n\nYour buyers know {国家} best. Want to co-design an exclusive {产品} — your color/logo, our production?\n\nLower MOQ for joint projects, shared margin. Open to a brainstorm call?\n\nBest,\n{公司}",
"zh": "定制开发邀约要点：用「你最懂当地市场」捧客户；提联名定制（其设计/我生产、低MOQ、共分利）；邀头脑风暴，升级合作深度。"
},
{
"stage": "客户维护 / Retention",
"title": "季度回访 / Quarterly check-in",
"en": "Subject: Quarterly catch-up — how's {产品} doing?\n\nHi {姓名},\n\nQuarterly note: hope {产品} is moving well. Any stock running low we should prep?\n\nAlso — any new SKU or market you'd like us to develop for next season?\n\nBest,\n{公司}",
"zh": "季度回访要点：定期问候+问库存是否要补+征询下季新需求；把例行回访变成复购与新品线索入口。"
},
{
"stage": "客户维护 / Retention",
"title": "复购提醒 / Reorder reminder",
"en": "Subject: Time to reorder {产品}?\n\nHi {姓名},\n\nBased on last order, your {产品} stock may be running low around {日期}.\n\nReordering now avoids a stockout gap. As a returning partner, same FOB, priority slot reserved.\n\nBest,\n{公司}",
"zh": "复购提醒要点：用「按上次节奏预计某日断货」算准时机；强调老客同价+优先排产，降低复购决策成本。"
},
{
"stage": "客户维护 / Retention",
"title": "客户满意度调查 / Satisfaction survey",
"en": "Subject: 2-minute feedback — help us serve you better\n\nHi {姓名},\n\nWe'd love 2 minutes: how are we doing on {产品} quality, lead time, and service?\n\nReply with 1-5 or free text. Your input directly shapes our improvements.\n\nBest,\n{公司}",
"zh": "满意度调查要点：极短（2分钟/1-5分）降低填写门槛；承诺「反馈直接改进」，让客户感到被重视。"
},
{
"stage": "客户维护 / Retention",
"title": "专属折扣/老客权益 / Loyalty perks",
"en": "Subject: A thank-you perk for your loyalty\n\nHi {姓名},\n\nFor being with us {N} years, here's a loyalty perk: {折扣/免运费/免费升级包装} on your next {产品} order.\n\nJust mention this email when ordering. Grateful for your trust!\n\nBest,\n{公司}",
"zh": "老客权益要点：用合作年限包装专属福利（折扣/免运/升级包装）；「下单提此邮件即享」降低使用门槛，强化黏性。"
},
{
"stage": "货代对接 / Forwarder",
"title": "运费询价 / Freight quote request",
"en": "Subject: Freight quote — {起运港} to {目的港}, {柜型}\n\nHi {货代},\n\nPlease quote for {产品}:\n- Route: {起运港} to {目的港}\n- 1x {柜型}, ______ cbm / ______ kg\n- Incoterms: FOB / CIF\n- Need ETD this {周次}\n\nOcean + air options if possible. Thanks!\n\nBest,\n{公司}",
"zh": "运费询价要点：给航线/柜型/体积重/贸易术语/期望船期；要海空对比，便于按时效成本选方案。"
},
{
"stage": "货代对接 / Forwarder",
"title": "委托运输+资料提供 / Entrust shipment & docs",
"en": "Subject: Shipment instruction — {产品}, SO {单号}\n\nHi {货代},\n\nPlease handle {产品} per SO {单号}:\n- Pickup from factory {日期}\n- SI & VGM by {日期}\n- Notify party: {姓名/公司}\n- Docs to {邮箱}\n\nConfirm receipt and ETD.\n\nBest,\n{公司}",
"zh": "委托运输要点：凭订舱单(SO)下发指令，给提货日/补料截期/通知方/单据寄送；确认收到与ETD，闭环委托。"
},
{
"stage": "货代对接 / Forwarder",
"title": "跟踪物流节点 / Track shipment milestones",
"en": "Subject: Status check — {产品}, B/L {单号}\n\nHi {货代},\n\nWhere is {产品} now? Need:\n- Vessel departed? ETD/ATA\n- Transshipment status\n- ETA {目的港}\n\nClient is asking. Appreciate a quick update.\n\nBest,\n{公司}",

function renderIns(){
 var box=$('insBox');if(!box)return;
 var total=S.leads.length;
 var deal=S.leads.filter(function(l){return l.stage==='成交';}).length;
 var conv=total?Math.round(deal/total*100):0;
 var cnt={};S.leads.forEach(function(l){if(l.stage!=='成交')cnt[l.stage]=(cnt[l.stage]||0)+1;});
 var bot='—',max=0;Object.keys(cnt).forEach(function(k){if(cnt[k]>max){max=cnt[k];bot=k;}});
 var w=0;S.leads.forEach(function(l){var p=(l.stage==='成交'?1:(STAGE_W[l.stage]||0)/100);w+=(l.amount||0)*p;});
 var d8=daysBetween(todayStr(),'2027-02-08');
 var html='';
 html+='<div class="insight"><b>'+TX('转化率','Conversion')+'</b> '+conv+'%（'+TX('成交','deals')+' '+deal+' / '+TX('线索','leads')+' '+total+'）。'+(conv<20?TX('偏低：多数线索卡在','Low: most stuck at')+'「'+bot+'」，'+TX('先集中推进该阶段。','push that stage first.')+'':TX('健康，保持节奏。','Healthy, keep rhythm.'))+'</div>';
 if(bot!=='—')html+='<div class="insight"><b>'+TX('最大瓶颈','Top bottleneck')+'</b> '+max+' '+TX('条卡在','stuck at')+'「'+bot+'」。'+TX('建议：用 AI 跟进序列自动排程，别靠记忆跟。','Use the AI cadence to auto-schedule; don’t rely on memory.')+'</div>';
 html+='<div class="insight"><b>'+TX('加权预测金额','Weighted forecast')+'</b> $'+Math.round(w).toLocaleString()+'（'+TX('按阶段概率折算','by stage probability')+'）。'+TX('这是你本月大概率能拿下的盘子。','Your probable take this month.')+'</div>';
 html+='<div class="insight"><b>'+TX('节期窗口','Festival window')+'</b> '+TX('距 2027 斋月(02-08)约 ','~')+d8+TX(' 天。现在就该给中东/东南亚老客推试样，错过要等一年。',' days to Ramadan 2027. Push samples to Mid-East/SEA clients now — miss it, wait a year.')+'</div>';
 box.innerHTML=html;
}

 {k:'product',q:'你卖什么产品？（要具体，能说出颜色/规格最好）'},

 var a=S._coachAns;
 var rep='';
 rep+='【'+TX('外贸业务体检报告','Foreign Trade Diagnostic')+'】\n';
 rep+=TX('产品','Product')+'：'+(a.product||TX('未填','—'))+'\n'+TX('价格','Price')+'：'+(a.price||TX('未填','—'))+'\n'+TX('客户','Buyer')+'：'+(a.buyer||TX('未填','—'))+'\n'+TX('获客','Acquisition')+'：'+(a.channel||TX('未填','—'))+'\n'+TX('交付','Delivery')+'：'+(a.deliver||TX('未填','—'))+'\n'+TX('月销','Monthly sales')+'：'+(a.sales||TX('未填','—'))+'\n\n';
 rep+='—— '+TX('七项检验','Seven Checks')+' ——\n';
 var hasProduct=/[\u4e00-\u9fa5a-zA-Z]/.test(a.product||'');
 rep+='1.'+TX('印钞机','Moneymaker')+'：'+(hasProduct?TX('产品具体存在，机器可转。','Product is concrete; machine runs.'):TX('产品还说不清，先说出"颜色/规格"。','Product unclear; name color/spec first.'))+'\n';
 var bands=(a.price||'').split(/[\/、,，]/).filter(function(x){return /\d/.test(x);}).length;
 rep+='2.'+TX('定价','Pricing')+'：'+(bands>=2?TX('有多价格带，结构合理。','Multiple tiers, structure OK.'):TX('单价格带 → 按引流/利润分层（价差10倍），别只卖便宜那一种。','Single tier → split drain/profit (10x gap); don’t sell only cheap.'))+'\n';
 rep+='3.'+TX('需求','Demand')+'：B2B '+TX('买家采购是为转售/节期供应，真实需求是"确定感+不缺货"。','buyers purchase to resell/for season; real need is certainty + no stock-out.')+'\n';
 rep+='4.'+TX('流量-变现','Flow')+'：'+TX('获客','acquisition')+'('+(a.channel||TX('未填','—'))+')'+TX('与交付要分开，别在同一处成交。',' and delivery must be separate; don’t close in one place.')+'\n';
 rep+='5.'+TX('道德','Ethics')+'：'+TX('实物贸易，真实交易即好模式；红海里别为保毛利降质隐瞒。','Physical trade, real deal = good model; don’t cut quality to protect margin.')+'\n';
 rep+='6.'+TX('规模化','Scale')+'：'+TX('开发端可 SOP 化交助理；信任与选品留给你本人。','Dev can be SOP’d to assistants; trust & selection stay with you.')+'\n';
 var lvl=a.sales&&/\d/.test(a.sales)?TX('第3层(有人买)','L3 (people pay)'):TX('第2层(找可重复获客)','L2 (repeatable acquisition)');
 rep+='7.'+TX('成长层级','Growth level')+'：'+lvl+'，'+TX('先做实第4层"持续获客系统"，别跳层想品牌。','build L4 "sustained acquisition" first; don’t skip to brand.')+'\n\n';
 var fix=TX('先修「找客户」：把线索按 Pipeline 管起来，别每次从零开发。','Fix "Find Leads" first: pipeline your leads, stop starting from zero.');
 if(bands<2)fix=TX('先修「定位选品」：做产品分层，把漏掉的利润捡回来。','Fix "Positioning" first: tier your products, recover leaked margin.');
 rep+='—— '+TX('结论','Conclusion')+' ——\n'+TX('最大短板','Biggest gap')+'：'+fix+'\n'+TX('明天第一件事','Tomorrow’s first move')+'：'+(bands<2?TX('给老客推一款利润款试样。','Push a profit-tier sample to old clients.'):TX('给 3 个老客发节期问候，启动返单。','Send festival greetings to 3 old clients, start reorders.'))+'\n';
 S._coachDone=rep;S._coachStep=COACH_Q.length;
 refreshAll();
}

function exportJson(){
 var dump={__wb_format:1,__wb_version:'full',exported:todayStr()};
 PERSIST_KEYS.forEach(function(k){
   var val;
   if(k in S && S[k]!==undefined){val=S[k];}
   else{try{var raw=localStorage.getItem(KEY+k);val=(raw!==null)?JSON.parse(raw):undefined;}catch(e){val=undefined;}}
   if(val!==undefined)dump[k]=val;
 });
 var str=JSON.stringify(dump,null,2);
 var a=document.createElement('a');a.download='外贸工作台_全量备份_'+todayStr()+'.json';
 try{var blob=new Blob([str],{type:'application/json'});a.href=(window.URL&&URL.createObjectURL)?URL.createObjectURL(blob):('data:application/json;charset=utf-8,'+encodeURIComponent(str));}
 catch(e){a.href='data:application/json;charset=utf-8,'+encodeURIComponent(str);}
 a.click();toast(TX('已导出全量备份（'+Object.keys(dump).length+' 项数据）','Full backup exported ('+Object.keys(dump).length+' items)'));
}
function importJson(){
 var f=document.createElement('input');f.type='file';f.accept='application/json,.json';
 f.onchange=function(){
  var file=(f.files||[])[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(){
   try{
     var d=JSON.parse(String(r.result||''));
     if(!d||typeof d!=='object'){toast(TX('文件格式错误','Bad file'));return;}
     var n=0;
     PERSIST_KEYS.forEach(function(k){
       if(k in d && d[k]!==undefined){S[k]=d[k];save(k,S[k]);n++;}
     });
     if(d.me&&typeof d.me==='object'){S.me=d.me;save('me',S.me);}
     toast(TX('已恢复 '+n+' 类数据，刷新中…','Restored '+n+' sets, refreshing…'));
     refreshAll();
   }catch(e){toast(TX('文件解析失败，请确认是备份文件','Parse failed — not a backup file'));}
  };
  r.readAsText(file);
 };
 f.click();
}

/* ============ 找客户：外贸搜客原理生成器 ============ */
var FC_BUYER=['importer','distributor','wholesaler','buyer','procurement company','looking for supplier','RFQ'];
var FC_UNIV=['Google','Bing','LinkedIn','Alibaba RFQ'];
var FC_DIRS=[['Europages','https://www.europages.co.uk/search/?q='],['Kompass','https://www.kompass.com/searchCompanies/?text='],['ThomasNet','https://www.thomasnet.com/search.html?cov=WU&what='],['Made-in-China','https://www.made-in-china.com/companysearch.do?keyword='],['Google Maps','https://www.google.com/maps/search/']];
var FC_GEO={'中东':'UAE','东南亚':'Vietnam','欧美':'USA','非洲':'Nigeria','全球':''};
function fcGeo(m){return FC_GEO[m]||'';}
function fcUnivUrl(p,q){
 if(p==='Google')return 'https://www.google.com/search?q='+encodeURIComponent(q);
 if(p==='Bing')return 'https://www.bing.com/search?q='+encodeURIComponent(q);
 if(p==='LinkedIn')return 'https://www.linkedin.com/search/results/companies/?keywords='+encodeURIComponent(q);
 if(p==='Alibaba RFQ')return 'https://sourcing.alibaba.com/rfq/search.htm?keywords='+encodeURIComponent(q);
 return 'https://www.google.com/search?q='+encodeURIComponent(q);
}
function fcDirUrl(p,q){
 if(p==='Google Maps')return 'https://www.google.com/maps/search/'+encodeURIComponent(q+' importer');
 var base='';
 for(var i=0;i<FC_DIRS.length;i++){if(FC_DIRS[i][0]===p){base=FC_DIRS[i][1];break;}}
 return base+encodeURIComponent(q);
}
function fcUrl(p,q){ return (FC_UNIV.indexOf(p)>=0)?fcUnivUrl(p,q):fcDirUrl(p,q); }
function fcMatrix(q, market){
 q=String(q||'').trim(); if(!q) return [];
 var geo=fcGeo(market), list=[], i, j;
 for(i=0;i<FC_BUYER.length;i++){
  var full=(q+' '+FC_BUYER[i]+(geo?' '+geo:'')).trim();
  for(j=0;j<FC_UNIV.length;j++){ list.push({p:FC_UNIV[j], q:full}); }
 }
 var dq=(q+(geo?' '+geo:'')).trim();
 for(i=0;i<FC_DIRS.length;i++){ list.push({p:FC_DIRS[i][0], q:dq}); }
 return list;
}
function fcGo(p,q){ var u=fcUrl(p,q); if(typeof window!=='undefined'&&window.open)window.open(u,'_blank'); }
function fcSearch(){
 var q=($('fc_q')&&$('fc_q').value||'').trim();
 if(!q){toast(TX('先输入产品词','Enter a product first'));return;}
 S._fcQ=q; S._fcMarket=($('fc_market')&&$('fc_market').value)||'全球';
 S._fcRes=[]; S._fcErr=''; S._fcMore=false;
 S._fcHist=S._fcHist||[];
 var hs=[]; hs.push(q);
 for(var i=0;i<S._fcHist.length;i++){ if(S._fcHist[i]!==q) hs.push(S._fcHist[i]); }
 S._fcHist=hs.slice(0,8); save('_fcHist',S._fcHist);
 refreshAll();
}
function fcHist(qx){ S._fcQ=String(qx||''); S._fcRes=[]; S._fcErr=''; S._fcMore=false; refreshAll(); }
function fcClear(){ S._fcQ=''; S._fcRes=[]; S._fcErr=''; S._fcMore=false; refreshAll(); }
function fcExport(){
 var list=fcMatrix(S._fcQ, S._fcMarket);
 if(!list.length){toast(TX('没有可导出的内容','Nothing to export'));return;}
 var rows=[[TX('序号','#'),TX('平台','Platform'),TX('搜索式','Query'),TX('链接','URL')]];
 for(var i=0;i<list.length;i++){ rows.push([i+1,list[i].p,list[i].q,fcUrl(list[i].p,list[i].q)]); }
 var csv='\ufeff'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n');
 dlFile(csv,TX('找客户搜索入口','find-customer')+'_'+String(S._fcQ).replace(/[^\w\u4e00-\u9fa5]+/g,'_')+'.csv','text/csv;charset=utf-8');
 toast(TX('已导出','Exported'));
}
function fcCopyAll(){var list=fcMatrix(S._fcQ,S._fcMarket);if(!list.length){toast(TX('先搜索一个产品词','Search a product first'));return;}var urls=list.map(function(it){return fcUrl(it.p,it.q);});copyText(urls.join('\n'));toast(TX('已复制 '+list.length+' 条链接','Copied '+list.length+' links'));}
function fcGrab(){
 var q=String(S._fcQ||'').trim();
 if(!q){toast(TX('先搜索一个产品词','Search a product first'));return;}
 S._fcBusy=true; S._fcErr=''; S._fcRes=[]; refreshAll();
 var first=(q+' '+FC_BUYER[0]+(fcGeo(S._fcMarket)?' '+fcGeo(S._fcMarket):'')).trim();
 var target='https://www.bing.com/search?q='+encodeURIComponent(first)+'&count=30';
 var px=['https://api.allorigins.win/raw?url='+encodeURIComponent(target),'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(target),'https://r.jina.ai/'+target];
 var i=0;
 function next(){
  if(i>=px.length){ S._fcBusy=false; S._fcErr=TX('没抓到（公共代理被限流或不通）。用上面的入口，点开就是真实买家列表。','Grab failed (proxy rate-limited). Use the entries above for real buyer lists.'); refreshAll(); return; }
  var u=px[i++];
  wsFetch(u,7000).then(function(txt){ var r=wsParse(txt); S._fcBusy=false; if(r&&r.length){S._fcRes=r.slice(0,20);S._fcErr='';} else {S._fcErr=TX('拿到页面但没解析出结果，用上面的入口。','Got page but no results.');} refreshAll(); })['catch'](function(){next();});
 }
 next();
}

 h+='<button class="btn" data-action="fcSearch">'+TX('生成搜索入口','Generate')+'</button></div>';
 var hist=S._fcHist||[];
 if(hist.length){ h+='<div style="margin:8px 0 0"><span style="font-size:12px;color:var(--sub)">'+TX('最近搜过：','Recent: ')+'</span>';

  for(var j=0;j<show.length;j++){
   var it=show[j];

<script>

    u=(u||'').trim();if(!u)return '';

    if(!/^https?:\/\//i.test(u))u='https://'+u;
    try{
      var p=new URL(u);
      var m=p.pathname.match(/project\/([a-zA-Z0-9]+)/);
      if(/supabase\.com$/i.test(p.hostname)&&m)return 'https://'+m[1]+'.supabase.co';
      return p.origin;
    }catch(e){return u.replace(/\/+$/,'');}
  }
  function getCfg(){try{var c=JSON.parse(localStorage.getItem(CFG_KEY)||'{}');if(c.url)c.url=normUrl(c.url);return c;}catch(e){return {};}}
  function setCfg(o){if(o&&o.url)o.url=normUrl(o.url);localStorage.setItem(CFG_KEY,JSON.stringify(o));}
  function snap(){var o={},k;for(var i=0;i<localStorage.length;i++){k=localStorage.key(i);if(k&&k.indexOf(KEY)===0)o[k]=localStorage.getItem(k);}return o;}
  function applySnapshot(s){if(!s)return;var k;for(k in s){localStorage.setItem(k,s[k]);}}
  function client(){var cfg=getCfg();if(!cfg.url||!cfg.key)return null;if(window.__sbErr||!window.supabase)return null;try{return supabase.createClient(cfg.url,cfg.key);}catch(e){return null;}}

  function toast(msg,ok){
    var t=document.getElementById('sbToast');
    if(!t){t=el('div');t.id='sbToast';t.style.cssText='position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:100001;background:#0f172a;color:#fff;padding:8px 14px;border-radius:10px;font:13px/1.4 system-ui;box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;pointer-events:none;max-width:84vw;text-align:center';document.body.appendChild(t);}
    t.textContent=msg;t.style.color=ok===false?'#fca5a5':(ok===true?'#86efac':'#fff');t.style.opacity='1';
    clearTimeout(t._tm);t._tm=setTimeout(function(){t.style.opacity='0';},2400);
  }

  var ov=el('div');ov.id='authOverlay';
  ov.style.cssText='position:fixed;inset:0;z-index:10000;background:#0f172a;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,\'Microsoft YaHei\',sans-serif';
  document.body.appendChild(ov);

  function cfgUI(){
    ov.style.display='flex';
    ov.innerHTML='<div style="width:440px;max-width:92vw;background:#fff;border-radius:16px;padding:24px;color:#0f172a">'+
      '<h2 style="margin:0 0 6px;font-size:20px">云同步版 · 首次设置</h2>'+
      '<p style="color:#64748b;font-size:13px;line-height:1.6;margin:0 0 14px">先填入你的 Supabase 项目信息（左侧 <b>Data API</b> 页的 Project URL，加上 <b>API Keys</b> 页的 anon public key）。<br><b style="color:#b45309">URL 只填到 https://xxxx.supabase.co 为止，不要带后面的 /rest/v1、/auth/v1 等路径。</b><br>资料按邮箱账号隔离存储，别人看不到你的数据。</p>'+
      '<label style="font-size:13px;font-weight:600">Supabase URL</label><input id="sbUrl" style="width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;margin:4px 0 10px" placeholder="https://xxxx.supabase.co">'+
      '<label style="font-size:13px;font-weight:600">Anon Key</label><input id="sbKey" style="width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;margin:4px 0 14px" placeholder="eyJhbGci...">'+
      '<button id="sbSave" style="width:100%;background:#1e3a8a;color:#fff;border:0;border-radius:8px;padding:11px;font-weight:700;cursor:pointer">保存并继续</button>'+
      '<p id="cfgMsg" style="font-size:12px;color:#dc2626;min-height:16px;margin:8px 0 0"></p></div>';
    var cfg=getCfg();if(cfg.url)$('#sbUrl').value=cfg.url;if(cfg.key)$('#sbKey').value=cfg.key;
    $('#sbSave').onclick=function(){
      var u=normUrl($('#sbUrl').value),k=$('#sbKey').value.trim();
      if(!u||!k){$('#cfgMsg').textContent='两项都要填';return;}
      $('#sbUrl').value=u;
      if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u)){$('#cfgMsg').textContent='URL 看起来不对：应为 https://你的项目.supabase.co（不要带后面的路径）。';return;}
      setCfg({url:u,key:k});loginUI();
    };
  }

  function loginUI(){
    ov.style.display='flex';
    ov.innerHTML='<div style="width:440px;max-width:92vw;background:#fff;border-radius:16px;padding:24px;color:#0f172a">'+
      '<h2 style="margin:0 0 4px;font-size:20px">登录 / 注册</h2>'+
      '<p style="color:#64748b;font-size:13px;margin:0 0 14px">用邮箱+密码登录，任意电脑用同一邮箱都能看到你的资料。</p>'+
      '<label style="font-size:13px;font-weight:600">邮箱</label><input id="em" type="email" style="width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;margin:4px 0 10px" placeholder="you@example.com">'+
      '<label style="font-size:13px;font-weight:600">密码（至少6位）</label><input id="pw" type="password" style="width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;margin:4px 0 14px" placeholder="••••••">'+
      '<div style="display:flex;gap:8px"><button id="signin" style="flex:1;background:#1e3a8a;color:#fff;border:0;border-radius:8px;padding:11px;font-weight:700;cursor:pointer">登录</button><button id="signup" style="flex:1;background:#16a34a;color:#fff;border:0;border-radius:8px;padding:11px;font-weight:700;cursor:pointer">注册</button></div>'+
      '<p id="authMsg" style="font-size:12px;min-height:16px;margin:8px 0 0"></p>'+
      '<button id="cfgBtn" style="margin-top:10px;background:none;border:0;color:#2563eb;font-size:12px;cursor:pointer;text-decoration:underline">修改 Supabase 配置</button></div>';
    $('#signin').onclick=function(){doAuth(false);};
    $('#signup').onclick=function(){doAuth(true);};
    $('#cfgBtn').onclick=cfgUI;
  }

  function setMsg(t,ok){var m=$('#authMsg');if(!m)return;m.textContent=t;m.style.color=ok===false?'#dc2626':(ok===true?'#16a34a':'#475569');}

  function friendly(m){
    m=(m||'请求失败').trim();
    if(/Invalid path/i.test(m))return 'Supabase URL 填错了：只填 https://你的项目.supabase.co，不要带 /rest/v1、/auth/v1 这类路径。点下面"修改 Supabase 配置"改一下即可。';
    if(/Invalid API key|No API key|JWT/i.test(m))return 'Anon Key 填错了，请重新复制 anon public key 再试。';
    if(/Email not confirmed/i.test(m))return '邮箱还没确认：请在 Supabase 关掉 "Confirm email"，或先点确认邮件再登录。';
    if(/Invalid login credentials/i.test(m))return '邮箱或密码不对。新账号请先点"注册"。';
    if(/User already registered/i.test(m))return '这个邮箱已注册过，请直接点"登录"。';
    if(/Failed to fetch|NetworkError|Load failed/i.test(m))return '连不上 Supabase：检查网络，并确认 Supabase 的 CORS 允许来源里已加上本网页地址。';
    return m;
  }

  function doAuth(isSignup){
    var sb=client();if(!sb){setMsg('Supabase 未配置或库未加载（需联网）',false);return;}
    var em=$('#em').value.trim(),pw=$('#pw').value;if(!em||!pw){setMsg('请填写邮箱和密码',false);return;}
    if(pw.length<6){setMsg('密码至少6位',false);return;}
    setMsg(isSignup?'注册中…':'登录中…');
    var p=isSignup?sb.auth.signUp({email:em,password:pw}):sb.auth.signInWithPassword({email:em,password:pw});
    p.then(function(r){
      if(r.error){setMsg(friendly(r.error.message),false);return;}
      var u=r.data&&r.data.user,sess=r.data&&r.data.session;
      if(isSignup&&!sess){setMsg('注册成功，请查收确认邮件后登录（或关闭邮箱确认后重试）',true);return;}
      if(!u||!sess){setMsg('未返回用户，请重试',false);return;}
      enterSession(sb,u,sess);
    }).catch(function(e){setMsg(friendly(e&&e.message),false);});
  }

  function enterSession(sb,u,sess){
    KEY='wb_ftloop_'+u.id+'_';
    localStorage.setItem('wb_auth_sess',JSON.stringify({uid:u.id,name:u.email}));
    wbShowUserBar(u.email);
    ov.style.display='none';
    var lo=document.getElementById('wbLogout');
    if(lo){lo.onclick=function(){sb.auth.signOut().then(function(){location.reload();});};}
    sb.from('app_sync').select('data').eq('id',u.id).single().then(function(r){
      if(r.data&&r.data.data)applySnapshot(r.data.data);
      boot();
      addUserControls(sb,u.id);
      startAuto(sb,u.id);
    }).catch(function(){ boot(); addUserControls(sb,u.id); startAuto(sb,u.id); });
  }

  function addUserControls(sb,uid){
    var bar=document.getElementById('wbUserBar');if(!bar)return;
    if(bar.querySelector('#sbUp'))return;
    var up=el('button');up.id='sbUp';up.textContent='☁ 上传';up.style.cssText='margin-left:8px;background:#1e3a8a;color:#fff;border:0;border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer';
    up.onclick=function(){push(sb,uid,true);};
    var down=el('button');down.id='sbDown';down.textContent='☁ 下载';down.style.cssText='margin-left:6px;background:#0e7490;color:#fff;border:0;border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer';
    down.onclick=function(){pull(sb,uid);};
    var auto=el('button');auto.id='sbAuto';auto.textContent=(localStorage.getItem(AUTO_KEY)==='1'?'⏱ 自动:开':'⏱ 自动:关');auto.style.cssText='margin-left:6px;background:#475569;color:#fff;border:0;border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer';
    auto.onclick=function(){var on=localStorage.getItem(AUTO_KEY)!=='1';localStorage.setItem(AUTO_KEY,on?'1':'0');auto.textContent=on?'⏱ 自动:开':'⏱ 自动:关';if(on)startAuto(sb,uid);else stopAuto();toast(on?'已开启自动同步（每30秒）':'已关闭自动同步');};
    bar.appendChild(up);bar.appendChild(down);bar.appendChild(auto);
  }

  function push(sb,uid,feedback){
    var data=snap();
    sb.from('app_sync').upsert({id:uid,data:data,updated_at:new Date().toISOString()}).then(function(r){
      if(r.error){if(feedback)toast('上传失败：'+friendly(r.error.message),false);else console.warn('sync fail',r.error.message);}
      else if(feedback)toast('已上传到云端 ✓');
    }).catch(function(e){if(feedback)toast('上传失败：'+(e&&e.message||'网络错误'),false);});
  }
  function pull(sb,uid){
    sb.from('app_sync').select('data').eq('id',uid).single().then(function(r){
      if(r.error){toast('下载失败：'+friendly(r.error.message),false);return;}
      if(r.data&&r.data.data){applySnapshot(r.data.data);if(typeof refreshAll==='function')refreshAll();else boot();toast('已从云端下载 ✓');}
      else toast('云端还没有数据，请先在一台电脑点「☁ 上传」');
    }).catch(function(e){toast('下载失败：'+(e&&e.message||'网络错误'),false);});
  }
  var timer=null;
  function startAuto(sb,uid){stopAuto();if(localStorage.getItem(AUTO_KEY)!=='1')return;timer=setInterval(function(){push(sb,uid,false);},30000);}
  function stopAuto(){if(timer){clearInterval(timer);timer=null;}}

  function getSessionThen(sb){
    return sb.auth.getSession().then(function(r){
      var sess=r.data&&r.data.session;
      if(sess&&sess.user)return enterSession(sb,sess.user,sess);
      loginUI();
    });
  }

  window.cloudAuthGate=function(){
    var cfg=getCfg();if(!cfg.url||!cfg.key){cfgUI();return;}
    if(window.__sbErr||!window.supabase){loginUI();return;}
    var sb;try{sb=supabase.createClient(cfg.url,cfg.key);}catch(e){cfgUI();return;}
    getSessionThen(sb).catch(function(){loginUI();});
  };
  cloudAuthGate();
})();
</script>

</body>
</html>
