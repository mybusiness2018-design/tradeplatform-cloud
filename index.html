/* ---- 加密：优先 Web Crypto AES-GCM；file:// 无 subtle 时降级为混淆锁（仅防随手翻看） ---- */
function b64enc(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));}
function b64dec(s){var b=atob(s);var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function fbKeystream(pw,len){var h=2166136261;for(var i=0;i<pw.length;i++){h^=pw.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}var out=[],s=h||1;for(var i=0;i<len;i++){s=(Math.imul(s,1103515245)+12345)&0x7fffffff;out.push(s&0xff);}return out;}
function xorBytes(bytes,pw){var ks=fbKeystream(pw,bytes.length);var o=new Uint8Array(bytes.length);for(var i=0;i<bytes.length;i++)o[i]=bytes[i]^ks[i];return o;}
async function deriveKey(pw,salt){
 if(HAS_SUBTLE){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
 }
 return {pw:pw};
}
async function encBlob(obj){
 var j=JSON.stringify(obj);
 if(HAS_SUBTLE){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},CK,new TextEncoder().encode(j));
  return 'a:'+b64enc(iv)+':'+b64enc(ct);
 }
 return 'x:'+b64enc(xorBytes(new TextEncoder().encode(j),CK.pw));
}
async function decBlob(str){
 var p=str.split(':');
 if(p[0]==='a'){
  var iv=b64dec(p[1]),ct=b64dec(p[2]);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},CK,ct);
  return JSON.parse(new TextDecoder().decode(pt));
 }
 return JSON.parse(new TextDecoder().decode(xorBytes(b64dec(p[1]),CK.pw)));
}

async function doUnlock(){
 var pw=($('lk_pw')?$('lk_pw').value:'');
 if(!pw){lkErr(TX('请输入密码','Enter password'));return;}
 var verStr=localStorage.getItem(KEY+'ver');
 if(!HAS_SUBTLE&&verStr&&verStr.indexOf('a:')===0){lkErr(TX('请用在线版(HTTPS)打开以解锁加密数据','Open the HTTPS version to unlock'));return;}
 CK=await deriveKey(pw,b64dec(localStorage.getItem(KEY+'salt')||''));
 try{var tok=await decBlob(verStr);if(tok!==VER_TOKEN)throw 0;}catch(e){lkErr(TX('密码错误','Wrong password'));CK=null;return;}
 MEM={};
 var storeStr=localStorage.getItem(KEY+'store');
 if(storeStr){try{var blob=await decBlob(storeStr);for(var k in blob)MEM[k]=blob[k];}catch(e){lkErr(TX('解密失败，数据可能损坏','Decrypt failed'));CK=null;return;}}
 ENC_ON=true;hideLock();buildState();unlocked();
}
async function doSetPw(){
 var pw=($('lk_pw')?$('lk_pw').value:''),cf=($('lk_cf')?$('lk_cf').value:'');
 if(!pw||pw.length<4){lkErr(TX('密码至少4位','Min 4 chars'));return;}
 if(pw!==cf){lkErr(TX('两次输入不一致','Mismatch'));return;}
 var salt=crypto.getRandomValues(new Uint8Array(16));
 CK=await deriveKey(pw,salt);
 var obj={};PERSIST_KEYS.forEach(function(k){obj[k]=(S&&S[k]!==undefined)?S[k]:load(k,null);});
 MEM=obj;
 localStorage.setItem(KEY+'salt',b64enc(salt));
 localStorage.setItem(KEY+'ver',await encBlob(VER_TOKEN));
 localStorage.setItem(KEY+'store',await encBlob(obj));
 localStorage.setItem(KEY+'enc','1');
 PERSIST_KEYS.forEach(function(k){localStorage.removeItem(KEY+k);});
 ENC_ON=true;hideLock();toast(TX('已开启加密锁','Encryption on'));refreshAll();
}

 CK=await deriveKey(pw,b64dec(localStorage.getItem(KEY+'salt')||''));
 try{var tok=await decBlob(localStorage.getItem(KEY+'ver'));if(tok!==VER_TOKEN)throw 0;}catch(e){lkErr(TX('密码错误','Wrong password'));CK=null;return;}
 PERSIST_KEYS.forEach(function(k){if(k in MEM)localStorage.setItem(KEY+k,JSON.stringify(MEM[k]));});
 ['enc','salt','ver','store'].forEach(function(k){localStorage.removeItem(KEY+k);});
 ENC_ON=false;CK=null;MEM={};hideLock();toast(TX('已关闭密码锁','Lock off'));refreshAll();
}
function showLock(mode){

  h+='<div class="lockcard"><div class="lockic">🔒</div><h2>'+TX('外贸一体化平台','FT Loop Workbench')+'</h2><p class="muted">'+TX('已开启加密锁，输入密码解锁本地数据。','Encryption on. Enter password to unlock local data.')+'</p>';

 }else if(mode==='change'){
  h+='<div class="lockcard"><div class="lockic">🔑</div><h2>'+TX('修改密码','Change password')+'</h2>';
  h+='<input id="lk_old" type="password" class="lockin" placeholder="'+TX('原密码','Old password')+'">';
  h+='<input id="lk_pw" type="password" class="lockin" placeholder="'+TX('新密码','New password')+'">';
  h+='<input id="lk_cf" type="password" class="lockin" placeholder="'+TX('再次输入','Confirm')+'">';
  h+='<button class="btn lockbtn" data-action="changePw">'+TX('确认修改','Confirm')+'</button>';
  h+='<button class="locklink" data-action="hideLock">'+TX('取消','Cancel')+'</button></div>';

  h+='<div class="lockcard"><div class="lockic">🔓</div><h2>'+TX('关闭密码锁','Turn off lock')+'</h2><p class="muted">'+TX('关闭后数据改回明文存储。','After off, data stored in plaintext.')+'</p>';
  h+='<input id="lk_pw" type="password" class="lockin" placeholder="'+TX('输入密码确认','Enter password')+'">';

  h+='<button class="locklink" data-action="hideLock">'+TX('取消','Cancel')+'</button></div>';
 }
 h+='<div id="lkErr" class="lkerr"></div>';
 box.innerHTML=h;box.style.display='flex';
}
function hideLock(){var b=$('lock');if(b){b.style.display='none';b.innerHTML='';}}
function lkErr(m){var e=$('lkErr');if(e)e.textContent=m;}
function lockReset(){
 openModal(TX('清空所有数据','Wipe all'),TX('忘记密码只能清空数据重来（不可恢复）。确定？','Forgot password → wipe all data (unrecoverable). Sure?'),function(){
  for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i);if(k&&k.indexOf(KEY)===0)localStorage.removeItem(k);}
  ENC_ON=false;CK=null;MEM={};hideLock();location.reload();
 });
}

var STAGE_W={'待开发':5,'已联系':15,'已回复':30,'试样':55,'报价':75,'成交':100};
function scoreLead(l){
 var s=STAGE_W[l.stage]||0;
 var days=Math.round((new Date(todayStr())-new Date(l.last))/864e5);
 if(days<=3)s+=10;else if(days<=7)s+=5;else if(days>=21)s-=8;
 if(l.amount>=2000)s+=8;else if(l.amount>0)s+=4;
 if(['中东','东南亚'].indexOf(l.market)>=0)s+=4;
 s=Math.max(0,Math.min(100,s));
 return s;
}

/* ============ 每日竞品搜索（独立模块） ============ */
var WS_PFS=['Alibaba','1688','Amazon','eBay','AliExpress','Etsy','MIC','Google','Bing','Trends'];
var WS_DEF=['Alibaba','1688','Amazon','eBay','AliExpress','Google'];
function wsUrl(p,q){
 if(p==='Bing')return 'https://www.bing.com/search?q='+encodeURIComponent(q||'');
 return cpPfUrl(p,q);
}
function wsGo(p,q){
 var u=wsUrl(p,q);
 if(typeof window!=='undefined'&&window.open)window.open(u,'_blank');
}
function wsVariants(q){
 q=String(q||'').trim();
 if(!q)return [];
 return [q,'wholesale '+q,'bulk '+q,q+' supplier',q+' manufacturer',q+' factory price',q+' MOQ',q+' OEM ODM'];
}
function wsMatrix(q,plat){
 var vs=wsVariants(q);
 if(!vs.length)return [];
 var ps=(plat&&plat!=='all')?[plat]:WS_PFS;
 var out=[],i,j;
 for(i=0;i<vs.length;i++){for(j=0;j<ps.length;j++){out.push({p:ps[j],q:vs[i]});}}
 return out;
}
function wsUnesc(t){
 return String(t||'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ').replace(/&amp;/g,'&');
}
function wsParse(html){
 var out=[];
 var blocks=String(html||'').split('<li class="b_algo"');
 for(var i=1;i<blocks.length&&out.length<25;i++){
  var b=blocks[i];
  var a=/<a[^>]+href="(https?:\/\/[^"]+)"[^>]*>([\s\S]*?)<\/a>/.exec(b);
  if(!a)continue;
  var t=wsUnesc(String(a[2]).replace(/<[^>]+>/g,'')).trim();
  if(!t||t.length<3)continue;
  var pm=/<p[^>]*>([\s\S]*?)<\/p>/.exec(b);
  var sn=pm?wsUnesc(String(pm[1]).replace(/<[^>]+>/g,'')).trim():'';
  out.push({t:t,u:a[1],s:sn.slice(0,240)});
 }
 return out;
}
function wsFetch(url,ms){
 var limit=ms||7000;
 return new Promise(function(resolve,reject){
  var done=false,opt={};
  var to=setTimeout(function(){if(!done){done=true;reject(new Error('timeout'));}},limit);
  try{
   if(typeof AbortController!=='undefined'){
    var c=new AbortController();opt.signal=c.signal;
    setTimeout(function(){try{c.abort();}catch(e){}},limit);
   }
  }catch(e){}
  fetch(url,opt).then(function(r){
   if(done)return;
   done=true;clearTimeout(to);
   if(!r.ok){reject(new Error('HTTP '+r.status));return;}
   resolve(r.text());
  }).catch(function(e){if(!done){done=true;clearTimeout(to);reject(e);}});
 });
}
function wsSearch(){
 var q=($('ws_q')&&$('ws_q').value||'').trim();
 if(!q){toast(TX('请先输入产品关键词','Enter a keyword first'));return;}
 S._wsQ=q;
 S._wsPlat=($('ws_plat')&&$('ws_plat').value)||'all';
 S._wsRes=[];S._wsErr='';S._wsMore=false;
 S._wsHist=S._wsHist||[];
 var hs=[];hs.push(q);
 for(var i=0;i<S._wsHist.length;i++){if(S._wsHist[i]!==q)hs.push(S._wsHist[i]);}
 S._wsHist=hs.slice(0,8);save('_wsHist',S._wsHist);
 refreshAll();
}
function wsHist(q){
 S._wsQ=String(q||'');S._wsRes=[];S._wsErr='';S._wsMore=false;refreshAll();
}
function wsClear(){
 S._wsQ='';S._wsRes=[];S._wsErr='';S._wsMore=false;refreshAll();
}
function wsExport(){
 var list=wsMatrix(S._wsQ,S._wsPlat);
 if(!list.length){toast(TX('没有可导出的内容','Nothing to export'));return;}
 var rows=[[TX('序号','#'),TX('平台','Platform'),TX('搜索词','Keyword'),TX('链接','URL')]];
 for(var i=0;i<list.length;i++){rows.push([i+1,list[i].p,list[i].q,wsUrl(list[i].p,list[i].q)]);}
 var csv='\ufeff'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n');
 dlFile(csv,TX('竞品搜索入口','competitor-search')+'_'+String(S._wsQ).replace(/[^\w\u4e00-\u9fa5]+/g,'_')+'.csv','text/csv;charset=utf-8');
 toast(TX('已导出','Exported'));
}
function wsCopyAll(){var list=wsMatrix(S._wsQ,S._wsPlat);if(!list.length){toast(TX('先搜索一个关键词','Search a keyword first'));return;}var urls=list.map(function(it){return wsUrl(it.p,it.q);});copyText(urls.join('\n'));toast(TX('已复制 '+list.length+' 条链接，粘贴到浏览器可批量打开','Copied '+list.length+' links'));}
function wsGrab(){
 var q=String(S._wsQ||'').trim();
 if(!q){toast(TX('请先搜索一个关键词','Search a keyword first'));return;}
 S._wsBusy=true;S._wsErr='';S._wsRes=[];refreshAll();
 var target='https://www.bing.com/search?q='+encodeURIComponent(q)+'&count=30';
 var px=[
  'https://api.allorigins.win/raw?url='+encodeURIComponent(target),
  'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(target),
  'https://r.jina.ai/'+target
 ];
 var i=0;
 function next(){
  if(i>=px.length){
   S._wsBusy=false;
   S._wsErr=TX('没抓到（公共代理被限流或不通）。这是常态，不是故障——直接用上面的搜索入口，点开就是平台真实结果。','Grab failed (proxy rate-limited). This is normal - just use the search entries above, each opens real results.');
   refreshAll();return;
  }
  var u=px[i++];
  wsFetch(u,7000).then(function(txt){
   var r=wsParse(txt);
   S._wsBusy=false;
   if(r&&r.length){S._wsRes=r.slice(0,20);S._wsErr='';}
   else{S._wsErr=TX('拿到了页面但没解析出结果。请直接用上面的搜索入口。','Got the page but no results parsed. Use the entries above.');}
   refreshAll();
  })['catch'](function(){next();});
 }
 next();
}
function wsSection(){
 var q=String(S._wsQ||'').trim();
 var plat=S._wsPlat||'all';
 var h='<div class="card" style="margin-bottom:12px;border:1px solid #534AB7">';
 h+='<h3 style="margin:0 0 4px;font-size:16px">'+TX('每日竞品搜索','Daily Competitor Search')+'</h3>';
 h+='<div class="hint" style="margin:0 0 8px">'+TX('输一个产品词，一次生成几十条搜索入口，点任意一条直接打开该平台的真实结果页（跟你自己上网搜一样，只是省去你一个个开网页）。','Enter a product keyword, get dozens of search entries - each opens that platform real results page (same as searching yourself, minus opening tabs one by one).')+'</div>';
 h+='<div class="row" style="flex-wrap:wrap"><input id="ws_q" style="flex:2;min-width:180px" placeholder="'+TX('如 muslim prayer pillow / 移动电源 / power bank','e.g. muslim prayer pillow / power bank')+'" value="'+esc(q)+'">';
 h+='<select id="ws_plat" style="flex:1;min-width:120px"><option value="all"'+((plat==='all')?' selected':'')+'>'+TX('全部平台','All platforms')+'</option>';
 for(var i=0;i<WS_PFS.length;i++){
  h+='<option value="'+WS_PFS[i]+'"'+((plat===WS_PFS[i])?' selected':'')+'>'+esc(WS_PFS[i])+'</option>';
 }
 h+='</select><button class="btn" data-action="wsSearch">'+TX('搜索','Search')+'</button></div>';
 var hist=S._wsHist||[];
 if(hist.length){
  h+='<div style="margin:8px 0 0"><span style="font-size:12px;color:var(--sub)">'+TX('最近搜过：','Recent: ')+'</span>';
  for(var k=0;k<hist.length;k++){
   h+='<button class="btn ghost mini" data-action="wsHist" data-q="'+esc(hist[k])+'" style="margin:0 4px 4px 0">'+esc(hist[k])+'</button>';
  }
  h+='</div>';
 }
 if(q){
  var list=wsMatrix(q,plat);
  var show=S._wsMore?list:list.slice(0,20);
  h+='<div style="margin-top:10px;font-size:13px;font-weight:600">'+TX('搜索入口 ','Search entries ')+'<span style="color:#534AB7">'+list.length+'</span>'+TX(' 条（当前显示 ',' (showing ')+show.length+')</div>';
  for(var j=0;j<show.length;j++){
   var it=show[j];
   h+='<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">';
   h+='<span style="font-size:11px;color:var(--sub);min-width:22px;text-align:right">'+(j+1)+'</span>';
   h+='<span style="font-size:11px;background:#EEEDFE;color:#534AB7;padding:2px 6px;border-radius:5px;min-width:64px;text-align:center">'+esc(it.p)+'</span>';
   h+='<span style="flex:1;font-size:13px;min-width:0;word-break:break-all">'+esc(it.q)+'</span>';
   h+='<button class="btn ghost mini" data-action="wsGo" data-p="'+esc(it.p)+'" data-q="'+esc(it.q)+'">'+TX('打开','Open')+'</button>';
   h+='</div>';
  }
  if(list.length>20){
   h+='<button class="btn ghost mini" data-action="wsMore" style="margin-top:8px">'+TX(S._wsMore?'收起':'展开全部（'+list.length+' 条）',S._wsMore?'Collapse':'Show all ('+list.length+')')+'</button>';
  }
  h+='<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn" data-action="wsGrab">'+TX('试用在线抓取（常不通）','Try online grab (often fails)')+'</button><button class="btn ghost mini" data-action="wsCopyAll">'+TX('复制全部链接','Copy all links')+'</button><button class="btn ghost mini" data-action="wsExport">'+TX('导出入口 CSV','Export CSV')+'</button><button class="btn ghost mini" data-action="wsClear">'+TX('清空','Clear')+'</button></div>';
  h+='<div class="hint" style="margin-top:6px">'+TX('抓取说明：走公共代理，成功率不稳定，抓不到是常态、不是坏了；上面的入口永远可用。','Grab note: goes through a public proxy and often fails - that is normal, not broken. The entries above always work.')+'</div>';
  if(S._wsBusy)h+='<div class="hint" style="color:#d97706">'+TX('抓取中…最多约 21 秒','Grabbing... up to ~21s')+'</div>';
  if(S._wsErr)h+='<div class="hint" style="color:#b45309">'+esc(S._wsErr)+'</div>';
  var res=S._wsRes||[];
  if(res.length){
   h+='<div style="font-size:13px;font-weight:600;margin:10px 0 6px">'+TX('抓到的网页结果（','Web results (')+res.length+TX(' 条）',')')+'</div>';
   for(var m=0;m<res.length;m++){
    var r=res[m];
    if(!/^https?:\/\//i.test(r.u||''))continue;
    h+='<div style="border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px">';
    h+='<a href="'+esc(r.u)+'" target="_blank" rel="noopener" style="font-size:13px;font-weight:600;color:#185FA5;text-decoration:none">'+esc(r.t)+'</a>';
    if(r.s)h+='<div style="font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5">'+esc(r.s)+'</div>';
    h+='<div style="font-size:11px;color:var(--sub);margin-top:3px;word-break:break-all">'+esc(String(r.u).slice(0,90))+'</div>';
    h+='</div>';
   }
  }
 }
 h+='</div>';
 return h;
}

function hashStr(t){var h=2166136261;for(var i=0;i<t.length;i++){h^=t.charCodeAt(i);h=(h*16777619)>>>0;}return h>>>0;}
function hotSmartInd(){var m=S.me||{};var txt=((m.market||'')+' '+(m.product||'')).toLowerCase();if(/中东|非洲|阿拉伯|muslim|pray|halal|伊斯兰|家居|礼品|gift|home/.test(txt))return 'home';if(/东南亚/.test(txt))return 'home';if(/欧美|europe|america|us|eu|west|3c|电子/.test(txt))return '3c';if(/美妆|beauty|妆/.test(txt))return 'beauty';if(/玩具|母婴|baby|toy/.test(txt))return 'baby';if(/户外|outdoor|露营|camp/.test(txt))return 'outdoor';return '3c';}
function hotDayRot(){var n=hashStr('day|'+todayStr())%97;return n;}
function hotPool(ind){
 var pool=[],i;
 for(i=0;i<HOT_DB.length;i++)pool.push(HOT_DB[i]);
 var u=S._hotUser||[];
 for(i=0;i<u.length;i++)pool.push(u[i]);
 if(ind==='all')return pool;
 return pool.filter(function(x){return x.ind===ind||x.ind==='all';});
}
function hotPick(ind,cnt){
 var pool=hotPool(ind);
 if(!pool.length)return [];
 var base=todayStr()+'|'+ind+'|'+hotDayRot()+'|'+(S._hotShift||0);
 var out=[],used={},want=cnt<pool.length?cnt:pool.length;
 for(i=0;i<pool.length*4&&out.length<want;i++){
  var idx=hashStr(base+'#'+i)%pool.length;
  if(!used[idx]){used[idx]=1;out.push(pool[idx]);}
 }
 for(i=0;i<pool.length&&out.length<want;i++){if(!used[i]){used[i]=1;out.push(pool[i]);}}
 return out;
}
function hotFavd(k){var f=S.hotFav||[];for(var i=0;i<f.length;i++){if(f[i].k===k)return true;}return false;}
function hotGo(p,k){

 var q=(p==='1688'&&it.cn)?it.cn:it.kw;
 cpGo(p,q);
}
function hotFavToggle(k){
 var it=null;for(var i=0;i<HOT_DB.length;i++){if(HOT_DB[i].k===k)it=HOT_DB[i];}
 if(!it)return;
 S.hotFav=S.hotFav||[];
 var hit=-1;
 for(var j=0;j<S.hotFav.length;j++){if(S.hotFav[j].k===k)hit=j;}

function cpParse(text){
 var t=String(text||'');
 var lines=t.split(/\r?\n/);
 var out=[],seen={};
 var RE_P=/(?:US\s?\$|USD\s?|\$)\s?(\d[\d,]*(?:\.\d{1,2})?)/;
 var RE_PCTX=/(?:price|单价|unit\s*price|cost|amount|金额|报价)\D*?(\d[\d,]*(?:\.\d{1,2})?)/i;
 var RE_M1=/MOQ[^0-9]{0,15}(\d[\d,]*)/i;
 var RE_M2=/(?:Min\.?\s*Order|Minimum\s*Order)[^0-9]{0,15}(\d[\d,]*)/i;
 var RE_M3=/(\d[\d,]*)\s*(?:pcs|pieces|sets|units)\b/i;
 for(var i=0;i<lines.length&&out.length<30;i++){
  var L=lines[i];
  if(!L||L.length<4)continue;
  var pm=RE_P.exec(L);
  if(!pm)pm=RE_PCTX.exec(L);
  if(!pm)continue;
  var price=String(pm[1]).replace(/,/g,'');
  var v=parseFloat(price);
  if(isNaN(v)||v<=0||v>100000)continue;
  var moq='';
  var mm=RE_M1.exec(L)||RE_M2.exec(L)||RE_M3.exec(L);
  if(mm)moq=String(mm[1]).replace(/,/g,'');
  var name=L.replace(RE_P,' ').replace(/\s+/g,' ').trim();
  name=name.replace(/[\-–—\/|]\s*$/,'').trim();
  if(name.length>60)name=name.slice(0,60);
  if(!name)name=TX('(未识别名称)','(name N/A)');
  var key=name+'|'+price+'|'+moq;
  if(seen[key])continue;
  seen[key]=1;
  out.push({name:name,price:price,moq:moq});
 }
 return out;
}

function custInsight(){
 var leads=S.leads;
 var total=leads.length;
 var active=leads.filter(function(l){return l.stage!=='成交';}).length;
 var overdue=leads.filter(function(l){var d=Math.round((new Date(todayStr())-new Date(l.last))/864e5);return d>=14&&l.stage!=='成交';});
 var dealByLead={};(S.deals||[]).forEach(function(d){if(d.leadId)dealByLead[d.leadId]=d;});
 var taskOverdue={};(S.tasks||[]).forEach(function(t){if(!t.done&&t.clientId&&t.due<todayStr()){taskOverdue[t.clientId]=(taskOverdue[t.clientId]||0)+1;}});
 var stageCnt={};PIPE.forEach(function(s){stageCnt[s]=0;});leads.forEach(function(l){stageCnt[l.stage]=(stageCnt[l.stage]||0)+1;});
 var mktCnt={};leads.forEach(function(l){if(l.market)mktCnt[l.market]=(mktCnt[l.market]||0)+1;});
 var lines=leads.map(function(l){
  var days=Math.round((new Date(todayStr())-new Date(l.last))/864e5);
  var follow=days>=14&&l.stage!=='成交';

  var tasksO=taskOverdue[l.id]||0;

  else action=TX('维持触达','Keep in touch');
  return {id:l.id,name:l.name,stage:l.stage,score:scoreLead(l),days:days,follow:follow,market:l.market,amount:(l.amount||''),last:l.last,dealNo:dl?dl.no:'',docPct:dl?Math.round(docDone/DOC_DEF.length*100):null,tasksO:tasksO,action:action};
 }).sort(function(a,b){return (b.follow?1:0)-(a.follow?1:0)|| b.score-a.score;});

 var summary=TX('共 ','Total ')+total+TX(' 个客户，',' clients, ')+active+TX(' 个在谈。',' in pipeline. ');
 if(overdue.length)summary+=overdue.length+TX(' 个已逾期跟进（风险最高）：',' overdue (highest risk): ')+overdue.map(function(l){return l.name;}).join('、')+'。';
 else summary+=TX('暂无逾期，跟进节奏良好。','No overdue — rhythm is good. ');
 if(midEast)summary+=TX('其中 ','Of these ')+midEast+TX(' 个中东客户，距 2027 斋月约 ',' Mid-East clients; ~')+d8+TX(' 天，是试样/返单黄金窗口。',' days to Ramadan 2027 — prime sample/reorder window. ');
 if(lines.length){var top=lines[0];summary+=TX('AI 建议今日优先：','AI suggests today’s priority: ')+top.name+'（'+top.action+'）。';}
 var openTasks=(S.tasks||[]).filter(function(t){return !t.done;}).length;
 return {total:total,active:active,overdue:overdue.length,stageCnt:stageCnt,mktCnt:mktCnt,lines:lines,summary:summary,docAvg:docAvgCal(lines),tasksTotal:openTasks};
}

function dlFile(str,name,type){
 var a=document.createElement('a');a.download=name;
 try{var blob=new Blob([str],{type:type});a.href=(window.URL&&URL.createObjectURL)?URL.createObjectURL(blob):('data:'+type+','+encodeURIComponent(str));}
 catch(e){a.href='data:'+type+','+encodeURIComponent(str);}
 if(document.body&&document.body.appendChild)document.body.appendChild(a);
 a.click();
}
function csvCell(v){v=(v===undefined||v===null)?'':String(v);return /[",\n\r]/.test(v)?('"'+v.replace(/"/g,'""')+'"'):v;}
function parseCsv(text){
 var rows=[],row=[],cur='',q=false;
 text=String(text||'').replace(/^﻿/,'');
 for(var i=0;i<text.length;i++){
  var c=text.charAt(i);
  if(q){
   if(c==='"'){if(text.charAt(i+1)==='"'){cur+='"';i++;}else q=false;}
   else cur+=c;
  } else {
   if(c==='"')q=true;
   else if(c===','){row.push(cur);cur='';}
   else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
   else if(c==='\r'){}
   else cur+=c;
  }
 }
 if(cur!==''||row.length){row.push(cur);rows.push(row);}
 return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
}
function csvMap(head){
 var m={};
 head.forEach(function(h,i){
  var k=String(h||'').trim().toLowerCase().replace(/[\s_]/g,'');
  if(!k)return;
  if(/^(客户名|客户|名称|name|client|customer)$/.test(k))m.name=i;
  else if(/^(国家|country|nation)$/.test(k))m.country=i;
  else if(/^(市场|market|region|area)$/.test(k))m.market=i;
  else if(/^(whatsapp|wa|手机|手机号|电话|phone|tel|mobile)$/.test(k))m.wa=i;
  else if(/^(邮箱|邮件|email|mail|e-mail)$/.test(k))m.email=i;
  else if(/^(产品|product|item|goods)$/.test(k))m.product=i;
  else if(/^(阶段|stage|status|pipe)$/.test(k))m.stage=i;
  else if(/^(金额|amount|value|price|usd)$/.test(k))m.amount=i;
  else if(/^(最近跟进|最后跟进|跟进日期|日期|last|date)$/.test(k))m.last=i;
  else if(/^(备注|note|notes|remark|comment|memo)$/.test(k))m.note=i;
  else if(/^(来源|渠道|source|channel)$/.test(k))m.source=i;
 });
 return m;
}
function exportLeadsCsv(){
 if(!S.leads.length){toast(TX('暂无客户可导出','No clients to export'));return;}
 var head=[TX('客户名','Name'),TX('国家','Country'),TX('市场','Market'),TX('来源','Source'),TX('WhatsApp','WhatsApp'),TX('邮箱','Email'),TX('产品','Product'),TX('阶段','Stage'),TX('金额','Amount'),TX('最近跟进','Last touch'),TX('备注','Note')];
 var lines=[head.map(csvCell).join(',')];
 S.leads.forEach(function(l){
  lines.push([l.name,l.country,l.market,l.source,l.wa,l.email,l.product,l.stage,l.amount,l.last,l.note].map(csvCell).join(','));
 });
 dlFile('﻿'+lines.join('\r\n'),'客户表_'+todayStr()+'.csv','text/csv;charset=utf-8');
 toast(TX('已导出 CSV，可用 Excel 打开编辑','CSV exported, editable in Excel'));
}

function importLeads(){var f=$('leadImpFile');if(!f)return;f.value='';f.onchange=onLeadFile;f.click();}
function onLeadFile(e){
 var file=(e.target.files||[])[0];if(!file)return;
 var r=new FileReader();
 r.onload=function(){
  var text=String(r.result||'');var list=null;
  var t=text.replace(/^\s+/,'');
  if(/\.json$/i.test(file.name)||t.charAt(0)==='{'||t.charAt(0)==='['){
   try{var d=JSON.parse(text);list=(d&&d.leads)?d.leads:(Object.prototype.toString.call(d)==='[object Array]'?d:null);}catch(err){list=null;}
  }
  if(!list){
   var rows=parseCsv(text);
   if(rows.length<2){toast(TX('文件为空或格式不对','Empty or bad format'));return;}
   var m=csvMap(rows[0]);
   if(m.name===undefined){toast(TX('未识别到「客户名」列，请保留表头','No Name column; keep the header row'));return;}
   list=[];
   for(var i=1;i<rows.length;i++){
    var rr=rows[i];
    var nv=(rr[m.name]||'').trim();if(!nv)continue;
    list.push({name:nv,country:(m.country!==undefined?(rr[m.country]||'').trim():''),market:(m.market!==undefined?(rr[m.market]||'').trim():''),wa:(m.wa!==undefined?(rr[m.wa]||'').trim():''),email:(m.email!==undefined?(rr[m.email]||'').trim():''),product:(m.product!==undefined?(rr[m.product]||'').trim():''),stage:(m.stage!==undefined?(rr[m.stage]||'').trim():''),amount:(m.amount!==undefined?(rr[m.amount]||'').trim():''),last:(m.last!==undefined?(rr[m.last]||'').trim():''),note:(m.note!==undefined?(rr[m.note]||'').trim():''),source:(m.source!==undefined?(rr[m.source]||'').trim():'')});
   }
  }
  if(!list||!list.length){toast(TX('没有可导入的客户','No clients found'));return;}
  var add=0,upd=0;
  list.forEach(function(x){
   var hit=null;
   for(var j=0;j<S.leads.length;j++){var l=S.leads[j];if(String(l.name||'').trim()===String(x.name||'').trim()&&String(l.country||'').trim()===String(x.country||'').trim()){hit=l;break;}}
   if(hit)upd++;else add++;
  });
  S._impList=list;
  var pv=list.slice(0,5).map(function(x){return x.name+(x.country?('('+x.country+')'):'');}).join('、');
  openModal(TX('确认导入客户','Confirm import'),TX('共解析到 ','Parsed ')+list.length+TX(' 条：新增 ',' records: new ')+add+TX(' 条，更新 ',' , update ')+upd+TX(' 条。匹配规则：客户名+国家；更新时只覆盖非空字段，不会清空已有内容。',' . Matched by name+country; only non-empty fields overwrite.')+(pv?(' '+TX('预览：','Preview: ')+pv+(list.length>5?'…':'')):''),function(){doImportLeads();});
 };
 r.readAsText(file);
}
function doImportLeads(){
 var list=S._impList||[];var add=0,upd=0;
 list.forEach(function(x){
  var hit=null;
  for(var j=0;j<S.leads.length;j++){var l=S.leads[j];if(String(l.name||'').trim()===String(x.name||'').trim()&&String(l.country||'').trim()===String(x.country||'').trim()){hit=l;break;}}
  if(hit){
   ['market','wa','email','product','stage','amount','last','note'].forEach(function(k){
    if(x[k]!==undefined&&String(x[k]).trim()!==''){
     if(k==='stage'){if(PIPE.indexOf(x.stage)>=0)hit.stage=x.stage;}
    else if(k==='source'){hit.source=x.source;}
     else if(k==='amount'){var n=Number(String(x.amount).replace(/[^0-9.\-]/g,''));if(!isNaN(n))hit.amount=n;}
     else hit[k]=x[k];
    }
   });
   if(!hit.logs)hit.logs=[];
   upd++;
  } else {
   var st=(PIPE.indexOf(x.stage)>=0)?x.stage:'待开发';
   var am=Number(String(x.amount||'').replace(/[^0-9.\-]/g,''));if(isNaN(am))am=0;
   S.leads.push({id:uid(),name:x.name,country:x.country||'',market:x.market||'',wa:x.wa||'',email:x.email||'',product:x.product||'',stage:st,amount:am,last:x.last||todayStr(),note:x.note||'',source:x.source||'',logs:[]});
   add++;
  }
 });
 save('leads',S.leads);S._impList=null;
 toast(TX('导入完成：新增 ','Imported: new ')+add+TX(' 条，更新 ',' , updated ')+upd+TX(' 条',''));
 refreshAll();
}

function libFilter(q){S._libQ=q;var box=$('libList');if(box)box.innerHTML=libListHTML();}
function libDel(id){S.scripts=S.scripts.filter(function(x){return x.id!==id;});save('scripts',S.scripts);refreshAll();}
/* ============ 邮件模版库（开发→成交全流程） ============ */
function libInner(){return S._libTab==='tpl'?tplHTML():mineHTML();}
function mineHTML(){
 var h='<div class="card" style="margin-bottom:14px"><div class="field"><label>'+TX('搜索话术','Search scripts')+'</label><input id="libSearch" placeholder="'+TX('按标题或内容搜索…','Search by title or content…')+'" value="'+esc(S._libQ||'')+'" oninput="libFilter(this.value)"></div>';
 h+='<div class="hint">'+TX('在「触达建联 / 建立信任 / 报价成交 / 复购转介」生成话术后点「存到话术库」即可收录到这里。','Generate in Outreach/Trust/Deal/Reorder, then hit “Save to library” to collect it here.')+'</div></div>';
 h+='<div id="libList">'+libListHTML()+'</div>';
 return h;
}
function tplHTML(){
 var html='<div class="hint">'+TX('从开发到成交的全流程邮件模版，共 '+EMAIL_TPLS.length+' 封，含中英文与占位符 {公司}{姓名}{产品}{国家}。点复制即用，或「存入我的话术」二次编辑。','Full-funnel email templates — '+EMAIL_TPLS.length+' in total, with placeholders. Copy to use, or save to your library.')+'</div>';
 var stages=[]; EMAIL_TPLS.forEach(function(t){ if(stages.indexOf(t.stage)<0) stages.push(t.stage); });
 html+='<div style="margin:10px 0 14px;display:flex;flex-wrap:wrap;gap:6px">';
 html+='<button style="margin:0;padding:4px 10px;border:1px solid '+(!S._tplStage?'#1e3a8a':'#cbd5e1')+';background:'+(!S._tplStage?'#1e3a8a':'#fff')+';color:'+(!S._tplStage?'#fff':'#334155')+';border-radius:999px;font-size:12px;cursor:pointer" data-action="tplStage" data-stage="">'+TX('全部','All')+'</button>';
 stages.forEach(function(s){ var on=S._tplStage===s; html+='<button style="margin:0;padding:4px 10px;border:1px solid '+(on?'#1e3a8a':'#cbd5e1')+';background:'+(on?'#1e3a8a':'#fff')+';color:'+(on?'#fff':'#334155')+';border-radius:999px;font-size:12px;cursor:pointer" data-action="tplStage" data-stage="'+esc(s)+'">'+esc(s)+'</button>'; });
 html+='</div>';
 EMAIL_TPLS.forEach(function(t,gi){
   if(S._tplStage && t.stage!==S._tplStage) return;
   var eid='tplEn_'+gi,zid='tplZh_'+gi;
   html+='<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px"><b style="font-size:14px">'+esc(t.title)+'</b><span class="tag">'+esc(t.stage)+'</span></div>';
   html+='<div class="out" id="'+eid+'">'+esc(t.en)+'</div>';
   html+='<div class="out zh" id="'+zid+'" style="margin-top:6px">'+esc(t.zh)+'</div>';
   html+='<div style="margin-top:8px"><button class="btn ghost mini" data-action="copy" data-copy="'+eid+'">'+TX('复制英文','Copy EN')+'</button><button class="btn ghost mini" data-action="copy" data-copy="'+zid+'" style="margin-left:6px">'+TX('复制中文','Copy ZH')+'</button><button class="btn ghost mini" data-action="tplSave" data-i="'+gi+'" style="margin-left:6px">'+TX('存入我的话术','Save to mine')+'</button></div></div>';
 });
 return html;
}
function tplSave(i){
 var t=EMAIL_TPLS[+i];
 S.scripts.unshift({id:uid(),title:t.title,en:t.en,zh:t.zh,date:todayStr()});
 save('scripts',S.scripts);renderNav();toast(TX('已存入我的话术','Saved to my scripts'));
}

function viewDeliver(){
 var h=shead('deliver',TX('订单SOP + 验货要点。交付稳，复购才来。','Order SOP + QC. Stable delivery → reorders.')+'');
 h+='<div class="card" style="margin-bottom:14px"><h3 style="margin:0 0 8px;font-size:15px">'+TX('订单执行 SOP（可复制）','Order SOP (copyable)')+'</h3>';
 var steps=[TX('收定金 30% 确认','30% deposit confirmed'),TX('下单生产 / 中期跟进','Place order / mid-production follow-up'),TX('出货前验货 QC','Pre-shipment QC'),TX('安排物流 + 提单','Arrange logistics + B/L'),TX('收尾款 70%','Collect 70% balance'),TX('售后回访 + 节期提醒','After-sales + festival reminder')];
 var s=steps.map(function(s,i){return (i+1)+'. '+s;}).join('\n');
 h+='<div class="out" id="dlSop">'+esc(s)+'</div><button class="btn ghost mini" data-action="copy" data-copy="dlSop" style="margin-top:8px">'+TX('复制SOP','Copy SOP')+'</button></div>';
 h+='<div class="card"><h3 style="margin:0 0 8px;font-size:15px">'+TX('验货要点模板（可复制）','QC checklist (copyable)')+'</h3>';
 var qc='【'+TX('验货清单','QC List')+'】\n· '+TX('数量 / 颜色 / 款式 与 PI 一致','Qty/color/style match PI')+'\n· '+TX('刺绣/烫金无脱线、无污渍','No loose threads/stains on embroidery')+'\n· '+TX('尺寸公差 ±1cm','Size tolerance ±1cm')+'\n· '+TX('包装：礼盒款防压、防潮','Packaging: gift box crush/moisture-proof')+'\n· '+TX('吊牌 / 标签 / 唛头 正确','Hangtags/labels/shipping marks correct')+'\n· '+TX('拍照留底 + 视频 15s','Photo + 15s video on file');
 h+='<div class="out" id="dlQc">'+esc(qc)+'</div><button class="btn ghost mini" data-action="copy" data-copy="dlQc" style="margin-top:8px">'+TX('复制验货模板','Copy QC')+'</button></div>';
 h+='<div class="card" style="margin-top:14px;background:#f1f5f9"><div class="shead" style="margin:0"><div class="ic">'+ICON.docs+'</div><div><h2 style="font-size:15px">'+TX('下一步：备齐全套外贸单据','Next: prepare the full document set')+'</h2><p>'+TX('出货前要把 15 项单证一次性备齐——发票、箱单、提单、原产地证、报关单、保险单、汇票、检验证、装船通知、受益人证明，以及按条件出具的熏蒸/海关/领事/船证等。','Before shipment, prepare all 15 docs at once — invoice, packing list, B/L, C/O, customs decl., insurance, draft, inspection, shipping advice, beneficiary cert, plus conditional ones.')+'</p></div></div><div class="row"><button class="btn amber" data-action="nav" data-view="docs">'+TX('去备外贸单据 →','Go to Trade Documents →')+'</button></div>';
 return h;
}
/* ============ 复盘增长 ============ */
function viewReview(){
 var h=shead('review',TX('周/月复盘 + AI 洞察。看转化率与复购率，别只看流水。','Weekly/monthly review + AI insights. Watch conversion, not just revenue.')+'');
 var dev=S.leads.filter(function(l){return l.last>=iso(new Date(),-30);}).length;
 var talking=S.leads.filter(function(l){return ['已联系','已回复','试样','报价'].indexOf(l.stage)>=0;}).length;
 var deal=S.leads.filter(function(l){return l.stage==='成交';}).length;
 var warn=S.leads.filter(function(l){return l.stage!=='成交' && Math.round((new Date(todayStr())-new Date(l.last))/864e5)>=14;}).length;

function exportJson(){

   var val;
   if(k in S && S[k]!==undefined){val=S[k];}

function importJson(){
 var f=document.createElement('input');f.type='file';f.accept='application/json,.json';
 f.onchange=function(){
  var file=(f.files||[])[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(){
   try{
     var d=JSON.parse(String(r.result||''));
     if(!d||typeof d!=='object'){toast(TX('文件格式错误','Bad file'));return;}
     var n=0;
     PERSIST_KEYS.forEach(function(k){
       if(k in d && d[k]!==undefined){S[k]=d[k];save(k,S[k]);n++;}
     });
     if(d.me&&typeof d.me==='object'){S.me=d.me;save('me',S.me);}
     toast(TX('已恢复 '+n+' 类数据，刷新中…','Restored '+n+' sets, refreshing…'));
     refreshAll();
   }catch(e){toast(TX('文件解析失败，请确认是备份文件','Parse failed — not a backup file'));}
  };
  r.readAsText(file);
 };
 f.click();
}

/* ============ 今日待处理 ============ */
function renderToday(){
 var box=$('today');if(!box)return;
 var items=[];
 S.tasks.forEach(function(t){if(!t.done){var od=t.due<todayStr();items.push({txt:t.title,od:od,id:t.id,type:'task'});}});
 S.leads.forEach(function(l){if(l.stage!=='成交'){var days=Math.round((new Date(todayStr())-new Date(l.last))/864e5);if(days>=14)items.push({txt:l.name+' '+TX('已 ','')+days+TX(' 天未跟进','d no follow'),od:true,id:l.id,type:'lead'});}});
 if(!items.length){box.style.display='none';box.innerHTML='';return;}
 box.style.display='block';
 var h='<h3>'+ICON.brand+' '+TX('今天要处理','To handle today')+'（'+items.length+'）</h3>';
 items.slice(0,6).forEach(function(it){
  h+='<div class="ti"><span class="tag '+(it.od?'r':'a')+'">'+(it.od?TX('逾期/预警','Overdue/Alert'):TX('待办','To-do'))+'</span><span class="lbl">'+esc(it.txt)+'</span>';
  if(it.type==='task')h+='<button class="btn green mini" data-action="taskDone" data-id="'+it.id+'">'+TX('完成','Done')+'</button>';
  else h+='<button class="btn ghost mini" data-action="nav" data-view="find">'+TX('去跟进','Follow up')+'</button>';
  h+='<button class="btn ghost mini" data-action="todayEdit" data-type="'+it.type+'" data-id="'+it.id+'">'+TX('编辑','Edit')+'</button>';
  h+='<button class="btn ghost mini" data-action="todayDel" data-type="'+it.type+'" data-id="'+it.id+'">'+TX('删除','Delete')+'</button>';
  h+='</div>';
 });
 box.innerHTML=h;
}

function fcUnivUrl(p,q){
 if(p==='Google')return 'https://www.google.com/search?q='+encodeURIComponent(q);
 if(p==='Bing')return 'https://www.bing.com/search?q='+encodeURIComponent(q);

function fcDirUrl(p,q){
 if(p==='Google Maps')return 'https://www.google.com/maps/search/'+encodeURIComponent(q+' importer');
 var base='';
 for(var i=0;i<FC_DIRS.length;i++){if(FC_DIRS[i][0]===p){base=FC_DIRS[i][1];break;}}
 return base+encodeURIComponent(q);
}
function fcUrl(p,q){ return (FC_UNIV.indexOf(p)>=0)?fcUnivUrl(p,q):fcDirUrl(p,q); }

 q=String(q||'').trim(); if(!q) return [];

 dd.fields.forEach(function(f){var val=$('doc_'+f).value.trim();v[f]=val;S._docVals[f]=val;if(!val)missing.push(DOC_FIELDS[f]?DOC_FIELDS[f].l:f);});

function hubStatus(k,l,follow,days,docPct){

  case 'reach':return {t:TX('触达建联','Outreach'),s:(l.stage==='待开发'?TX('待首触','first'):(l.stage==='已联系'?TX('已触达','touched'):(l.stage==='已回复'?TX('维持中','keep'):'—'))),c:''};
  case 'trust':return {t:TX('建立信任','Trust'),s:(l.stage==='已回复'||l.stage==='试样'||l.stage==='报价')?TX('破冰中','building'):(l.stage==='成交'?TX('已建','built'):TX('待破冰','to build')),c:(l.stage==='成交'?'g':'')};
  case 'deal':return {t:TX('报价成交','Quote'),s:(l.stage==='报价'?TX('待报价','to quote'):'—'),c:(l.stage==='报价'?'r':'')};
  case 'deliver':return {t:TX('交付履约','Delivery'),s:(l.stage==='成交'?TX('交付中','delivering'):'—'),c:(l.stage==='成交'?'y':'')};
  case 'docs':return {t:TX('外贸单据','Docs'),s:(docPct!==null?docPct+'%':'—'),c:(docPct===null?'':(docPct>=100?'g':'y'))};
  case 'repeat':return {t:TX('复购转介','Reorder'),s:(l.stage==='成交'?TX('待复购','to reorder'):'—'),c:(l.stage==='成交'?'y':'')};

 }
 return {t:k,s:'—',c:''};
}

 var x={id:l.id,name:l.name,stage:l.stage,score:scoreLead(l),days:days,follow:follow,market:l.market,docPct:docPct,action:''};
 var w=custNextWhere(x);
 var waBtn360=(l.wa&&/^\+?\d[\d\s\-]{5,}$/.test(l.wa))?'<button class="btn ghost" data-action="leadWa" data-id="'+id+'">WhatsApp</button>':'';
 var emailBtn360=(l.email&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(l.email))?'<button class="btn ghost" data-action="leadEmail" data-id="'+id+'">'+TX('邮件','Email')+'</button>':'';
 var body='<div class="modal-form">'
  +'<label>'+TX('客户名','Name')+'<input value="'+esc(l.name)+'" disabled></label>'
  +'<label>'+TX('国家/市场','Country/Market')+'<input value="'+esc((l.country||'')+' / '+(l.market||''))+'" disabled></label>'
  +'<label>'+TX('WhatsApp / 手机号','WhatsApp / Phone')+'<input value="'+esc(l.wa||'')+'" disabled></label>'
  +'<label>'+TX('邮箱','Email')+'<input value="'+esc(l.email||'')+'" disabled></label>'
  +'<label>'+TX('产品/金额','Product/Amount')+'<input value="'+esc((l.product||'')+' / $'+(l.amount||0))+'" disabled></label>'  +'<label>'+TX('来源渠道','Source')+'<input value="'+esc(l.source||'—')+'" disabled></label>'
  +'<label>'+TX('阶段','Stage')+'<input value="'+esc(l.stage)+'" disabled></label>'
  +'</div>'
  +'<h4 style="margin:12px 0 4px">'+TX('整条闭环状态（点格直达对应模块，AI 自动判断该客户卡在哪段）','Full-loop status (tap a tile to jump; AI shows where this client sits)')+'</h4>'
  +'<div class="hub-grid">'
  +['pos','find','reach','trust','deal','deliver','docs','repeat','today','review'].map(function(k){
     var st=hubStatus(k,l,follow,days,docPct);
     var col=(st.c==='r')?' style="color:#dc2626"':(st.c==='g')?' style="color:#15803d"':(st.c==='y')?' style="color:#b45309"':'';
     return '<div class="hub-cell" data-action="custJump" data-where="'+k+'" data-id="'+id+'">'+st.t+'<b'+col+'>'+esc(st.s)+'</b></div>';
   }).join('')
  +'</div>'
  +'<h4 style="margin:12px 0 4px">'+TX('跟进时间线','Follow-up timeline')+'</h4>'+logs
  +'<h4 style="margin:12px 0 4px">'+TX('关联交易','Linked deals')+'</h4>'+dlist
  +'<div class="row" style="justify-content:space-between;gap:8px;margin-top:14px"><button class="btn ghost" data-action="closeModal">'+TX('关闭','Close')+'</button><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn amber" data-action="custJump" data-where="'+w+'" data-id="'+id+'">'+TX('AI 下一步：','AI next: ')+esc(x.action)+'</button>'+waBtn360+emailBtn360+'<button class="btn ghost" data-action="leadAdv" data-id="'+id+'">'+TX('推进','Advance')+'</button><button class="btn" data-action="leadEdit" data-id="'+id+'">'+TX('编辑','Edit')+'</button></div></div>';
 $('modalBody').innerHTML='<h3>'+TX('客户360','Customer 360')+'：'+esc(l.name)+'</h3>'+body;
 $('modal').classList.add('show');
}
function dealNew(){
 var d={id:uid(),leadId:'',cnee:'',no:'INV-'+new Date().getFullYear()+'-'+(S.deals.length+1),date:todayStr(),amt:0,qty:0,pkg:0,gross:0,net:0,vessel:'',port:'',eta:'',incoterms:'FOB',transport:'sea',woodPkg:false,lc:false,destCountry:'',docs:{}};
 DOC_DEF.forEach(function(x){d.docs[x.id]='todo';});
 S.deals.push(d);S._dealId=d.id;save('deals',S.deals);save('_dealId',S._dealId);refreshAll();toast(TX('已新建交易','Deal created'));
}
function dealEdit(){
 var d=activeDeal();if(!d)return;
 var leads=(S.leads||[]).map(function(l){return '<option value="'+l.id+'"'+(l.id===d.leadId?' selected':'')+'>'+esc(l.name)+'</option>';}).join('');
 var body='<div class="modal-form"><label>'+TX('关联客户','Link customer')+'<select id="de_leadId"><option value="">'+TX('不关联','None')+'</option>'+leads+'</select></label>'
  +'<label>'+TX('买方/Consignee','Buyer')+'<input id="de_cnee" value="'+esc(d.cnee||'')+'"></label>'
  +'<label>'+TX('发票号','Invoice No.')+'<input id="de_no" value="'+esc(d.no||'')+'"></label>'
  +'<label>'+TX('日期','Date')+'<input id="de_date" type="date" value="'+esc(d.date||'')+'"></label>'
  +'<label>'+TX('金额 USD','Amount')+'<input id="de_amt" type="number" value="'+(d.amt||0)+'"></label>'
  +'<label>'+TX('数量 pcs','Qty')+'<input id="de_qty" value="'+(d.qty||0)+'"></label>'
  +'<label>'+TX('件数 CTNS','Packages')+'<input id="de_pkg" value="'+(d.pkg||0)+'"></label>'
  +'<label>'+TX('毛重 KGS','G.W.')+'<input id="de_gross" value="'+(d.gross||0)+'"></label>'
  +'<label>'+TX('净重 KGS','N.W.')+'<input id="de_net" value="'+(d.net||0)+'"></label>'
  +'<label>'+TX('船名航次','Vessel')+'<input id="de_vessel" value="'+esc(d.vessel||'')+'"></label>'
  +'<label>'+TX('目的港','Port')+'<input id="de_port" value="'+esc(d.port||'')+'"></label>'
  +'<label>'+TX('到港 ETA','ETA')+'<input id="de_eta" value="'+esc(d.eta||'')+'"></label>'
  +'</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-action="closeModal">'+TX('取消','Cancel')+'</button><button class="btn" id="deSave">'+TX('保存','Save')+'</button></div>';
 $('modalBody').innerHTML='<h3>'+TX('编辑交易','Edit deal')+'</h3>'+body;
 $('modal').classList.add('show');
 $('deSave').onclick=function(){
  d.leadId=$('de_leadId').value;d.cnee=$('de_cnee').value.trim();d.no=$('de_no').value.trim();d.date=$('de_date').value;d.amt=parseFloat($('de_amt').value)||0;d.qty=parseFloat($('de_qty').value)||0;d.pkg=parseFloat($('de_pkg').value)||0;d.gross=parseFloat($('de_gross').value)||0;d.net=parseFloat($('de_net').value)||0;d.vessel=$('de_vessel').value.trim();d.port=$('de_port').value.trim();d.eta=$('de_eta').value.trim();
  save('deals',S.deals);refreshAll();closeModal();toast(TX('已更新','Updated'));
 };
}
function dealSave(){
 var d=activeDeal();if(!d)return;
 ['cnee','no','date','amt','qty','pkg','gross','net','vessel','port','eta','incoterms'].forEach(function(f){var el=$('deal_'+f);if(el)d[f]=el.value;});
 var dc=$('deal_destCountry');if(dc)d.destCountry=dc.value.trim();
 var dt=$('deal_transport');if(dt)d.transport=dt.value;
 var wp=$('deal_woodPkg');if(wp)d.woodPkg=wp.checked;
 var lc=$('deal_lc');if(lc)d.lc=lc.checked;
 save('deals',S.deals);refreshAll();toast(TX('交易已保存','Deal saved'));
}
function dealSel(){var s=$('dealSel');if(!s)return;S._dealId=s.value;save('_dealId',S._dealId);S._docOpen=null;S._docVals={};S._docTpl=null;S._recShow=false;S._chkShow=false;refreshAll();}
function docRecMap(d){
 var m={};DOC_DEF.forEach(function(x){m[x.id]='';});
 DOC_DEF.forEach(function(x){if(x.cat==='core')m[x.id]='req';});
 if(d.lc){m.beneficiary='req';m.shipping_co='req';}
 if(d.woodPkg){m.fumigation='req';}
 if(d.destCountry){
  if(/中东|uae|阿联酋|egypt|埃及|saudi|沙特|dubai|迪拜/i.test(d.destCountry))m.consular='cond';
  var c=d.destCountry.toLowerCase();
  if(/加纳|ghana|加拿大|canada/.test(c))m.customs_invoice='cond';
 }
 m.weight='cond';
 return m;
}
function docRec(){S._recShow=!S._recShow;S._chkShow=false;refreshAll();}
function docRecPanel(d){
 var m=docRecMap(d);
 var req=DOC_DEF.filter(function(x){return m[x.id]==='req';});
 var cond=DOC_DEF.filter(function(x){return m[x.id]==='cond';});
 var h='<div class="card" style="margin:10px 0;background:#f0f9ff"><h4 style="margin:0 0 6px">'+TX('AI 智能选单结果','AI doc selection')+'</h4>';
 h+='<div class="muted" style="font-size:12.5px">'+TX('必出（核心 + 按你填的条件）：','Required (core + by your inputs):')+'</div>';
 h+=req.map(function(x){return '<span class="tag a" style="margin:2px">'+esc(x.zh)+'</span>';}).join('');
 h+='<div class="muted" style="font-size:12.5px;margin-top:6px">'+TX('建议（按条件可能要）：','Suggested (by condition):')+'</div>';
 h+=cond.length?cond.map(function(x){return '<span class="tag b" style="margin:2px">'+esc(x.zh)+'</span>';}).join(''):'<span class="muted">—</span>';
 h+='<div class="muted" style="font-size:12px;margin-top:6px">'+TX('依据：核心10每票必出；信用证→受益人/船公司证明；木包装→熏蒸证；中东→领事发票；特定国→海关发票。','Basis: core 10 always; L/C to beneficiary/shipping cert; wood to fumigation; Middle East to consular; some countries to customs invoice.')+'</div></div>';
 return h;
}
function docChk(){S._chkShow=!S._chkShow;S._recShow=false;refreshAll();}
function docChkPanel(d){
 var is=[];
 if(!d.cnee)is.push(TX('缺买方 Consignee','Missing buyer (Consignee)'));
 if(!d.no)is.push(TX('缺发票号','Missing invoice no.'));
 if(!d.date)is.push(TX('缺日期','Missing date'));
 if(!d.amt||d.amt<=0)is.push(TX('金额未填或≤0','Amount empty or ≤0'));
 if(!d.qty||d.qty<=0)is.push(TX('数量未填或≤0','Qty empty or ≤0'));
 if(d.transport==='sea'&&!d.vessel)is.push(TX('海运但缺船名航次','Sea but missing vessel'));
 if(d.date&&d.eta&&d.eta<d.date)is.push(TX('到港日早于发货日（ETA<ETD）','ETA earlier than ETD'));
 var h='<div class="card" style="margin:10px 0;background:#fff7ed"><h4 style="margin:0 0 6px">'+TX('AI 一致性校验','AI consistency check')+'</h4>';
 if(!is.length)h+='<div class="tag a">'+TX('通过：关键信息齐全，无明显冲突','PASS: key info complete, no conflict')+'</div>';
 else h+=is.map(function(s){return '<div style="padding:4px 0;color:#b45309;font-size:13px">'+TX('注意：','Note: ')+s+'</div>';}).join('');
 h+='<div class="muted" style="font-size:12px;margin-top:6px">'+TX('提示：保险金额建议为发票110%；提单数量应与发票一致——这些单证共用同一笔交易数据，天然一致。','Tip: insurance ≈110% of invoice; BL qty should match invoice — all docs share this deal, so they stay consistent.')+'</div></div>';
 return h;
}
/* ============ 初始化 ============ */
function init(){hotDailyCheck();hotStartTimer();refreshAll();}

/* ===== 本地身份门禁（纯前端：账号与数据仅存本机浏览器，非云端账号） ===== */
function wbHash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h.toString(16);}
function wbSess(){try{return JSON.parse(localStorage.getItem('wb_auth_sess')||'null');}catch(e){return null;}}
function wbHasSess(){var s=wbSess();return !!(s&&s.uid);}
function wbSessKey(){var s=wbSess();return (s&&s.uid)?('wb_ftloop_'+s.uid+'_'):'wb_ftloop_';}
function wbAccounts(){try{return JSON.parse(localStorage.getItem('wb_auth_accounts')||'[]');}catch(e){return [];}}
function wbShowUserBar(name){
  var b=document.getElementById('wbUserBar');if(b)return;
  b=document.createElement('div');b.id='wbUserBar';
  b.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99999;background:#1f2a44;color:#fff;padding:6px 10px;border-radius:20px;font:13px/1.4 system-ui;box-shadow:0 2px 8px rgba(0,0,0,.3);';
  b.innerHTML='\uD83D\uDC64 '+name+' · <span id="wbLogout" style="color:#7fd1ff;cursor:pointer;">退出</span>';
  document.body.appendChild(b);
  document.getElementById('wbLogout').onclick=function(){localStorage.removeItem('wb_auth_sess');location.reload();};
}
function wbAuthOK(uid,name){
  localStorage.setItem('wb_auth_sess',JSON.stringify({uid:uid,name:name}));
  KEY='wb_ftloop_'+uid+'_';
  var o=document.getElementById('wbAuth');if(o)o.remove();
  wbShowUserBar(name);
  boot();
}
function wbRenderAuth(){
  var css='#wbAuth{position:fixed;inset:0;z-index:100000;background:linear-gradient(135deg,#0f1830,#1b2b50);display:flex;align-items:center;justify-content:center;font-family:system-ui,"Microsoft YaHei",sans-serif;}'+
    '#wbAuth .card{width:340px;max-width:92vw;background:#fff;border-radius:14px;padding:26px 24px;box-shadow:0 10px 40px rgba(0,0,0,.35);}'+
    '#wbAuth .auth-logo{width:48px;height:48px;margin:0 auto 10px;background:#eff6ff;border-radius:12px;display:flex;align-items:center;justify-content:center;}'+
    '#wbAuth .auth-logo svg{width:32px;height:32px;}'+
    '#wbAuth h2{margin:0 0 4px;font-size:19px;color:#16233f;text-align:center;}'+
    '#wbAuth .sub{margin:0 0 16px;font-size:12px;color:#8a93a6;text-align:center;}'+
    '#wbAuth .tabs{display:flex;gap:8px;margin-bottom:14px;}'+
    '#wbAuth .tab{flex:1;text-align:center;padding:8px;font-size:14px;border-radius:8px;cursor:pointer;background:#eef1f7;color:#5a6478;}'+
    '#wbAuth .tab.on{background:#2b6cff;color:#fff;}'+
    '#wbAuth label{display:block;font-size:12px;color:#55617a;margin:10px 0 4px;}'+
    '#wbAuth input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d6dbe6;border-radius:8px;font-size:14px;}'+
    '#wbAuth .btn{margin-top:16px;width:100%;padding:11px;border:0;border-radius:8px;background:#2b6cff;color:#fff;font-size:15px;cursor:pointer;}'+
    '#wbAuth .msg{margin-top:10px;font-size:12px;min-height:16px;}'+
    '#wbAuth .note{margin-top:12px;font-size:11px;color:#9aa3b5;line-height:1.5;}';
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  var box=document.createElement('div');box.id='wbAuth';
  box.innerHTML='<div class="card">'+
    '<div class="auth-logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g stroke="#2563eb"><circle cx="9.5" cy="12" r="7"/><path d="M2.5 12h14"/><path d="M9.5 5c2 2 2 12 0 14"/><path d="M9.5 5c-2 2-2 12 0 14"/></g><path stroke="#f59e0b" d="M12.5 9l8-4-3 8 3 5-7-4"/></svg></div>'+
    '<h2>外贸一体化平台</h2>'+
    '<p class="sub">请先实名登录，进入您自己的工作台</p>'+
    '<div class="tabs"><div class="tab on" data-t="reg">注册</div><div class="tab" data-t="login">登录</div></div>'+
    '<label>实名姓名 *</label><input id="wbName" placeholder="如：张三 / Mr. Ali">'+
    '<label>邮箱 或 电话 *</label><input id="wbContact" placeholder="用于登录的身份标识">'+
    '<label>密码 *</label><input id="wbPwd" type="password" placeholder="设置或输入密码">'+
    '<button class="btn" id="wbGo">注册并进入</button>'+
    '<div class="msg" id="wbMsg"></div>'+
    '<p class="note">说明：本工作台为纯前端工具，账号与数据仅保存在您本机浏览器（localStorage），不是云端账号。同一台设备可多人各自登录、互不干扰；换设备需重新注册。</p>'+
    '</div>';
  document.body.appendChild(box);
  var mode='reg';
  box.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){mode=t.getAttribute('data-t');box.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});t.classList.add('on');document.getElementById('wbGo').textContent=(mode==='reg'?'注册并进入':'登录进入');document.getElementById('wbMsg').textContent='';};});
  document.getElementById('wbGo').onclick=function(){
    var name=document.getElementById('wbName').value.trim();
    var contact=document.getElementById('wbContact').value.trim();
    var pwd=document.getElementById('wbPwd').value;
    var msg=document.getElementById('wbMsg');
    if(!name||!contact||!pwd){msg.style.color='#d33';msg.textContent='请完整填写姓名、邮箱/电话、密码';return;}
    if(!/^[\w.+-]+@[\w-]+\.[\w.-]+$|^\+?[\d\s\-]{6,}$/.test(contact)){msg.style.color='#d33';msg.textContent='邮箱或电话格式不正确';return;}
    var accs=wbAccounts();
    if(mode==='reg'){
      if(accs.some(function(a){return a.contact===contact;})){msg.style.color='#d33';msg.textContent='该邮箱/电话已注册，请切到“登录”';return;}
      var uid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      accs.push({uid:uid,name:name,contact:contact,pw:wbHash(pwd)});
      localStorage.setItem('wb_auth_accounts',JSON.stringify(accs));
      wbAuthOK(uid,name);
    }else{
      var a=accs.find(function(x){return x.contact===contact;});
      if(!a){msg.style.color='#d33';msg.textContent='未找到该账号，请先注册';return;}
      if(a.pw!==wbHash(pwd)){msg.style.color='#d33';msg.textContent='密码错误';return;}
      wbAuthOK(a.uid,a.name);
    }
  };
}
function authGate(){
  if(wbHasSess()){ KEY=wbSessKey(); wbShowUserBar((wbSess().name||'用户')); boot(); return; }
  wbRenderAuth();
}

authGate();
</script>
