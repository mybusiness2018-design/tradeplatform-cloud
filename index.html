/* ---- 启动密码锁 / 本地加密存储 ---- */
function boot(){
 try{localStorage.removeItem(KEY+'enc');}catch(e){}
 ENC_ON=false;buildState();unlocked();
}
function unlocked(){if(ENC_ON)persistAll();init();}
async function doUnlock(){
 var pw=($('lk_pw')?$('lk_pw').value:'');
 if(!pw){lkErr(TX('请输入密码','Enter password'));return;}
 var verStr=localStorage.getItem(KEY+'ver');
 if(!HAS_SUBTLE&&verStr&&verStr.indexOf('a:')===0){lkErr(TX('请用在线版(HTTPS)打开以解锁加密数据','Open the HTTPS version to unlock'));return;}
 CK=await deriveKey(pw,b64dec(localStorage.getItem(KEY+'salt')||''));
 try{var tok=await decBlob(verStr);if(tok!==VER_TOKEN)throw 0;}catch(e){lkErr(TX('密码错误','Wrong password'));CK=null;return;}
 MEM={};
 var storeStr=localStorage.getItem(KEY+'store');
 if(storeStr){try{var blob=await decBlob(storeStr);for(var k in blob)MEM[k]=blob[k];}catch(e){lkErr(TX('解密失败，数据可能损坏','Decrypt failed'));CK=null;return;}}
 ENC_ON=true;hideLock();buildState();unlocked();
}
async function doSetPw(){
 var pw=($('lk_pw')?$('lk_pw').value:''),cf=($('lk_cf')?$('lk_cf').value:'');
 if(!pw||pw.length<4){lkErr(TX('密码至少4位','Min 4 chars'));return;}
 if(pw!==cf){lkErr(TX('两次输入不一致','Mismatch'));return;}
 var salt=crypto.getRandomValues(new Uint8Array(16));
 CK=await deriveKey(pw,salt);
 var obj={};PERSIST_KEYS.forEach(function(k){obj[k]=(S&&S[k]!==undefined)?S[k]:load(k,null);});
 MEM=obj;
 localStorage.setItem(KEY+'salt',b64enc(salt));
 localStorage.setItem(KEY+'ver',await encBlob(VER_TOKEN));
 localStorage.setItem(KEY+'store',await encBlob(obj));
 localStorage.setItem(KEY+'enc','1');
 PERSIST_KEYS.forEach(function(k){localStorage.removeItem(KEY+k);});
 ENC_ON=true;hideLock();toast(TX('已开启加密锁','Encryption on'));refreshAll();
}
async function doChangePw(){
 var oldPw=($('lk_old')?$('lk_old').value:''),pw=($('lk_pw')?$('lk_pw').value:''),cf=($('lk_cf')?$('lk_cf').value:'');
 if(!oldPw){lkErr(TX('请输入原密码','Old pw required'));return;}
 if(!pw||pw.length<4){lkErr(TX('新密码至少4位','Min 4 chars'));return;}
 if(pw!==cf){lkErr(TX('两次输入不一致','Mismatch'));return;}
 CK=await deriveKey(oldPw,b64dec(localStorage.getItem(KEY+'salt')||''));
 try{var tok=await decBlob(localStorage.getItem(KEY+'ver'));if(tok!==VER_TOKEN)throw 0;}catch(e){lkErr(TX('原密码错误','Old wrong'));CK=null;return;}
 var newSalt=crypto.getRandomValues(new Uint8Array(16));
 CK=await deriveKey(pw,newSalt);
 localStorage.setItem(KEY+'salt',b64enc(newSalt));
 localStorage.setItem(KEY+'ver',await encBlob(VER_TOKEN));
 localStorage.setItem(KEY+'store',await encBlob(MEM));
 ENC_ON=true;hideLock();toast(TX('密码已修改','Password changed'));refreshAll();
}
async function doClosePw(){
 var pw=($('lk_pw')?$('lk_pw').value:'');
 if(!pw){lkErr(TX('请输入密码','Enter password'));return;}
 CK=await deriveKey(pw,b64dec(localStorage.getItem(KEY+'salt')||''));
 try{var tok=await decBlob(localStorage.getItem(KEY+'ver'));if(tok!==VER_TOKEN)throw 0;}catch(e){lkErr(TX('密码错误','Wrong password'));CK=null;return;}
 PERSIST_KEYS.forEach(function(k){if(k in MEM)localStorage.setItem(KEY+k,JSON.stringify(MEM[k]));});
 ['enc','salt','ver','store'].forEach(function(k){localStorage.removeItem(KEY+k);});
 ENC_ON=false;CK=null;MEM={};hideLock();toast(TX('已关闭密码锁','Lock off'));refreshAll();
}

 });
}

function uid(){return 'X'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);}
function iso(d,off){var x=new Date(d);if(off)x.setDate(x.getDate()+off);return x.toISOString().slice(0,10);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}
function addDays(a,n){var d=new Date(a);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}

function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},1600);}
function copyText(txt){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast(TX('已复制','Copied'));},function(){fallbackCopy(txt);});}else fallbackCopy(txt);}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(TX('已复制','Copied'));}catch(e){toast(TX('复制失败，请手动','Copy failed'));}document.body.removeChild(ta);}
function copySilent(txt){try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt);}else{var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}}catch(e){}}

var STAGE_W={'待开发':5,'已联系':15,'已回复':30,'试样':55,'报价':75,'成交':100};
function scoreLead(l){
 var s=STAGE_W[l.stage]||0;
 var days=Math.round((new Date(todayStr())-new Date(l.last))/864e5);
 if(days<=3)s+=10;else if(days<=7)s+=5;else if(days>=21)s-=8;
 if(l.amount>=2000)s+=8;else if(l.amount>0)s+=4;
 if(['中东','东南亚'].indexOf(l.market)>=0)s+=4;
 s=Math.max(0,Math.min(100,s));
 return s;
}

 return [q,'wholesale '+q,'bulk '+q,q+' supplier',q+' manufacturer',q+' factory price',q+' MOQ',q+' OEM ODM'];
}
function wsMatrix(q,plat){
 var vs=wsVariants(q);
 if(!vs.length)return [];
 var ps=(plat&&plat!=='all')?[plat]:WS_PFS;
 var out=[],i,j;
 for(i=0;i<vs.length;i++){for(j=0;j<ps.length;j++){out.push({p:ps[j],q:vs[i]});}}
 return out;
}
function wsUnesc(t){
 return String(t||'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ').replace(/&amp;/g,'&');
}
function wsParse(html){
 var out=[];
 var blocks=String(html||'').split('<li class="b_algo"');
 for(var i=1;i<blocks.length&&out.length<25;i++){
  var b=blocks[i];
  var a=/<a[^>]+href="(https?:\/\/[^"]+)"[^>]*>([\s\S]*?)<\/a>/.exec(b);
  if(!a)continue;
  var t=wsUnesc(String(a[2]).replace(/<[^>]+>/g,'')).trim();
  if(!t||t.length<3)continue;
  var pm=/<p[^>]*>([\s\S]*?)<\/p>/.exec(b);
  var sn=pm?wsUnesc(String(pm[1]).replace(/<[^>]+>/g,'')).trim():'';
  out.push({t:t,u:a[1],s:sn.slice(0,240)});
 }
 return out;
}
function wsFetch(url,ms){
 var limit=ms||7000;
 return new Promise(function(resolve,reject){
  var done=false,opt={};
  var to=setTimeout(function(){if(!done){done=true;reject(new Error('timeout'));}},limit);
  try{
   if(typeof AbortController!=='undefined'){
    var c=new AbortController();opt.signal=c.signal;
    setTimeout(function(){try{c.abort();}catch(e){}},limit);
   }
  }catch(e){}
  fetch(url,opt).then(function(r){
   if(done)return;
   done=true;clearTimeout(to);
   if(!r.ok){reject(new Error('HTTP '+r.status));return;}
   resolve(r.text());
  }).catch(function(e){if(!done){done=true;clearTimeout(to);reject(e);}});
 });
}
function wsSearch(){

 S._wsRes=[];S._wsErr='';S._wsMore=false;
 S._wsHist=S._wsHist||[];
 var hs=[];hs.push(q);

 S._wsHist=hs.slice(0,8);save('_wsHist',S._wsHist);
 refreshAll();
}

 for(var i=0;i<list.length;i++){rows.push([i+1,list[i].p,list[i].q,wsUrl(list[i].p,list[i].q)]);}
 var csv='\ufeff'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n');
 dlFile(csv,TX('竞品搜索入口','competitor-search')+'_'+String(S._wsQ).replace(/[^\w\u4e00-\u9fa5]+/g,'_')+'.csv','text/csv;charset=utf-8');
 toast(TX('已导出','Exported'));
}
function wsCopyAll(){var list=wsMatrix(S._wsQ,S._wsPlat);if(!list.length){toast(TX('先搜索一个关键词','Search a keyword first'));return;}var urls=list.map(function(it){return wsUrl(it.p,it.q);});copyText(urls.join('\n'));toast(TX('已复制 '+list.length+' 条链接，粘贴到浏览器可批量打开','Copied '+list.length+' links'));}
function wsGrab(){
 var q=String(S._wsQ||'').trim();
 if(!q){toast(TX('请先搜索一个关键词','Search a keyword first'));return;}
 S._wsBusy=true;S._wsErr='';S._wsRes=[];refreshAll();
 var target='https://www.bing.com/search?q='+encodeURIComponent(q)+'&count=30';
 var px=[
  'https://api.allorigins.win/raw?url='+encodeURIComponent(target),
  'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(target),
  'https://r.jina.ai/'+target
 ];
 var i=0;
 function next(){
  if(i>=px.length){
   S._wsBusy=false;
   S._wsErr=TX('没抓到（公共代理被限流或不通）。这是常态，不是故障——直接用上面的搜索入口，点开就是平台真实结果。','Grab failed (proxy rate-limited). This is normal - just use the search entries above, each opens real results.');
   refreshAll();return;
  }
  var u=px[i++];
  wsFetch(u,7000).then(function(txt){
   var r=wsParse(txt);
   S._wsBusy=false;
   if(r&&r.length){S._wsRes=r.slice(0,20);S._wsErr='';}
   else{S._wsErr=TX('拿到了页面但没解析出结果。请直接用上面的搜索入口。','Got the page but no results parsed. Use the entries above.');}
   refreshAll();
  })['catch'](function(){next();});
 }
 next();
}

function cpParse(text){
 var t=String(text||'');
 var lines=t.split(/\r?\n/);
 var out=[],seen={};
 var RE_P=/(?:US\s?\$|USD\s?|\$)\s?(\d[\d,]*(?:\.\d{1,2})?)/;
 var RE_PCTX=/(?:price|单价|unit\s*price|cost|amount|金额|报价)\D*?(\d[\d,]*(?:\.\d{1,2})?)/i;
 var RE_M1=/MOQ[^0-9]{0,15}(\d[\d,]*)/i;
 var RE_M2=/(?:Min\.?\s*Order|Minimum\s*Order)[^0-9]{0,15}(\d[\d,]*)/i;
 var RE_M3=/(\d[\d,]*)\s*(?:pcs|pieces|sets|units)\b/i;
 for(var i=0;i<lines.length&&out.length<30;i++){
  var L=lines[i];
  if(!L||L.length<4)continue;
  var pm=RE_P.exec(L);
  if(!pm)pm=RE_PCTX.exec(L);
  if(!pm)continue;
  var price=String(pm[1]).replace(/,/g,'');
  var v=parseFloat(price);
  if(isNaN(v)||v<=0||v>100000)continue;
  var moq='';
  var mm=RE_M1.exec(L)||RE_M2.exec(L)||RE_M3.exec(L);
  if(mm)moq=String(mm[1]).replace(/,/g,'');
  var name=L.replace(RE_P,' ').replace(/\s+/g,' ').trim();
  name=name.replace(/[\-–—\/|]\s*$/,'').trim();
  if(name.length>60)name=name.slice(0,60);
  if(!name)name=TX('(未识别名称)','(name N/A)');
  var key=name+'|'+price+'|'+moq;
  if(seen[key])continue;
  seen[key]=1;
  out.push({name:name,price:price,moq:moq});
 }
 return out;
}

/* ============ 客户信息导入/导出（驾驶舱） ============ */
function dlFile(str,name,type){
 var a=document.createElement('a');a.download=name;
 try{var blob=new Blob([str],{type:type});a.href=(window.URL&&URL.createObjectURL)?URL.createObjectURL(blob):('data:'+type+','+encodeURIComponent(str));}
 catch(e){a.href='data:'+type+','+encodeURIComponent(str);}
 if(document.body&&document.body.appendChild)document.body.appendChild(a);
 a.click();
}
function csvCell(v){v=(v===undefined||v===null)?'':String(v);return /[",\n\r]/.test(v)?('"'+v.replace(/"/g,'""')+'"'):v;}
function parseCsv(text){
 var rows=[],row=[],cur='',q=false;
 text=String(text||'').replace(/^﻿/,'');
 for(var i=0;i<text.length;i++){
  var c=text.charAt(i);
  if(q){
   if(c==='"'){if(text.charAt(i+1)==='"'){cur+='"';i++;}else q=false;}
   else cur+=c;
  } else {
   if(c==='"')q=true;
   else if(c===','){row.push(cur);cur='';}
   else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
   else if(c==='\r'){}
   else cur+=c;
  }
 }
 if(cur!==''||row.length){row.push(cur);rows.push(row);}
 return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
}
function csvMap(head){
 var m={};
 head.forEach(function(h,i){
  var k=String(h||'').trim().toLowerCase().replace(/[\s_]/g,'');
  if(!k)return;
  if(/^(客户名|客户|名称|name|client|customer)$/.test(k))m.name=i;
  else if(/^(国家|country|nation)$/.test(k))m.country=i;
  else if(/^(市场|market|region|area)$/.test(k))m.market=i;
  else if(/^(whatsapp|wa|手机|手机号|电话|phone|tel|mobile)$/.test(k))m.wa=i;
  else if(/^(邮箱|邮件|email|mail|e-mail)$/.test(k))m.email=i;
  else if(/^(产品|product|item|goods)$/.test(k))m.product=i;
  else if(/^(阶段|stage|status|pipe)$/.test(k))m.stage=i;
  else if(/^(金额|amount|value|price|usd)$/.test(k))m.amount=i;
  else if(/^(最近跟进|最后跟进|跟进日期|日期|last|date)$/.test(k))m.last=i;
  else if(/^(备注|note|notes|remark|comment|memo)$/.test(k))m.note=i;
  else if(/^(来源|渠道|source|channel)$/.test(k))m.source=i;
 });
 return m;
}

function importLeads(){var f=$('leadImpFile');if(!f)return;f.value='';f.onchange=onLeadFile;f.click();}
function onLeadFile(e){
 var file=(e.target.files||[])[0];if(!file)return;
 var r=new FileReader();
 r.onload=function(){
  var text=String(r.result||'');var list=null;
  var t=text.replace(/^\s+/,'');
  if(/\.json$/i.test(file.name)||t.charAt(0)==='{'||t.charAt(0)==='['){
   try{var d=JSON.parse(text);list=(d&&d.leads)?d.leads:(Object.prototype.toString.call(d)==='[object Array]'?d:null);}catch(err){list=null;}
  }
  if(!list){
   var rows=parseCsv(text);
   if(rows.length<2){toast(TX('文件为空或格式不对','Empty or bad format'));return;}
   var m=csvMap(rows[0]);
   if(m.name===undefined){toast(TX('未识别到「客户名」列，请保留表头','No Name column; keep the header row'));return;}
   list=[];
   for(var i=1;i<rows.length;i++){
    var rr=rows[i];
    var nv=(rr[m.name]||'').trim();if(!nv)continue;
    list.push({name:nv,country:(m.country!==undefined?(rr[m.country]||'').trim():''),market:(m.market!==undefined?(rr[m.market]||'').trim():''),wa:(m.wa!==undefined?(rr[m.wa]||'').trim():''),email:(m.email!==undefined?(rr[m.email]||'').trim():''),product:(m.product!==undefined?(rr[m.product]||'').trim():''),stage:(m.stage!==undefined?(rr[m.stage]||'').trim():''),amount:(m.amount!==undefined?(rr[m.amount]||'').trim():''),last:(m.last!==undefined?(rr[m.last]||'').trim():''),note:(m.note!==undefined?(rr[m.note]||'').trim():''),source:(m.source!==undefined?(rr[m.source]||'').trim():'')});
   }
  }
  if(!list||!list.length){toast(TX('没有可导入的客户','No clients found'));return;}
  var add=0,upd=0;
  list.forEach(function(x){
   var hit=null;
   for(var j=0;j<S.leads.length;j++){var l=S.leads[j];if(String(l.name||'').trim()===String(x.name||'').trim()&&String(l.country||'').trim()===String(x.country||'').trim()){hit=l;break;}}
   if(hit)upd++;else add++;
  });
  S._impList=list;
  var pv=list.slice(0,5).map(function(x){return x.name+(x.country?('('+x.country+')'):'');}).join('、');
  openModal(TX('确认导入客户','Confirm import'),TX('共解析到 ','Parsed ')+list.length+TX(' 条：新增 ',' records: new ')+add+TX(' 条，更新 ',' , update ')+upd+TX(' 条。匹配规则：客户名+国家；更新时只覆盖非空字段，不会清空已有内容。',' . Matched by name+country; only non-empty fields overwrite.')+(pv?(' '+TX('预览：','Preview: ')+pv+(list.length>5?'…':'')):''),function(){doImportLeads();});
 };
 r.readAsText(file);
}
function doImportLeads(){
 var list=S._impList||[];var add=0,upd=0;
 list.forEach(function(x){
  var hit=null;
  for(var j=0;j<S.leads.length;j++){var l=S.leads[j];if(String(l.name||'').trim()===String(x.name||'').trim()&&String(l.country||'').trim()===String(x.country||'').trim()){hit=l;break;}}
  if(hit){
   ['market','wa','email','product','stage','amount','last','note'].forEach(function(k){
    if(x[k]!==undefined&&String(x[k]).trim()!==''){
     if(k==='stage'){if(PIPE.indexOf(x.stage)>=0)hit.stage=x.stage;}
    else if(k==='source'){hit.source=x.source;}
     else if(k==='amount'){var n=Number(String(x.amount).replace(/[^0-9.\-]/g,''));if(!isNaN(n))hit.amount=n;}
     else hit[k]=x[k];
    }
   });
   if(!hit.logs)hit.logs=[];
   upd++;
  } else {
   var st=(PIPE.indexOf(x.stage)>=0)?x.stage:'待开发';
   var am=Number(String(x.amount||'').replace(/[^0-9.\-]/g,''));if(isNaN(am))am=0;
   S.leads.push({id:uid(),name:x.name,country:x.country||'',market:x.market||'',wa:x.wa||'',email:x.email||'',product:x.product||'',stage:st,amount:am,last:x.last||todayStr(),note:x.note||'',source:x.source||'',logs:[]});
   add++;
  }
 });
 save('leads',S.leads);S._impList=null;
 toast(TX('导入完成：新增 ','Imported: new ')+add+TX(' 条，更新 ',' , updated ')+upd+TX(' 条',''));
 refreshAll();
}

(function(){Object.keys(HOLIDAYS).forEach(function(cc){var its=HOLIDAYS[cc].items;if(its.some(function(it){return it.is;})&&!its.some(function(it){return it.is==='mawlid';})){its.push(hIsl('mawlid','圣纪节','Mawlid'));}});})();
/* —— 日期推算引擎 —— */
function hpad(n){return (n<10?'0':'')+n;}
function hJdToGreg(jd){var a=jd+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4),d=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d/4),m=Math.floor((5*e+2)/153),day=e-Math.floor((153*m+2)/5)+1,month=m+3-12*Math.floor(m/10),year=100*b+d-4800+Math.floor(m/10);return [year,month,day];}
function hHijriJd(y,m,d){return Math.floor((11*y+3)/30)+354*y+30*m-Math.floor((m-1)/2)+d+1948440-385;}
var ISL_MAP={ramadan:[9,1],eidFitr:[10,1],eidAdha:[12,10],hijri:[1,1],mawlid:[3,12]};
function hIslMd(y,key){var mm=ISL_MAP[key];if(!mm)return '';var base=Math.floor((y-622)*33/32);for(var h=base-2;h<=base+3;h++){var g=hJdToGreg(hHijriJd(h,mm[0],mm[1]));if(g[0]===y)return hpad(g[1])+'-'+hpad(g[2]);}return '';}
function hNthMd(y,m,w,n){var first=new Date(Date.UTC(y,m-1,1)).getUTCDay();var day=1+((7-first+w)%7)+(n-1)*7;var dim=new Date(Date.UTC(y,m,0)).getUTCDate();if(day>dim)day-=7;return hpad(m)+'-'+hpad(day);}
function hEasterMd(y,off){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),hh=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-hh-k)%7,m=Math.floor((a+11*hh+22*l)/451),mo=Math.floor((hh+l-7*m+114)/31),da=((hh+l-7*m+114)%31)+1;var dt=new Date(Date.UTC(y,mo-1,da+off));return hpad(dt.getUTCMonth()+1)+'-'+hpad(dt.getUTCDate());}
function holidayMd(y,it){
 if(it.f)return it.f;
 if(it.nth)return hNthMd(y,it.nth[0],it.nth[1],it.nth[2]);
 if(it.ea!=null)return hEasterMd(y,it.ea);
 if(it.is)return hIslMd(y,it.is);
 if(it.lk){var tb=LUNAR_TBL[it.lk]||{};return tb[y]||'';}
 return '';
}
function holidayYear(){var f=S._holFilter||{};return f.year||new Date().getFullYear();}
/* 年份窗口：默认「今年 + 未来 3 年」自动滚动；若记忆的年份落在窗口外，窗口自动移到该年 */
function holidayYears(){var nowY=new Date().getFullYear();var f=S._holFilter||{};var sel=f.year||0;var start=(sel&&(sel<nowY||sel>nowY+3))?sel:nowY;var out=[];for(var i=0;i<4;i++)out.push(start+i);return out;}
function holidayItems(cc,y){var c=HOLIDAYS[cc];if(!c)return [];var out=[];(c.items||[]).forEach(function(it){var md=holidayMd(y,it);if(!md)return;out.push({cc:cc,country:c.name,region:c.region,d:y+'-'+md,t:it.t,te:it.te||'',c:it.c||'n',est:!!(it.is||it.lk||it.ea!=null)});});return out;}
function holidayAll(y,flt){var rows=[];Object.keys(HOLIDAYS).forEach(function(cc){holidayItems(cc,y).forEach(function(r){if(flt&&!flt(r))return;rows.push(r);});});rows.sort(function(a,b){return a.d<b.d?-1:(a.d>b.d?1:0);});return rows;}
function holidayMissing(y){var n=0;Object.keys(HOLIDAYS).forEach(function(cc){HOLIDAYS[cc].items.forEach(function(it){if(!holidayMd(y,it))n++;});});return n;}
function nextRamadan(){var y=new Date().getFullYear();for(var i=0;i<6;i++){var md=hIslMd(y+i,'ramadan');if(md){var d=(y+i)+'-'+md;if(d>=todayStr())return d;}}var md2=hIslMd(y,'ramadan');return md2?(y+'-'+md2):todayStr();}
function holYear(y){S._holFilter=S._holFilter||{};S._holFilter.year=parseInt(y,10)||0;S._holFilter.country='';save('_holFilter',S._holFilter);refreshAll();}
function holClear(){S._holFilter={region:'',country:'',q:'',year:0};save('_holFilter',S._holFilter);refreshAll();toast(TX('已重置节假日筛选','Filters reset'));}
function holidayFilterBar(){
 var f=S._holFilter||{};var cur=f.year||new Date().getFullYear();var nowY=new Date().getFullYear();var today=todayStr();
 var tabs=holidayYears().map(function(y){
  var all=holidayAll(y);var n=(y===nowY)?all.filter(function(r){return r.d>=today;}).length:all.length;
  var lab=(y===nowY)?(y+' · '+TX('余','left')+n):(y+' · '+n);
  return '<button class="btn '+(y===cur?'amber':'ghost')+' mini" data-action="holYear" data-y="'+y+'" title="'+TX('查看 '+y+' 年全部节假日','View all holidays in '+y)+'">'+lab+'</button>';
 }).join('');

 return '<div class="row" style="gap:6px;margin-bottom:8px;flex-wrap:wrap">'+tabs+'<span class="muted" style="font-size:12.5px;margin-left:4px">'+TX('自动推算未来年份 →','future years auto-calculated →')+'</span></div><div class="grid" style="grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-bottom:8px"><select id="hf_region">'+ropts+'</select><select id="hf_country">'+copts+'</select><input id="hf_q" placeholder="'+TX('搜索节日/国家','Search holiday/country')+'" value="'+esc(f.q||'')+'"></div>'+((f.region||f.country||f.q)?('<div class="row" style="margin-bottom:8px"><button class="btn ghost mini" data-action="holClear">'+TX('重置筛选','Reset filters')+'</button></div>'):'');

function renderHolidays(){
 var box=$('holList');if(!box)return;
 var f=S._holFilter||{};var y=f.year||new Date().getFullYear();var today=todayStr();
 var rows=holidayAll(y,function(r){
  if(f.region&&r.region!==f.region)return false;
  if(f.country&&r.cc!==f.country)return false;
  if(f.q){var q=f.q;if((r.country+r.t+(r.te||'')).toLowerCase().indexOf(q)<0)return false;}
  return true;
 });
 if(!rows.length){box.innerHTML='<div class="card muted" style="text-align:center">'+TX('没有匹配的节假日。','No matching holidays.')+'</div>';return;}
 var up=rows.filter(function(r){return r.d>=today;}).length;
 var soon=rows.filter(function(r){var d2=daysBetween(today,r.d);return d2>=0&&d2<=30;}).length;
 var html='<div class="hint" style="margin-bottom:4px">'+y+TX(' 年：共 ',' — ')+rows.length+TX(' 个节日','holidays')+(y===new Date().getFullYear()?TX('；未来 30 天 ',' — next 30 days: ')+soon+TX(' 个',''):TX('；今日之后 ',' — upcoming ')+up+TX(' 个',''))+'</div>';
 rows.forEach(function(r){var past=r.d<today;var dd=daysBetween(today,r.d);
  html+='<div class="ti" style="display:flex;gap:10px;padding:8px 0;border-top:1px dashed var(--line)"><span class="tag '+(r.c==='r'?'r':(r.c==='b'?'a':'n'))+'">'+r.d+'</span><div style="flex:1"><b>'+r.t+(r.te?(' · '+r.te):'')+'</b> <span class="tag">'+r.country+'</span>'+(r.est?' <span class="tag" title="'+TX('按历法推算，可能与官方公布相差 1-2 天','Calculated — may differ 1-2 days from official')+'">≈</span>':'')+(past?' <span class="tag">'+TX('已过','past')+'</span>':' <span class="tag '+(r.c==='r'?'r':'a')+'">'+TX('还有','in')+' '+dd+' '+TX('天','days')+'</span>')+'<div class="muted" style="font-size:12.5px">'+r.region+'</div></div><button class="btn ghost mini" data-action="holidayGreet" data-cc="'+r.cc+'" data-h="'+esc(r.t)+'" data-he="'+esc(r.te||'')+'" data-d="'+r.d+'">'+TX('发问候','Greet')+'</button></div>';
 });

  }
 }

  if($('sc_date')&&S._festCtx.date)$('sc_date').value=S._festCtx.date;

 var en=$('sc_en'),zh=$('sc_zh');if(en)en.textContent=TX('选择场景并填变量后生成。','Pick a scene and fill vars.');if(zh)zh.textContent='';

function scPick(id){S._activeClient=id||'';renderSceneFields();}
function genScene(){

 if(!sc){toast(TX('请先选择场景','Pick a scene first'));return;}
 var v={};sc.fields.forEach(function(f){v[f.k]=$('sc_'+f.k).value;});
 var r=sc.gen(v,S.me);
 $('sc_en').textContent=r.en;$('sc_zh').textContent=r.zh;
 S._lastScene={k:k,en:r.en,zh:r.zh,title:scTitle(k)};
 toast(TX('已生成','Generated'));
}
function saveScene(){
 if(!S._lastScene){toast(TX('请先生成话术','Generate first'));return;}
 S.scripts.unshift({id:uid(),title:S._lastScene.title,en:S._lastScene.en,zh:S._lastScene.zh,date:todayStr()});
 save('scripts',S.scripts);renderNav();toast(TX('已存到话术库（'+S.scripts.length+'）','Saved ('+S.scripts.length+')'));
}
/* ============ 话术库 ============ */
function viewScripts(){

function libListHTML(){

 stages.forEach(function(s){ var on=S._tplStage===s; html+='<button style="margin:0;padding:4px 10px;border:1px solid '+(on?'#1e3a8a':'#cbd5e1')+';background:'+(on?'#1e3a8a':'#fff')+';color:'+(on?'#fff':'#334155')+';border-radius:999px;font-size:12px;cursor:pointer" data-action="tplStage" data-stage="'+esc(s)+'">'+esc(s)+'</button>'; });

 });

}

function viewDeliver(){
 var h=shead('deliver',TX('订单SOP + 验货要点 + 交付沟通脚本。交付稳，复购才来。','Order SOP + QC checklist + delivery scripts. Stable delivery → reorders.'));
 var dl=S.leads.filter(function(l){return l.stage==='成交';});
 h+='<div class="card" style="margin-bottom:14px"><h3 style="margin:0 0 6px;font-size:15px">'+TX('当前交付中订单（真实客户库）','Orders in delivery (your real leads)')+'</h3>';
 if(!dl.length){
  h+='<div class="hint">'+TX('暂无「成交」客户。去「客户汇总 / 找客户」把线索推进到成交，这里会出现待交付订单，并能一键带入下方话术生成器。','No "成交" clients yet. Push a lead to 成交 in Customer Hub, and it appears here — ready to feed the script generator below.')+' <button class="btn ghost mini" data-action="nav" data-view="find" style="margin-left:6px">'+TX('去推进线索 →','Push leads →')+'</button></div>';
 }else{
  h+='<div class="grid g2">';
  dl.forEach(function(l){var days=Math.round((new Date(todayStr())-new Date(l.last))/864e5);var amt=l.amount?(' $'+l.amount):'';
   h+='<div class="card" style="margin:0"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>'+esc(l.name)+'</b>'+(l.market?'<span class="tag">'+esc(l.market)+'</span>':'')+'</div><div class="muted" style="font-size:12.5px;margin:4px 0 8px">'+TX('金额','Amount')+amt+' · '+TX('最近','Last')+' '+days+' '+TX('天前','d ago')+'</div><button class="btn mini" data-action="deliverUse" data-id="'+l.id+'">'+TX('用此客户生成通知','Use for scripts')+'</button></div>';});
  h+='</div>';
 }
 h+='</div>';
 h+=sceneBox(['ready_ship','ship_advice','track']);
 h+=sopCard();
 h+=qcCard();
 h+='<div class="card" style="margin-top:14px;background:#f1f5f9"><div class="shead" style="margin:0"><div class="ic">'+ICON.docs+'</div><div><h2 style="font-size:15px">'+TX('下一步：备齐全套外贸单据','Next: prepare the full document set')+'</h2><p>'+TX('出货前要把 全套外贸单证一次性备齐——发票、箱单、提单、原产地证、报关单、保险单、汇票、检验证、装船通知、受益人证明，以及按条件出具的熏蒸/海关/领事/船证等。','Before shipment, prepare all 15 docs at once — invoice, packing list, B/L, C/O, customs decl., insurance, draft, inspection, shipping advice, beneficiary cert, plus conditional ones.')+'</p></div></div><div class="row"><button class="btn amber" data-action="nav" data-view="docs">'+TX('去备外贸单据 →','Go to Trade Documents →')+'</button></div></div>';
 h+='<div class="card" style="margin-top:14px;background:#ecfdf5"><div class="shead" style="margin:0"><div class="ic">'+ICON.repeat+'</div><div><h2 style="font-size:15px">'+TX('交付完成 → 进「复购转介」养老客','After delivery → Reorder to retain')+'</h2><p>'+TX('货到确认、售后回访后，用「复购转介」的节期日历触发返单，并趁信任高要转介绍——复购比开发新客便宜太多。','After goods arrive & after-sales, use Reorder’s festival calendar to trigger reorders and ask for referrals while trust is high.')+'</p></div></div><div class="row"><button class="btn green" data-action="nav" data-view="repeat">'+TX('去复购转介 →','Go to Reorder →')+'</button></div></div>';
 return h;
}

function sopList(){var a=load('sopDone',[]);return Array.isArray(a)?a:[];}
function qcList(){var a=load('qcDone',[]);return Array.isArray(a)?a:[];}
function sopText(){
 var L=['【'+TX('订单执行 SOP · 6 步走完一单','Order SOP · 6 steps per order')+'】'];
 SOP_STEPS.forEach(function(s,i){L.push((i+1)+'. '+TX(s.n,s.ne)+'｜'+TX(s.w,s.we));L.push('   '+TX('要做','To do')+'：'+TX(s.d,s.de));L.push('   '+TX('坑','Pitfall')+'：'+TX(s.p,s.pe)+' ｜ '+TX('完成标志','Done when')+'：'+TX(s.o,s.oe));});
 return L.join('\n');
}
function qcText(){
 var L=['【'+TX('验货清单（出货前逐项打钩）','QC Checklist (tick before loading)')+'】'];
 QC_ITEMS.forEach(function(q,i){L.push('□ '+(i+1)+'. '+TX(q.t,q.te)+'｜'+TX('怎么看','How')+'：'+TX(q.ho,q.hoe)+'｜'+TX('不合格','If fail')+'：'+TX(q.r,q.re));});
 return L.join('\n');
}
function sopCard(){
 var done=sopList(),N=SOP_STEPS.length;

function reviewDrill(kind){

 else if(kind==='talk'){f.stages=['已联系','已回复','试样','报价'];}
 else if(kind==='deal'){f.stage='成交';}
 else if(kind==='warn'){f.overdue=true;}

 else if(kind==='mails'||kind==='mails30'){S._mailFilter='all';save('_mailFilter',S._mailFilter);S.view='mails';save('view',S.view);S._activeClient='';refreshAll();return;}

}

function exportJson(){
 var dump={__wb_format:1,__wb_version:'full',exported:todayStr()};
 PERSIST_KEYS.forEach(function(k){
   var val;
   if(k in S && S[k]!==undefined){val=S[k];}
   else{try{var raw=localStorage.getItem(KEY+k);val=(raw!==null)?JSON.parse(raw):undefined;}catch(e){val=undefined;}}
   if(val!==undefined)dump[k]=val;
 });
 var str=JSON.stringify(dump,null,2);
 var a=document.createElement('a');a.download='外贸工作台_全量备份_'+todayStr()+'.json';
 try{var blob=new Blob([str],{type:'application/json'});a.href=(window.URL&&URL.createObjectURL)?URL.createObjectURL(blob):('data:application/json;charset=utf-8,'+encodeURIComponent(str));}
 catch(e){a.href='data:application/json;charset=utf-8,'+encodeURIComponent(str);}
 a.click();toast(TX('已导出全量备份（'+Object.keys(dump).length+' 项数据）','Full backup exported ('+Object.keys(dump).length+' items)'));

function importJson(){
 var f=document.createElement('input');f.type='file';f.accept='application/json,.json';
 f.onchange=function(){
  var file=(f.files||[])[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(){
   try{
     var d=JSON.parse(String(r.result||''));
     if(!d||typeof d!=='object'){toast(TX('文件格式错误','Bad file'));return;}
     var n=0;
     PERSIST_KEYS.forEach(function(k){
       if(k in d && d[k]!==undefined){S[k]=d[k];save(k,S[k]);n++;}
     });
     if(d.me&&typeof d.me==='object'){S.me=d.me;save('me',S.me);}
     toast(TX('已恢复 '+n+' 类数据，刷新中…','Restored '+n+' sets, refreshing…'));
     refreshAll();
   }catch(e){toast(TX('文件解析失败，请确认是备份文件','Parse failed — not a backup file'));}
  };
  r.readAsText(file);
 };
 f.click();
}

 if(p==='Google')return 'https://www.google.com/search?q='+encodeURIComponent(q);

 if(d.date&&d.eta&&d.eta<d.date)is.push(TX('到港日早于发货日（ETA<ETD）','ETA earlier than ETD'));
 if(d.lc&&!d.lcno)is.push(TX('信用证交易但缺信用证号 L/C No.','L/C deal missing L/C no.'));
 // 单单一致：跨单比对共享字段
 var cross=['no','qty','amt','vessel','port','cnee','contractNo','lcno','blno','incoterms','eta'];
 var conflicts=[];
 cross.forEach(function(key){
  var map={};
  DOC_DEF.forEach(function(x){
   if(x.fields.indexOf(key)<0)return;
   var val='';
   if(d.docVals[x.id]&&d.docVals[x.id][key]!=null&&d.docVals[x.id][key]!=='')val=d.docVals[x.id][key];
   else if(SHARED.indexOf(key)>=0&&d[key]!=null&&d[key]!=='')val=d[key];
   if(val!==''){(map[val]=map[val]||[]).push(x.zh);}
  });
  var ks=Object.keys(map);
  if(ks.length>1){var det=ks.map(function(k){return esc(k)+' ← '+map[k].join('、');}).join('；');conflicts.push(TX('「'+(DOC_FIELDS[key]?DOC_FIELDS[key].l:key)+'」各单不一致：','Field "'+(DOC_FIELDS[key]?DOC_FIELDS[key].l:key)+'" differs across docs: ')+det);}
 });
 // 单证一致：保险金额≈发票110%
 var invAmt=(d.docVals['invoice']&&d.docVals['invoice']['amt'])?d.docVals['invoice']['amt']:(d.amt?String(d.amt):'');
 var insAmt=(d.docVals['insurance']&&d.docVals['insurance']['insuranceAmt'])?d.docVals['insurance']['insuranceAmt']:'';
 if(invAmt&&insAmt){var ia=parseFloat(invAmt),sa=parseFloat(insAmt);if(!isNaN(ia)&&!isNaN(sa)&&sa<ia*1.1-1e-6)conflicts.push(TX('保险金额 '+sa+' 低于发票110%（'+(ia*1.1).toFixed(2)+'），建议按发票110%投保','Insured '+sa+' below 110% of invoice ('+(ia*1.1).toFixed(2)+'); recommend 110%'));}
 var h='<div class="card" style="margin:10px 0;background:#fff7ed"><h4 style="margin:0 0 6px">'+TX('AI 一致性校验（单单一致 / 单证一致）','AI consistency check (doc-to-doc / doc-to-deal)')+'</h4>';
 if(!is.length&&!conflicts.length)h+='<div class="tag a">'+TX('通过：关键信息齐全，且各单共享字段一致、单证相符','PASS: key info complete and all shared fields consistent across docs')+'</div>';
 else{
  if(is.length)h+='<div class="muted" style="font-size:12px;margin:4px 0">'+TX('① 交易信息：','① Deal info:')+'</div>'+is.map(function(s){return '<div style="padding:3px 0;color:#b45309;font-size:13px">'+TX('注意：','Note: ')+esc(s)+'</div>';}).join('');
  if(conflicts.length)h+='<div class="muted" style="font-size:12px;margin:6px 0 2px">'+TX('② 单单一致（跨单比对）：','② Doc-to-doc consistency:')+'</div>'+conflicts.map(function(s){return '<div style="padding:3px 0;color:#b45309;font-size:13px">'+esc(s)+'</div>';}).join('');
 }
 h+='<div class="muted" style="font-size:12px;margin-top:6px">'+TX('说明：共享字段（买方/发票号/数量/金额/船名/目的港等）统一取自「交易公共信息」，各单自动继承，天然单单一致；本校验再逐单比对，发现手填冲突即标红。','Shared fields are sourced from the deal once, so docs inherit them; this check compares filled docs to catch manual mismatches.')+'</div></div>';
 return h;
}
var DOC_PRESETS=[
 {id:'sea',zh:'标准海运 (CIF/FOB)',en:'Standard Sea',set:{transport:'sea',woodPkg:false,lc:false,destCountry:''},docs:['invoice','packing','weight_note','bl','insurance','coo','shipping_advice','customs_decl','booking_note','inspection']},
 {id:'air',zh:'空运小包',en:'Air Parcel',set:{transport:'air',woodPkg:false,lc:false,destCountry:''},docs:['invoice','packing','weight_note','awb','insurance','coo','shipping_advice','booking_note','inspection']},
 {id:'lc',zh:'信用证 L/C 交易',en:'L/C Payment',set:{transport:'sea',lc:true,woodPkg:false,destCountry:''},docs:['invoice','packing','weight_note','bl','insurance','coo','draft','beneficiary','shipping_co','shipping_advice','customs_decl','booking_note']},
 {id:'wood',zh:'木包装 (需熏蒸)',en:'Wood Packing',set:{transport:'sea',woodPkg:true,lc:false,destCountry:''},docs:['invoice','packing','weight_note','bl','insurance','coo','fumigation','shipping_advice','customs_decl','booking_note']},
 {id:'me',zh:'中东出口 (领事发票)',en:'Middle East',set:{transport:'sea',destCountry:'UAE',woodPkg:false,lc:false},docs:['invoice','packing','weight_note','bl','insurance','coo','consular','shipping_advice','customs_decl','booking_note','inspection']},
 {id:'full',zh:'全套保守 (27张全勾)',en:'Full Conservative',set:{},docs:[]}
];
function docDef(){S._defShow=!S._defShow;S._recShow=false;S._chkShow=false;refreshAll();}
function docDefPanel(){
 var h='<div class="card" style="margin:10px 0;background:#f5f3ff"><h4 style="margin:0 0 6px">'+TX('单证场景预设','Doc scenario presets')+'</h4>';
 h+='<div class="muted" style="font-size:12.5px;margin-bottom:8px">'+TX('选一个常见出口场景，一键设置交易条件并预勾对应单证；之后逐项核对实际出单情况，未出的取消勾选即可。','Pick a common export scenario to set conditions and pre-check its docs; then verify against what you actually issue.')+'</div>';
 h+='<div class="row" style="flex-wrap:wrap;gap:8px">';
 DOC_PRESETS.forEach(function(p){h+='<button class="btn ghost mini" data-action="docDefApply" data-pid="'+p.id+'">'+esc(p.zh)+'</button>';});
 h+='</div></div>';
 return h;
}
function docDefApply(pid){
 var d=activeDeal();if(!d)return;
 var p=DOC_PRESETS.find(function(x){return x.id===pid;});if(!p)return;
 if(p.set.transport)d.transport=p.set.transport;
 if(typeof p.set.woodPkg==='boolean')d.woodPkg=p.set.woodPkg;
 if(typeof p.set.lc==='boolean')d.lc=p.set.lc;
 if('destCountry'in p.set)d.destCountry=p.set.destCountry;
 DOC_DEF.forEach(function(x){d.docs[x.id]='todo';});
 var ids=(pid==='full')?DOC_DEF.map(function(x){return x.id;}):p.docs;
 ids.forEach(function(id){if(d.docs[id]!==undefined)d.docs[id]='done';});
 save('deals',S.deals);
 S._defShow=false;S._chkShow=false;S._recShow=false;
 refreshAll();
 toast(TX('已按【'+p.zh+'】套用：已设置交易条件并预勾所需单证，请逐项核对实际出单后取消未出的勾选','Applied preset: '+p.en+'. Review and uncheck docs not actually issued.'));
}
/* ============ 初始化 ============ */
function init(){hotDailyCheck();hotStartTimer();refreshAll();}

/* ===== 本地身份门禁（纯前端：账号与数据仅存本机浏览器，非云端账号） ===== */
function wbHash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h.toString(16);}
function wbSess(){try{return JSON.parse(localStorage.getItem('wb_auth_sess')||'null');}catch(e){return null;}}
function wbHasSess(){var s=wbSess();return !!(s&&s.uid);}
function wbSessKey(){var s=wbSess();return (s&&s.uid)?('wb_ftloop_'+s.uid+'_'):'wb_ftloop_';}
function wbAccounts(){try{return JSON.parse(localStorage.getItem('wb_auth_accounts')||'[]');}catch(e){return [];}}
function wbShowUserBar(name){
  var b=document.getElementById('wbUserBar');if(b)return;
  b=document.createElement('div');b.id='wbUserBar';
  b.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99999;background:#1f2a44;color:#fff;padding:6px 10px;border-radius:20px;font:13px/1.4 system-ui;box-shadow:0 2px 8px rgba(0,0,0,.3);';
  b.innerHTML='\uD83D\uDC64 '+name+' · <span id="wbLogout" style="color:#7fd1ff;cursor:pointer;">退出</span>';
  document.body.appendChild(b);
  document.getElementById('wbLogout').onclick=function(){localStorage.removeItem('wb_auth_sess');location.reload();};
}
function wbAuthOK(uid,name){
  localStorage.setItem('wb_auth_sess',JSON.stringify({uid:uid,name:name}));
  KEY='wb_ftloop_'+uid+'_';
  var o=document.getElementById('wbAuth');if(o)o.remove();
  wbShowUserBar(name);
  boot();
}
function wbRenderAuth(){
  var css='#wbAuth{position:fixed;inset:0;z-index:100000;background:linear-gradient(135deg,#0f1830,#1b2b50);display:flex;align-items:center;justify-content:center;font-family:system-ui,"Microsoft YaHei",sans-serif;}'+
    '#wbAuth .card{width:340px;max-width:92vw;background:#fff;border-radius:14px;padding:26px 24px;box-shadow:0 10px 40px rgba(0,0,0,.35);}'+
    '#wbAuth .auth-logo{width:48px;height:48px;margin:0 auto 10px;background:#eff6ff;border-radius:12px;display:flex;align-items:center;justify-content:center;}'+
    '#wbAuth .auth-logo svg{width:32px;height:32px;}'+
    '#wbAuth h2{margin:0 0 4px;font-size:19px;color:#16233f;text-align:center;}'+
    '#wbAuth .sub{margin:0 0 16px;font-size:12px;color:#8a93a6;text-align:center;}'+
    '#wbAuth .tabs{display:flex;gap:8px;margin-bottom:14px;}'+
    '#wbAuth .tab{flex:1;text-align:center;padding:8px;font-size:14px;border-radius:8px;cursor:pointer;background:#eef1f7;color:#5a6478;}'+
    '#wbAuth .tab.on{background:#2b6cff;color:#fff;}'+
    '#wbAuth label{display:block;font-size:12px;color:#55617a;margin:10px 0 4px;}'+
    '#wbAuth input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d6dbe6;border-radius:8px;font-size:14px;}'+
    '#wbAuth .btn{margin-top:16px;width:100%;padding:11px;border:0;border-radius:8px;background:#2b6cff;color:#fff;font-size:15px;cursor:pointer;}'+
    '#wbAuth .msg{margin-top:10px;font-size:12px;min-height:16px;}'+
    '#wbAuth .note{margin-top:12px;font-size:11px;color:#9aa3b5;line-height:1.5;}';
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  var box=document.createElement('div');box.id='wbAuth';
  box.innerHTML='<div class="card">'+
    '<div class="auth-logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g stroke="#2563eb"><circle cx="9.5" cy="12" r="7"/><path d="M2.5 12h14"/><path d="M9.5 5c2 2 2 12 0 14"/><path d="M9.5 5c-2 2-2 12 0 14"/></g><path stroke="#f59e0b" d="M12.5 9l8-4-3 8 3 5-7-4"/></svg></div>'+
    '<h2>外贸一体化平台</h2>'+
    '<p class="sub">请先实名登录，进入您自己的工作台</p>'+
    '<div class="tabs"><div class="tab on" data-t="reg">注册</div><div class="tab" data-t="login">登录</div></div>'+
    '<label>实名姓名 *</label><input id="wbName" placeholder="如：张三 / Mr. Ali">'+
    '<label>邮箱 或 电话 *</label><input id="wbContact" placeholder="用于登录的身份标识">'+
    '<label>密码 *</label><input id="wbPwd" type="password" placeholder="设置或输入密码">'+
    '<button class="btn" id="wbGo">注册并进入</button>'+
    '<div class="msg" id="wbMsg"></div>'+
    '<p class="note">说明：本工作台为纯前端工具，账号与数据仅保存在您本机浏览器（localStorage），不是云端账号。同一台设备可多人各自登录、互不干扰；换设备需重新注册。</p>'+
    '</div>';
  document.body.appendChild(box);
  var mode='reg';
  box.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){mode=t.getAttribute('data-t');box.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});t.classList.add('on');document.getElementById('wbGo').textContent=(mode==='reg'?'注册并进入':'登录进入');document.getElementById('wbMsg').textContent='';};});
  document.getElementById('wbGo').onclick=function(){
    var name=document.getElementById('wbName').value.trim();
    var contact=document.getElementById('wbContact').value.trim();
    var pwd=document.getElementById('wbPwd').value;
    var msg=document.getElementById('wbMsg');
    if(!name||!contact||!pwd){msg.style.color='#d33';msg.textContent='请完整填写姓名、邮箱/电话、密码';return;}
    if(!/^[\w.+-]+@[\w-]+\.[\w.-]+$|^\+?[\d\s\-]{6,}$/.test(contact)){msg.style.color='#d33';msg.textContent='邮箱或电话格式不正确';return;}
    var accs=wbAccounts();
    if(mode==='reg'){
      if(accs.some(function(a){return a.contact===contact;})){msg.style.color='#d33';msg.textContent='该邮箱/电话已注册，请切到“登录”';return;}
      var uid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      accs.push({uid:uid,name:name,contact:contact,pw:wbHash(pwd)});
      localStorage.setItem('wb_auth_accounts',JSON.stringify(accs));
      wbAuthOK(uid,name);
    }else{
      var a=accs.find(function(x){return x.contact===contact;});
      if(!a){msg.style.color='#d33';msg.textContent='未找到该账号，请先注册';return;}
      if(a.pw!==wbHash(pwd)){msg.style.color='#d33';msg.textContent='密码错误';return;}
      wbAuthOK(a.uid,a.name);
    }
  };
}
function authGate(){
  if(wbHasSess()){ KEY=wbSessKey(); wbShowUserBar((wbSess().name||'用户')); boot(); return; }
  wbRenderAuth();
}

authGate();
</script>
