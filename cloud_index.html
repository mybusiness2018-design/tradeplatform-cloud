function uid(){return 'X'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);}
function iso(d,off){var x=new Date(d);if(off)x.setDate(x.getDate()+off);return x.toISOString().slice(0,10);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}
function addDays(a,n){var d=new Date(a);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}

function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},1600);}
function copyText(txt){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast(TX('已复制','Copied'));},function(){fallbackCopy(txt);});}else fallbackCopy(txt);}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(TX('已复制','Copied'));}catch(e){toast(TX('复制失败，请手动','Copy failed'));}document.body.removeChild(ta);}
function copySilent(txt){try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt);}else{var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}}catch(e){}}

function scoreLead(l){
 var s=STAGE_W[l.stage]||0;
 var days=Math.round((new Date(todayStr())-new Date(l.last))/864e5);
 if(days<=3)s+=10;else if(days<=7)s+=5;else if(days>=21)s-=8;
 if(l.amount>=2000)s+=8;else if(l.amount>0)s+=4;
 if(['中东','东南亚'].indexOf(l.market)>=0)s+=4;
 var _rf=reconFitOf(l); if(_rf!==null){ s += Math.round((_rf-50)/5); }
 s=Math.max(0,Math.min(100,s));
 return s;
}

function loopSig(){
 var me=S.me||{},leads=(S.leads||[]),mails=(S.mails||[]),deals=(S.deals||[]),docs=(S.docs||[]),rv=(S.rvLog||[]),comp=(S.comp||[]),cpq=(S.cpq||[]);
 return {
  pos: !!(me.product||me.market||(comp&&comp.length)||(cpq&&cpq.length)),
  find: leads.length>0,
  reach: mails.length>0,
  trust: leads.some(function(l){return ['已联系','已回复','试样','报价','成交'].indexOf(l.stage)>=0;}),
  deal: leads.some(function(l){return ['报价','成交'].indexOf(l.stage)>=0;})||(deals&&deals.length>0),
  deliver: (deals&&deals.length>0)||(docs&&docs.length>0),
  repeat: leads.some(function(l){return l.stage==='成交';})||(rv&&rv.length>0),
  review: (rv&&rv.length>0)
 };
}
function loopProgress(){
 var order=['pos','find','reach','trust','deal','deliver','repeat','review'];
 var sig=loopSig();var done=0;
 order.forEach(function(k){if(sig[k])done++;});
 var pct=Math.round(done/order.length*100);
 var next=null;for(var i=0;i<order.length;i++){if(!sig[order[i]]){next={k:order[i]};break;}}
 return {order:order,sig:sig,done:done,pct:pct,next:next};
}

var WS_PFS=['Alibaba','1688','Amazon','eBay','AliExpress','Etsy','MIC','Google','Bing','Trends'];
var WS_DEF=['Alibaba','1688','Amazon','eBay','AliExpress','Google'];
function wsUrl(p,q){
 if(p==='Bing')return 'https://www.bing.com/search?q='+encodeURIComponent(q||'');
 return cpPfUrl(p,q);
}
function wsGo(p,q){
 var u=wsUrl(p,q);
 if(typeof window!=='undefined'&&window.open)window.open(u,'_blank');
}
function wsVariants(q){
 q=String(q||'').trim();
 if(!q)return [];
 return [q,'wholesale '+q,'bulk '+q,q+' supplier',q+' manufacturer',q+' factory price',q+' MOQ',q+' OEM ODM'];
}
function wsMatrix(q,plat){
 var vs=wsVariants(q);
 if(!vs.length)return [];
 var ps=(plat&&plat!=='all')?[plat]:WS_PFS;
 var out=[],i,j;
 for(i=0;i<vs.length;i++){for(j=0;j<ps.length;j++){out.push({p:ps[j],q:vs[i]});}}
 return out;
}
function wsUnesc(t){
 return String(t||'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ').replace(/&amp;/g,'&');
}
function wsParse(html){
 var out=[];
 var blocks=String(html||'').split('<li class="b_algo"');
 for(var i=1;i<blocks.length&&out.length<25;i++){
  var b=blocks[i];
  var a=/<a[^>]+href="(https?:\/\/[^"]+)"[^>]*>([\s\S]*?)<\/a>/.exec(b);
  if(!a)continue;
  var t=wsUnesc(String(a[2]).replace(/<[^>]+>/g,'')).trim();
  if(!t||t.length<3)continue;
  var pm=/<p[^>]*>([\s\S]*?)<\/p>/.exec(b);
  var sn=pm?wsUnesc(String(pm[1]).replace(/<[^>]+>/g,'')).trim():'';
  out.push({t:t,u:a[1],s:sn.slice(0,240)});
 }
 return out;
}
function wsFetch(url,ms){
 var limit=ms||7000;
 return new Promise(function(resolve,reject){
  var done=false,opt={};
  var to=setTimeout(function(){if(!done){done=true;reject(new Error('timeout'));}},limit);
  try{
   if(typeof AbortController!=='undefined'){
    var c=new AbortController();opt.signal=c.signal;
    setTimeout(function(){try{c.abort();}catch(e){}},limit);
   }
  }catch(e){}
  fetch(url,opt).then(function(r){
   if(done)return;
   done=true;clearTimeout(to);
   if(!r.ok){reject(new Error('HTTP '+r.status));return;}
   resolve(r.text());
  }).catch(function(e){if(!done){done=true;clearTimeout(to);reject(e);}});
 });
}

}

function wsGrab(){

 if(!q){toast(TX('请先搜索一个关键词','Search a keyword first'));return;}
 S._wsBusy=true;S._wsErr='';S._wsRes=[];refreshAll();
 var target='https://www.bing.com/search?q='+encodeURIComponent(q)+'&count=30';
 var px=[
  'https://api.allorigins.win/raw?url='+encodeURIComponent(target),
  'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(target),
  'https://r.jina.ai/'+target
 ];
 var i=0;
 function next(){
  if(i>=px.length){
   S._wsBusy=false;
   S._wsErr=TX('没抓到（公共代理被限流或不通）。这是常态，不是故障——直接用上面的搜索入口，点开就是平台真实结果。','Grab failed (proxy rate-limited). This is normal - just use the search entries above, each opens real results.');
   refreshAll();return;
  }
  var u=px[i++];
  wsFetch(u,7000).then(function(txt){
   var r=wsParse(txt);
   S._wsBusy=false;
   if(r&&r.length){S._wsRes=r.slice(0,20);S._wsErr='';}

   refreshAll();
  })['catch'](function(){next();});
 }
 next();
}

/* 天序号：用于"每天换一批"的确定性游标（同一天打开永远一致，跨天必然换新） */
function hotDayNo(){
 var d=new Date(),a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(2026,0,1);
 return Math.round((a.getTime()-b.getTime())/86400000);
}

function hotSeenMap(){
 var m=(S._hotSeen&&typeof S._hotSeen==='object')?S._hotSeen:{},t=todayStr(),out={},k;
 for(k in m){if(Object.prototype.hasOwnProperty.call(m,k)&&m[k]&&m[k]!==t)out[k]=m[k];}
 return out;
}
function hotMarkSeen(list){
 var t=todayStr(),i,k,cut=new Date(Date.now()-9*86400000).toISOString().slice(0,10);
 if(!S._hotSeen||typeof S._hotSeen!=='object')S._hotSeen={};
 for(i=0;i<list.length;i++){if(list[i]&&list[i].k)S._hotSeen[list[i].k]=t;}
 for(k in S._hotSeen){if(S._hotSeen[k]&&S._hotSeen[k]<cut)delete S._hotSeen[k];}
 save('_hotSeen',S._hotSeen);
}
/* 轮转取片：从 pool 的 cursor 处连续取 quota 条。相邻批次步长=quota，
   只要 pool 长度 >= 2*quota，相邻两批就必然完全不重叠 → 每次都是新面孔 */
function hotRotSeg(pool,cursor,quota,skip){
 var n=pool.length,out=[],i,it;
 if(!n||quota<=0)return out;
 var st=((cursor%n)+n)%n;
 for(i=0;i<n&&out.length<quota;i++){it=pool[(st+i)%n];if(skip&&skip[it.k])continue;out.push(it);}
 for(i=0;i<n&&out.length<quota;i++){it=pool[(st+i)%n];if(out.indexOf(it)<0)out.push(it);}
 return out;
}

 if(/美妆|beauty|妆|护肤|美甲|cosmetic|香氛|perfume/.test(txt))return 'beauty';

 if(/家居|日用|home/.test(txt))return 'home';
 return '3c';

function hotPool(ind){
 var pool=[],i;
 for(i=0;i<HOT_DB.length;i++)pool.push(HOT_DB[i]);
 var u=S._hotUser||[];
 for(i=0;i<u.length;i++)pool.push(u[i]);
 if(ind==='all')return pool;
 return pool.filter(function(x){return x.ind===ind||x.ind==='all';});
}
function hotPick(ind,cnt){
 cnt=cnt||6;
 var pool=hotPool(ind),order=[],i,x;
 if(!pool.length&&ind!=='all')pool=hotPool('all');   /* 未知行业兜底：退回全库，不返回空 */
 if(!pool.length)return [];
 for(i=0;i<pool.length;i++)order.push(pool[i]);
 /* 本行业不够时，从其它行业补足 → 永远给满 cnt 款，且跨行业也能换新 */
 if(order.length<cnt){
  var rest=[],u=S._hotUser||[];
  for(i=0;i<HOT_DB.length;i++){x=HOT_DB[i];if(order.indexOf(x)<0&&rest.indexOf(x)<0)rest.push(x);}
  for(i=0;i<u.length;i++){x=u[i];if(order.indexOf(x)<0&&rest.indexOf(x)<0)rest.push(x);}
  for(i=0;i<rest.length&&order.length<cnt*2;i++)order.push(rest[i]);
 }
 /* 双轨轮转：新品轨优先占约 2/3 席位，其余给持续热销/常规 */
 var fresh=[],norm=[],it;
 for(i=0;i<order.length;i++){it=order[i];(it&&it.ft==='new'?fresh:norm).push(it);}
 var shift=(S._hotShift||0)||0,day=hotDayNo();
 var wantFresh=Math.ceil(cnt*2/3);
 if(Math.floor(fresh.length/2)<wantFresh)wantFresh=Math.floor(fresh.length/2);
 if(wantFresh<0)wantFresh=0;
 var wantRest=cnt-wantFresh;
 if(Math.floor(norm.length/2)<wantRest){
  wantRest=Math.floor(norm.length/2);
  wantFresh=Math.min(cnt-wantRest,Math.floor(fresh.length/2));
 }
 if(wantRest<0)wantRest=0;
 var seen=hotSeenMap(),out=[],a=[],b=[],ia=0,ib=0;
 if(wantFresh)a=hotRotSeg(fresh,day*wantFresh+shift*wantFresh,wantFresh,seen);
 if(wantRest)b=hotRotSeg(norm,day*wantRest+shift*wantRest,wantRest,seen);
 while(out.length<cnt){
  if(ia<a.length)out.push(a[ia++]);
  if(ib<b.length&&out.length<cnt)out.push(b[ib++]);
  if(ia>=a.length&&ib>=b.length)break;
 }
 /* 极端情况下（池子被去重打空）再按轮转转一圈补齐；注意这里也带游标，不会固定不变 */
 if(out.length<cnt){
  var extra=hotRotSeg(order,day*cnt+shift*cnt,cnt,seen);
  for(i=0;i<extra.length&&out.length<cnt;i++){if(out.indexOf(extra[i])<0)out.push(extra[i]);}
 }
 out=out.slice(0,cnt);
 hotMarkSeen(out);
 return out;
}

function hotImportApply(text){

function fmtD(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function cpqStreak(x){
 var set={},hs=(x&&x.hist)||[];for(var i=0;i<hs.length;i++)set[hs[i]]=1;
 var d=new Date();if(!set[fmtD(d)])d.setDate(d.getDate()-1);
 var k=0;for(var j=0;j<400;j++){if(set[fmtD(d)]){k++;d.setDate(d.getDate()-1);}else break;}
 return k;
}
function cpqDiff(x){
 var a=parseFloat(x.prev),b=parseFloat(x.price);
 if(!x.prev||isNaN(a)||isNaN(b))return '<span style="color:var(--sub)">—</span>';
 if(b>a)return '<span style="color:#dc2626;font-weight:600">&#9650; +'+(b-a).toFixed(2)+'</span>';
 if(b<a)return '<span style="color:#16a34a;font-weight:600">&#9660; -'+(a-b).toFixed(2)+'</span>';
 return '<span style="color:var(--sub)">=</span>';
}

function cpParse(text){
 var t=String(text||'');
 var lines=t.split(/\r?\n/);
 var out=[],seen={};
 var RE_P=/(?:US\s?\$|USD\s?|\$)\s?(\d[\d,]*(?:\.\d{1,2})?)/;
 var RE_PCTX=/(?:price|单价|unit\s*price|cost|amount|金额|报价)\D*?(\d[\d,]*(?:\.\d{1,2})?)/i;
 var RE_M1=/MOQ[^0-9]{0,15}(\d[\d,]*)/i;
 var RE_M2=/(?:Min\.?\s*Order|Minimum\s*Order)[^0-9]{0,15}(\d[\d,]*)/i;
 var RE_M3=/(\d[\d,]*)\s*(?:pcs|pieces|sets|units)\b/i;
 for(var i=0;i<lines.length&&out.length<30;i++){
  var L=lines[i];
  if(!L||L.length<4)continue;
  var pm=RE_P.exec(L);
  if(!pm)pm=RE_PCTX.exec(L);
  if(!pm)continue;
  var price=String(pm[1]).replace(/,/g,'');
  var v=parseFloat(price);
  if(isNaN(v)||v<=0||v>100000)continue;
  var moq='';
  var mm=RE_M1.exec(L)||RE_M2.exec(L)||RE_M3.exec(L);
  if(mm)moq=String(mm[1]).replace(/,/g,'');
  var name=L.replace(RE_P,' ').replace(/\s+/g,' ').trim();
  name=name.replace(/[\-–—\/|]\s*$/,'').trim();
  if(name.length>60)name=name.slice(0,60);
  if(!name)name=TX('(未识别名称)','(name N/A)');
  var key=name+'|'+price+'|'+moq;
  if(seen[key])continue;
  seen[key]=1;
  out.push({name:name,price:price,moq:moq});
 }
 return out;
}

function custInsight(){
 var leads=S.leads||[];
 var total=leads.length;
 var active=leads.filter(function(l){return l.stage!=='成交';}).length;
 var overdue=leads.filter(function(l){var d=Math.round((new Date(todayStr())-new Date(l.last))/864e5);return d>=14&&l.stage!=='成交';});
 var dealByLead={};(S.deals||[]).forEach(function(d){if(d.leadId)dealByLead[d.leadId]=d;});
 var taskOverdue={};(S.tasks||[]).forEach(function(t){if(!t.done&&t.clientId&&t.due<todayStr()){taskOverdue[t.clientId]=(taskOverdue[t.clientId]||0)+1;}});
 var stageCnt={};PIPE.forEach(function(s){stageCnt[s]=0;});leads.forEach(function(l){stageCnt[l.stage]=(stageCnt[l.stage]||0)+1;});
 var mktCnt={};leads.forEach(function(l){if(l.market)mktCnt[l.market]=(mktCnt[l.market]||0)+1;});
 var lines=leads.map(function(l){
  var days=Math.round((new Date(todayStr())-new Date(l.last))/864e5);
  var follow=days>=14&&l.stage!=='成交';
  var dl=dealByLead[l.id];var docDone=0;
  if(dl){DOC_DEF.forEach(function(d){if(dl.docs&&dl.docs[d.id]==='done')docDone++;});}
  var docPct=dl?Math.round(docDone/DOC_DEF.length*100):null;
  var tasksO=taskOverdue[l.id]||0;
  var action='';
  if(follow)action=TX('逾期 '+days+' 天，立即跟进','Overdue '+days+'d — follow up now');
  else if(tasksO>0)action=TX('有 '+tasksO+' 条待办未处理','Has '+tasksO+' open task(s)');
  else if(dl&&docPct!==null&&docPct<60)action=TX('单证进度 '+docPct+'% 偏低，去处理','Docs at '+docPct+'% — handle now');
  else if(l.stage==='待开发')action=TX('写首触话术','Write first-touch script');
  else if(l.stage==='已联系')action=TX('继续触达','Keep reaching out');
  else if(l.stage==='已回复')action=TX('电话破冰 / 寄样','Call opener / send sample');
  else if(l.stage==='试样')action=TX('寄样跟进 / 备单证','Sample follow-up / prep docs');
  else if(l.stage==='报价')action=TX('出报价 PI','Send quote PI');
  else if(l.stage==='成交')action=TX('走交付 SOP','Run delivery SOP');
  else action=TX('维持触达','Keep in touch');
  return {id:l.id,name:l.name,stage:l.stage,score:scoreLead(l),days:days,follow:follow,market:l.market,amount:(l.amount||''),last:l.last,country:(l.country||''),product:(l.product||''),wa:(l.wa||''),email:(l.email||''),source:(l.source||''),note:(l.note||''),dealNo:dl?dl.no:'',docPct:dl?Math.round(docDone/DOC_DEF.length*100):null,tasksO:tasksO,action:action};
 }).sort(function(a,b){return (b.follow?1:0)-(a.follow?1:0)|| b.score-a.score;});
 var midEast=leads.filter(function(l){return l.market==='中东';}).length;
 var d8=Math.max(0,daysBetween(todayStr(),nextRamadan()));
 var summary=TX('共 ','Total ')+total+TX(' 个客户，',' clients, ')+active+TX(' 个在谈。',' in pipeline. ');
 if(overdue.length)summary+=overdue.length+TX(' 个已逾期跟进（风险最高）：',' overdue (highest risk): ')+overdue.map(function(l){return l.name;}).join('、')+'。';
 else summary+=TX('暂无逾期，跟进节奏良好。','No overdue — rhythm is good. ');
 if(midEast)summary+=TX('其中 ','Of these ')+midEast+TX(' 个中东客户，距下次斋月约 ',' Mid-East clients; ~')+d8+TX(' 天，是试样/返单黄金窗口。',' days to next Ramadan — prime sample/reorder window. ');
 if(lines.length){var top=lines[0];summary+=TX('AI 建议今日优先：','AI suggests today’s priority: ')+top.name+'（'+top.action+'）。';}
 var openTasks=(S.tasks||[]).filter(function(t){return !t.done;}).length;
 return {total:total,active:active,overdue:overdue.length,stageCnt:stageCnt,mktCnt:mktCnt,lines:lines,summary:summary,docAvg:docAvgCal(lines),tasksTotal:openTasks};
}

function extDef(k){for(var i=0;i<EXT_DEFS.length;i++){if(EXT_DEFS[i].k===k)return EXT_DEFS[i];}return EXT_DEFS[0];}function extRow(id){if(!id)return null;var ex=(S.ext||[]).filter(function(x){return x.id===id;});return ex[0]||null;}function dealLinked(d){if(!d)return {supplier:null,product:null};return {supplier:extRow(d.supplierId),product:extRow(d.productId)};}

function extNorm(s){return String(s||'').trim().toLowerCase().replace(/[\s_\-\.\/（）()]/g,'');}
function extMap(type,head){
 var d=extDef(type),m={},i,j,t,k,al,a;
 for(i=0;i<(head||[]).length;i++){
  k=extNorm(head[i]);if(!k)continue;
  for(j=0;j<d.cols.length;j++){
   if(m[d.cols[j].k]!==undefined)continue;
   al=d.cols[j].a.split('|');
   for(t=0;t<al.length;t++){if(k===extNorm(al[t])){m[d.cols[j].k]=i;break;}}
  }
 }
 for(i=0;i<(head||[]).length;i++){
  k=extNorm(head[i]);if(!k)continue;
  for(j=0;j<d.cols.length;j++){
   if(m[d.cols[j].k]!==undefined)continue;
   al=d.cols[j].a.split('|');
   for(t=0;t<al.length;t++){a=extNorm(al[t]);if(a.length>1&&k.indexOf(a)>=0){m[d.cols[j].k]=i;break;}}

function extFile(e,type){
 var file=(e.target.files||[])[0];if(!file)return;
 var d=extDef(type),i,j,q;
 var r=new FileReader();
 r.onload=function(){
  var text=String(r.result||''),list=null,rows=null;
  var t0=text.replace(/^\s+/,'');
  if(/\.json$/i.test(file.name)||t0.charAt(0)==='{'||t0.charAt(0)==='['){
   try{var dj=JSON.parse(text);list=(dj&&dj.items)?dj.items:(Object.prototype.toString.call(dj)==='[object Array]'?dj:null);}catch(err){list=null;}
  }
  if(!list){
   rows=parseCsv(text);
   if(!rows||rows.length<2){toast(TX('文件为空或只有表头','File is empty or header-only'));return;}
   var map=extMap(type,rows[0]);
   if(map.name===undefined){toast(TX('未识别到「名称」列，请保留表头第一行','No name column found; keep the header row'));return;}
   list=[];
   for(i=1;i<rows.length;i++){
    var rr=rows[i],o={};
    for(j=0;j<d.cols.length;j++){var c=d.cols[j],ix=map[c.k];var v=(ix===undefined?'':(rr[ix]===undefined?'':rr[ix]));o[c.k]=String(v===null?'':v).trim();}
    if(!o.name)continue;
    list.push(o);
   }
  } else {
   var out=[];
   for(i=0;i<list.length;i++){
    var src=list[i];if(!src||typeof src!=='object')continue;
    var oo={};
    for(j=0;j<d.cols.length;j++){var cc=d.cols[j];oo[cc.k]=src[cc.k]===undefined?'':String(src[cc.k]);}
    if(!String(oo.name||'').trim())continue;
    out.push(oo);
   }
   list=out;
  }
  if(!list.length){toast(TX('没有可导入的记录','No records found'));return;}
  var add=0,upd=0;
  list.forEach(function(x){
   var hit=null;
   for(q=0;q<(S.ext||[]).length;q++){var it=S.ext[q];if(it.type===type&&String(it.name||'').trim()===String(x.name||'').trim()){hit=it;break;}}
   if(hit)upd++;else add++;
  });
  var unm=(rows&&rows[0]&&map)?(rows[0].length-Object.keys(map).length):0;
  S._extImp={type:type,list:list};
  openModal(TX('确认导入','Confirm import')+' · '+TX(d.n[0],d.n[1]),
   TX('共 ','Parsed ')+list.length+TX(' 条：新增 ',' records — new ')+add+TX(' 条，更新 ',' , update ')+upd+TX(' 条。同类型下按「名称」匹配；更新时只覆盖非空字段，不会清空已有内容。',' . Matched by name within the same type; only non-empty fields overwrite.')+(unm?(' '+TX('（注意：',' (Note: ')+unm+TX('列未识别，已忽略）',' columns unrecognized, skipped)')):''),
   function(){extDoImport();});
 };
 r.readAsText(file);
}

/* ============ 客户信息导入/导出（驾驶舱） ============ */
function dlFile(str,name,type){
 var a=document.createElement('a');a.download=name;
 try{var blob=new Blob([str],{type:type});a.href=(window.URL&&URL.createObjectURL)?URL.createObjectURL(blob):('data:'+type+','+encodeURIComponent(str));}
 catch(e){a.href='data:'+type+','+encodeURIComponent(str);}
 if(document.body&&document.body.appendChild)document.body.appendChild(a);
 a.click();
}
function csvCell(v){v=(v===undefined||v===null)?'':String(v);return /[",\n\r]/.test(v)?('"'+v.replace(/"/g,'""')+'"'):v;}
function parseCsv(text){
 var rows=[],row=[],cur='',q=false;
 text=String(text||'').replace(/^﻿/,'');
 for(var i=0;i<text.length;i++){
  var c=text.charAt(i);
  if(q){
   if(c==='"'){if(text.charAt(i+1)==='"'){cur+='"';i++;}else q=false;}
   else cur+=c;
  } else {
   if(c==='"')q=true;
   else if(c===','){row.push(cur);cur='';}
   else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
   else if(c==='\r'){}
   else cur+=c;
  }
 }
 if(cur!==''||row.length){row.push(cur);rows.push(row);}
 return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
}
function csvMap(head){
 var m={};
 head.forEach(function(h,i){
  var k=String(h||'').trim().toLowerCase().replace(/[\s_]/g,'');
  if(!k)return;
  if(/^(客户名|客户|名称|name|client|customer)$/.test(k))m.name=i;
  else if(/^(国家|country|nation)$/.test(k))m.country=i;
  else if(/^(市场|market|region|area)$/.test(k))m.market=i;
  else if(/^(whatsapp|wa|手机|手机号|电话|phone|tel|mobile)$/.test(k))m.wa=i;
  else if(/^(邮箱|邮件|email|mail|e-mail)$/.test(k))m.email=i;
  else if(/^(产品|product|item|goods)$/.test(k))m.product=i;
  else if(/^(阶段|stage|status|pipe)$/.test(k))m.stage=i;
  else if(/^(金额|amount|value|price|usd)$/.test(k))m.amount=i;
  else if(/^(最近跟进|最后跟进|跟进日期|日期|last|date)$/.test(k))m.last=i;
  else if(/^(备注|note|notes|remark|comment|memo)$/.test(k))m.note=i;
  else if(/^(来源|渠道|source|channel)$/.test(k))m.source=i;
 });
 return m;
}

 var head=[TX('客户名','Name'),TX('国家','Country'),TX('市场','Market'),TX('来源','Source'),TX('WhatsApp','WhatsApp'),TX('邮箱','Email'),TX('产品','Product'),TX('阶段','Stage'),TX('金额','Amount'),TX('最近跟进','Last touch'),TX('备注','Note')];

function importLeads(){var f=$('leadImpFile')||$('extImpFile');if(!f)return;f.value='';f.onchange=onLeadFile;f.click();}
function onLeadFile(e){
 var file=(e.target.files||[])[0];if(!file)return;
 var r=new FileReader();
 r.onload=function(){
  var text=String(r.result||'');var list=null;
  var t=text.replace(/^\s+/,'');
  if(/\.json$/i.test(file.name)||t.charAt(0)==='{'||t.charAt(0)==='['){
   try{var d=JSON.parse(text);list=(d&&d.leads)?d.leads:(Object.prototype.toString.call(d)==='[object Array]'?d:null);}catch(err){list=null;}
  }
  if(!list){
   var rows=parseCsv(text);
   if(rows.length<2){toast(TX('文件为空或格式不对','Empty or bad format'));return;}
   var m=csvMap(rows[0]);
   if(m.name===undefined){toast(TX('未识别到「客户名」列，请保留表头','No Name column; keep the header row'));return;}
   list=[];
   for(var i=1;i<rows.length;i++){
    var rr=rows[i];
    var nv=(rr[m.name]||'').trim();if(!nv)continue;
    list.push({name:nv,country:(m.country!==undefined?(rr[m.country]||'').trim():''),market:(m.market!==undefined?(rr[m.market]||'').trim():''),wa:(m.wa!==undefined?(rr[m.wa]||'').trim():''),email:(m.email!==undefined?(rr[m.email]||'').trim():''),product:(m.product!==undefined?(rr[m.product]||'').trim():''),stage:(m.stage!==undefined?(rr[m.stage]||'').trim():''),amount:(m.amount!==undefined?(rr[m.amount]||'').trim():''),last:(m.last!==undefined?(rr[m.last]||'').trim():''),note:(m.note!==undefined?(rr[m.note]||'').trim():''),source:(m.source!==undefined?(rr[m.source]||'').trim():'')});
   }
  }
  if(!list||!list.length){toast(TX('没有可导入的客户','No clients found'));return;}
  var add=0,upd=0;
  list.forEach(function(x){
   var hit=null;
   for(var j=0;j<S.leads.length;j++){var l=S.leads[j];if(String(l.name||'').trim()===String(x.name||'').trim()&&String(l.country||'').trim()===String(x.country||'').trim()){hit=l;break;}}
   if(hit)upd++;else add++;
  });
  S._impList=list;
  var pv=list.slice(0,5).map(function(x){return x.name+(x.country?('('+x.country+')'):'');}).join('、');
  openModal(TX('确认导入客户','Confirm import'),TX('共解析到 ','Parsed ')+list.length+TX(' 条：新增 ',' records: new ')+add+TX(' 条，更新 ',' , update ')+upd+TX(' 条。匹配规则：客户名+国家；更新时只覆盖非空字段，不会清空已有内容。',' . Matched by name+country; only non-empty fields overwrite.')+(pv?(' '+TX('预览：','Preview: ')+pv+(list.length>5?'…':'')):''),function(){doImportLeads();});
 };
 r.readAsText(file);
}
function doImportLeads(){
 var list=S._impList||[];var add=0,upd=0;
 list.forEach(function(x){
  var hit=null;
  for(var j=0;j<S.leads.length;j++){var l=S.leads[j];if(String(l.name||'').trim()===String(x.name||'').trim()&&String(l.country||'').trim()===String(x.country||'').trim()){hit=l;break;}}
  if(hit){
   ['market','wa','email','product','stage','amount','last','note'].forEach(function(k){
    if(x[k]!==undefined&&String(x[k]).trim()!==''){
     if(k==='stage'){if(PIPE.indexOf(x.stage)>=0)hit.stage=x.stage;}
    else if(k==='source'){hit.source=x.source;}
     else if(k==='amount'){var n=Number(String(x.amount).replace(/[^0-9.\-]/g,''));if(!isNaN(n))hit.amount=n;}
     else hit[k]=x[k];
    }
   });
   if(!hit.logs)hit.logs=[];
   upd++;
  } else {
   var st=(PIPE.indexOf(x.stage)>=0)?x.stage:'待开发';
   var am=Number(String(x.amount||'').replace(/[^0-9.\-]/g,''));if(isNaN(am))am=0;
   S.leads.push({id:uid(),name:x.name,country:x.country||'',market:x.market||'',wa:x.wa||'',email:x.email||'',product:x.product||'',stage:st,amount:am,last:x.last||todayStr(),note:x.note||'',source:x.source||'',logs:[]});
   add++;
  }
 });
 save('leads',S.leads);S._impList=null;
 toast(TX('导入完成：新增 ','Imported: new ')+add+TX(' 条，更新 ',' , updated ')+upd+TX(' 条',''));
 refreshAll();
}

/* —— 日期推算引擎 —— */
function hpad(n){return (n<10?'0':'')+n;}
function hJdToGreg(jd){var a=jd+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4),d=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d/4),m=Math.floor((5*e+2)/153),day=e-Math.floor((153*m+2)/5)+1,month=m+3-12*Math.floor(m/10),year=100*b+d-4800+Math.floor(m/10);return [year,month,day];}
function hHijriJd(y,m,d){return Math.floor((11*y+3)/30)+354*y+30*m-Math.floor((m-1)/2)+d+1948440-385;}
var ISL_MAP={ramadan:[9,1],eidFitr:[10,1],eidAdha:[12,10],hijri:[1,1],mawlid:[3,12]};
function hIslMd(y,key){var mm=ISL_MAP[key];if(!mm)return '';var base=Math.floor((y-622)*33/32);for(var h=base-2;h<=base+3;h++){var g=hJdToGreg(hHijriJd(h,mm[0],mm[1]));if(g[0]===y)return hpad(g[1])+'-'+hpad(g[2]);}return '';}
function hNthMd(y,m,w,n){var first=new Date(Date.UTC(y,m-1,1)).getUTCDay();var day=1+((7-first+w)%7)+(n-1)*7;var dim=new Date(Date.UTC(y,m,0)).getUTCDate();if(day>dim)day-=7;return hpad(m)+'-'+hpad(day);}
function hEasterMd(y,off){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),hh=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-hh-k)%7,m=Math.floor((a+11*hh+22*l)/451),mo=Math.floor((hh+l-7*m+114)/31),da=((hh+l-7*m+114)%31)+1;var dt=new Date(Date.UTC(y,mo-1,da+off));return hpad(dt.getUTCMonth()+1)+'-'+hpad(dt.getUTCDate());}
function holidayMd(y,it){
 if(it.f)return it.f;
 if(it.nth)return hNthMd(y,it.nth[0],it.nth[1],it.nth[2]);
 if(it.ea!=null)return hEasterMd(y,it.ea);
 if(it.is)return hIslMd(y,it.is);
 if(it.lk){var tb=LUNAR_TBL[it.lk]||{};return tb[y]||'';}
 return '';
}

/* 年份窗口：默认「今年 + 未来 3 年」自动滚动；若记忆的年份落在窗口外，窗口自动移到该年 */
function holidayYears(){var nowY=new Date().getFullYear();var f=S._holFilter||{};var sel=f.year||0;var start=(sel&&(sel<nowY||sel>nowY+3))?sel:nowY;var out=[];for(var i=0;i<4;i++)out.push(start+i);return out;}
function holidayItems(cc,y){var c=HOLIDAYS[cc];if(!c)return [];var out=[];(c.items||[]).forEach(function(it){var md=holidayMd(y,it);if(!md)return;out.push({cc:cc,country:c.name,region:c.region,d:y+'-'+md,t:it.t,te:it.te||'',c:it.c||'n',est:!!(it.is||it.lk||it.ea!=null)});});return out;}
function holidayAll(y,flt){var rows=[];Object.keys(HOLIDAYS).forEach(function(cc){holidayItems(cc,y).forEach(function(r){if(flt&&!flt(r))return;rows.push(r);});});rows.sort(function(a,b){return a.d<b.d?-1:(a.d>b.d?1:0);});return rows;}
function holidayMissing(y){var n=0;Object.keys(HOLIDAYS).forEach(function(cc){HOLIDAYS[cc].items.forEach(function(it){if(!holidayMd(y,it))n++;});});return n;}
function nextRamadan(){var y=new Date().getFullYear();for(var i=0;i<6;i++){var md=hIslMd(y+i,'ramadan');if(md){var d=(y+i)+'-'+md;if(d>=todayStr())return d;}}var md2=hIslMd(y,'ramadan');return md2?(y+'-'+md2):todayStr();}
function holYear(y){S._holFilter=S._holFilter||{};S._holFilter.year=parseInt(y,10)||0;S._holFilter.country='';save('_holFilter',S._holFilter);refreshAll();}
function holClear(){S._holFilter={region:'',country:'',q:'',year:0};save('_holFilter',S._holFilter);refreshAll();toast(TX('已重置节假日筛选','Filters reset'));}
function holidayFilterBar(){
 var f=S._holFilter||{};var cur=f.year||new Date().getFullYear();var nowY=new Date().getFullYear();var today=todayStr();
 var tabs=holidayYears().map(function(y){
  var all=holidayAll(y);var n=(y===nowY)?all.filter(function(r){return r.d>=today;}).length:all.length;
  var lab=(y===nowY)?(y+' · '+TX('余','left')+n):(y+' · '+n);
  return '<button class="btn '+(y===cur?'amber':'ghost')+' mini" data-action="holYear" data-y="'+y+'" title="'+TX('查看 '+y+' 年全部节假日','View all holidays in '+y)+'">'+lab+'</button>';
 }).join('');

function renderHolidays(){
 var box=$('holList');if(!box)return;
 var f=S._holFilter||{};var y=f.year||new Date().getFullYear();var today=todayStr();
 var rows=holidayAll(y,function(r){
  if(f.region&&r.region!==f.region)return false;
  if(f.country&&r.cc!==f.country)return false;
  if(f.q){var q=f.q;if((r.country+r.t+(r.te||'')).toLowerCase().indexOf(q)<0)return false;}
  return true;
 });
 if(!rows.length){box.innerHTML='<div class="card muted" style="text-align:center">'+TX('没有匹配的节假日。','No matching holidays.')+'</div>';return;}
 var up=rows.filter(function(r){return r.d>=today;}).length;

 var html='<div class="hint" style="margin-bottom:4px">'+y+TX(' 年：共 ',' — ')+rows.length+TX(' 个节日','holidays')+(y===new Date().getFullYear()?TX('；未来 30 天 ',' — next 30 days: ')+soon+TX(' 个',''):TX('；今日之后 ',' — upcoming ')+up+TX(' 个',''))+'</div>';
 rows.forEach(function(r){var past=r.d<today;var dd=daysBetween(today,r.d);

/* ============ 交付履约 ============ */
function viewDeliver(){
 var h=shead('deliver',TX('订单SOP + 验货要点 + 交付沟通脚本。交付稳，复购才来。','Order SOP + QC checklist + delivery scripts. Stable delivery → reorders.'));
 var dl=S.leads.filter(function(l){return l.stage==='成交';});
 h+='<div class="card" style="margin-bottom:14px"><h3 style="margin:0 0 6px;font-size:15px">'+TX('当前交付中订单（真实客户库）','Orders in delivery (your real leads)')+'</h3>';
 if(!dl.length){
  h+='<div class="hint">'+TX('暂无「成交」客户。去「客户汇总 / 找客户」把线索推进到成交，这里会出现待交付订单，并能一键带入下方话术生成器。','No "成交" clients yet. Push a lead to 成交 in Customer Hub, and it appears here — ready to feed the script generator below.')+' <button class="btn ghost mini" data-action="nav" data-view="find" style="margin-left:6px">'+TX('去推进线索 →','Push leads →')+'</button></div>';
 }else{
  h+='<div class="grid g2">';
  dl.forEach(function(l){var days=Math.round((new Date(todayStr())-new Date(l.last))/864e5);var amt=l.amount?(' $'+l.amount):'';
   h+='<div class="card" style="margin:0"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>'+esc(l.name)+'</b>'+(l.market?'<span class="tag">'+esc(l.market)+'</span>':'')+'</div><div class="muted" style="font-size:12.5px;margin:4px 0 8px">'+TX('金额','Amount')+amt+' · '+TX('最近','Last')+' '+days+' '+TX('天前','d ago')+'</div><button class="btn mini" data-action="deliverUse" data-id="'+l.id+'">'+TX('用此客户生成通知','Use for scripts')+'</button></div>';});
  h+='</div>';
 }
 h+='</div>';
 h+=sceneBox(['ready_ship','ship_advice','track']);
 h+=sopCard();
 h+=qcCard();
 h+='<div class="card" style="margin-top:14px;background:#f1f5f9"><div class="shead" style="margin:0"><div class="ic">'+ICON.docs+'</div><div><h2 style="font-size:15px">'+TX('下一步：备齐全套外贸单据','Next: prepare the full document set')+'</h2><p>'+TX('出货前要把 全套外贸单证一次性备齐——发票、箱单、提单、原产地证、报关单、保险单、汇票、检验证、装船通知、受益人证明，以及按条件出具的熏蒸/海关/领事/船证等。','Before shipment, prepare all 15 docs at once — invoice, packing list, B/L, C/O, customs decl., insurance, draft, inspection, shipping advice, beneficiary cert, plus conditional ones.')+'</p></div></div><div class="row"><button class="btn amber" data-action="nav" data-view="docs">'+TX('去备外贸单据 →','Go to Trade Documents →')+'</button></div></div>';
 h+='<div class="card" style="margin-top:14px;background:#ecfdf5"><div class="shead" style="margin:0"><div class="ic">'+ICON.repeat+'</div><div><h2 style="font-size:15px">'+TX('交付完成 → 进「复购转介」养老客','After delivery → Reorder to retain')+'</h2><p>'+TX('货到确认、售后回访后，用「复购转介」的节期日历触发返单，并趁信任高要转介绍——复购比开发新客便宜太多。','After goods arrive & after-sales, use Reorder’s festival calendar to trigger reorders and ask for referrals while trust is high.')+'</p></div></div><div class="row"><button class="btn green" data-action="nav" data-view="repeat">'+TX('去复购转介 →','Go to Reorder →')+'</button></div></div>';
 return h;
}

function sopPaintAll(){
 var done=sopList(),N=SOP_STEPS.length,i,on,dot,row;
 for(i=0;i<N;i++){on=done.indexOf(String(i))>=0;dot=$('sopDot'+i);row=$('sopRow'+i);
  if(dot){dot.textContent=on?'✓':String(i+1);dot.style.background=on?'#16a34a':'#fff';dot.style.borderColor=on?'#16a34a':'#c7d2e5';dot.style.color=on?'#fff':'#334155';}
  if(row){row.style.opacity=on?'0.55':'1';}
 }

 if(bar)bar.style.width=Math.round(done.length/N*100)+'%';
 if(pg)pg.textContent=done.length+' / '+N;
}

/* ============ 复盘增长 ============ */
function reviewDrill(kind){
 var f={q:'',market:'',stage:'',source:'',since:'',stages:[],overdue:false,reorder:false,nomail:false};
 if(kind==='new'){f.since=iso(new Date(),-30);}
 else if(kind==='talk'){f.stages=['已联系','已回复','试样','报价'];}
 else if(kind==='deal'){f.stage='成交';}
 else if(kind==='warn'){f.overdue=true;}
 else if(kind==='reorder'){f.reorder=true;}
 else if(kind==='nomail'){f.nomail=true;}
 else if(kind==='mails'||kind==='mails30'){S._mailFilter='all';save('_mailFilter',S._mailFilter);S.view='mails';save('view',S.view);S._activeClient='';refreshAll();return;}
 S._leadFilter=f;save('_leadFilter',f);S.view='find';save('view',S.view);S._activeClient='';refreshAll();
 if($('lf_stage')&&f.stage)$('lf_stage').value=f.stage;
}
/* ---- 复盘：统一数据上下文（指标 / 洞察 / 模板共用同一份数字，避免板块内数据打架） ---- */
function rvCtx(){
 var _l=S.leads||[];
 var total=_l.length;
 var contacted=_l.filter(function(l){return ['已联系','已回复','试样','报价','成交'].indexOf(l.stage)>=0;}).length;
 var talking=_l.filter(function(l){return ['已联系','已回复','试样','报价'].indexOf(l.stage)>=0;}).length;
 var adv=_l.filter(function(l){return ['试样','报价'].indexOf(l.stage)>=0;}).length;
 var deal=_l.filter(function(l){return l.stage==='成交';}).length;
 var warn=_l.filter(function(l){return l.stage!=='成交'&&Math.round((new Date(todayStr())-new Date(l.last))/864e5)>=14;}).length;
 var dev=_l.filter(function(l){return l.last>=iso(new Date(),-30);}).length;
 var cnt={},max=0,bot='—';
 _l.forEach(function(l){if(l.stage!=='成交')cnt[l.stage]=(cnt[l.stage]||0)+1;});
 Object.keys(cnt).forEach(function(k){if(cnt[k]>max){max=cnt[k];bot=k;}});
 var w=0;_l.forEach(function(l){var p=(l.stage==='成交'?1:(STAGE_W[l.stage]||0)/100);w+=(l.amount||0)*p;});
 var sumDeal=_l.reduce(function(s,l){return s+(l.stage==='成交'?(+l.amount||0):0);},0);
 var mst=mailStats();
 var dWithMail=_l.filter(function(l){return l.stage==='成交'&&mailCount(l.id)>0;}).length;
 var rr=deal?Math.round(dWithMail/deal*100):0;
 var conv=total?Math.round(deal/total*100):0;
 var dR=Math.max(0,daysBetween(todayStr(),nextRamadan()));
 var reached=_l.filter(function(l){return mailCount(l.id)>0;}).length;
 var nomail=_l.filter(function(l){return l.stage!=='成交'&&mailCount(l.id)===0;}).length;
 var hol=[];
 try{var now=todayStr(),end=iso(new Date(),30),yy=new Date().getFullYear();
  hol=holidayAll(yy).concat(holidayAll(yy+1)).filter(function(r){return r.d>=now&&r.d<=end&&['中东','东南亚','南亚','非洲'].indexOf(r.region)>=0;});
 }catch(e){hol=[];}
 return {ls:_l,total:total,contacted:contacted,talking:talking,adv:adv,deal:deal,warn:warn,dev:dev,bot:bot,max:max,w:w,sumDeal:sumDeal,mst:mst,dWithMail:dWithMail,rr:rr,conv:conv,dR:dR,reached:reached,nomail:nomail,hol:hol};
}

  +'6. '+TX('逾期未跟进 ','Overdue ')+c.warn+TX(' 个；从未触达 ',' ; never contacted ')+c.nomail+TX(' 个','')+'\n'
  +'7. '+TX('卡在哪：','Stuck at: ')+(c.bot||'—')+TX('（最多 ','(max ')+(c.bot!=='—'?c.max:0)+TX(' 条）',')')+'\n'

function rvSave(){

 if(!((d.next||'').trim()||(d.act||'').trim())){toast(TX('先写「下周重点」或「可复制的动作」再存档','Write the focus or the action before archiving'));return;}

 S.rvLog.push({id:uid(),date:todayStr(),text:rvFullText()});
 save('rvLog',S.rvLog);
 S.rvDraft={next:'',act:''};save('rvDraft',S.rvDraft);
 refreshAll();toast(TX('已存档本期复盘，下周可对比','Review archived — compare next week'));

 if(!txt){toast(TX('先写「下周重点」，再一键排成待办','Write the focus first, then add it as to-dos'));return;}

 save('tasks',S.tasks);
 refreshAll();toast(TX('已排入待办（7 天后到期）','Added to to-dos (due in 7 days)'));

  TX('产品还说不清。先说出"颜色/规格/材质"，对方脑子里没画面，就等于没有产品。','Product is unclear. Name color/spec/material — if they cannot picture it, you have no product.'),

  TX('只有单价格带 → 按引流款/利润款分层（价差拉到 10 倍），别只卖最便宜那一种。','Single tier → split drain/profit tiers (10x gap); do not sell only the cheapest one.'),

 add('buyer',TX('需求·买家画像清楚','Demand · buyer profile clear'),has(a.buyer),
  TX('买家画像缺失。B2B 买家是为转售/节期供应而采购，真实需求是"确定感+不缺货"，要写清"市场+客户类型"。','Buyer profile missing. B2B buyers purchase to resell / for season; the real need is certainty + no stock-out. Write market + buyer type.'),

  'find',TX('去找客户','Find leads'));
 add('channel',TX('流量-变现·有获客渠道','Flow · acquisition channel'),has(a.channel),

  TX('已有获客渠道。注意：获客与成交别挤在同一个地方。','Channel exists. Keep acquisition and closing separate.'),
  'find',TX('去找客户','Find leads'));
 add('deliver',TX('道德·真实交易与交付','Ethics · real trade & delivery'),has(a.deliver),
  TX('交付路径不明 → 先确认这条链路真能交货收款，别接了自己交不出。','Delivery path unclear — confirm you can really ship and get paid before taking orders.'),

  'deliver',TX('去交付单证','Delivery'));
 var ok5=L.filter(function(x){return x.ok;}).length;
 add('scale',TX('规模化·能交出去做','Scale · SOP-able'),ok5>=4,

function coachFix(chk){
 var order=['product','price','buyer','channel','deliver','level'];
 var by={};(chk||[]).forEach(function(c){by[c.k]=c;});
 for(var i=0;i<order.length;i++){var c=by[order[i]];if(c&&!c.ok)return c;}
 return null;
}
function coachMoves(chk,fx){
 var m=[];
 if(fx)m.push(TX('补「'+fx.n+'」：','Fix “'+fx.n+'”: ')+fx.no);

}
function coachTextFrom(chk,ans,when){

 rep+=TX('产品','Product')+'：'+(a.product||TX('未填','—'))+'\n'+TX('价格','Price')+'：'+(a.price||TX('未填','—'))+'\n'+TX('客户','Buyer')+'：'+(a.buyer||TX('未填','—'))+'\n'+TX('获客','Acquisition')+'：'+(a.channel||TX('未填','—'))+'\n'+TX('交付','Delivery')+'：'+(a.deliver||TX('未填','—'))+'\n'+TX('月销','Monthly sales')+'：'+(a.sales||TX('未填','—'))+'\n\n';
 var okN=chk.filter(function(c){return c.ok;}).length;
 rep+='—— '+TX('七项检验','Seven Checks')+'（'+okN+'/'+chk.length+' '+TX('通过','passed')+'）——\n';
 chk.forEach(function(c,i){rep+=(i+1)+'. '+(c.ok?'[✓] ':'[✗] ')+c.n+'：'+(c.ok?c.yes:c.no)+'\n';});
 var fx=coachFix(chk);
 rep+='\n—— '+TX('结论','Conclusion')+' ——\n'+TX('总分','Score')+'：'+okN+'/'+chk.length+'\n';
 if(fx)rep+=TX('最大短板','Biggest gap')+'：'+fx.n+'\n'+TX('先修哪一段','Fix first')+'：'+fx.vlab+'\n';
 else rep+=TX('结论','Conclusion')+'：'+TX('七项全过，可以进入"持续获客系统"阶段了。','All 7 passed — move to the sustained-acquisition stage.')+'\n';
 rep+=TX('30 天动作','30-day moves')+'：\n'+coachMoves(chk,fx).map(function(t,i){return '  '+(i+1)+'. '+t;}).join('\n')+'\n';
 return rep;
}

function coachCompareHTML(){

function exportJson(){
 var dump={__wb_format:1,__wb_version:'full',exported:todayStr()};
 PERSIST_KEYS.forEach(function(k){
   var val;
   if(k in S && S[k]!==undefined){val=S[k];}
   else{try{var raw=localStorage.getItem(KEY+k);val=(raw!==null)?JSON.parse(raw):undefined;}catch(e){val=undefined;}}
   if(val!==undefined)dump[k]=val;
 });
 var str=JSON.stringify(dump,null,2);
 var a=document.createElement('a');a.download='外贸工作台_全量备份_'+todayStr()+'.json';
 try{var blob=new Blob([str],{type:'application/json'});a.href=(window.URL&&URL.createObjectURL)?URL.createObjectURL(blob):('data:application/json;charset=utf-8,'+encodeURIComponent(str));}
 catch(e){a.href='data:application/json;charset=utf-8,'+encodeURIComponent(str);}
 a.click();toast(TX('已导出全量备份（'+Object.keys(dump).length+' 项数据）','Full backup exported ('+Object.keys(dump).length+' items)'));
}
function importJson(){
 var f=document.createElement('input');f.type='file';f.accept='application/json,.json';
 f.onchange=function(){
  var file=(f.files||[])[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(){
   try{
     var d=JSON.parse(String(r.result||''));
     if(!d||typeof d!=='object'){toast(TX('文件格式错误','Bad file'));return;}
     var n=0;
     PERSIST_KEYS.forEach(function(k){
       if(k in d && d[k]!==undefined){S[k]=d[k];save(k,S[k]);n++;}
     });
     if(d.me&&typeof d.me==='object'){S.me=d.me;save('me',S.me);}
     toast(TX('已恢复 '+n+' 类数据，刷新中…','Restored '+n+' sets, refreshing…'));
     refreshAll();
   }catch(e){toast(TX('文件解析失败，请确认是备份文件','Parse failed — not a backup file'));}
  };
  r.readAsText(file);
 };
 f.click();
}

/* ============ 术语悬浮卡（新手友好） ============ */
var _tipReady=false,_GLOSS=null,_GLOSS_RE=null;
function glossDefs(){ if(_GLOSS)return _GLOSS;
 var D=[
  ['FOB','FOB','船上交货（指定装运港）：卖方把货装上船即完成交货，之后运费与风险由买方承担。最常用来报价。'],
  ['CIF','CIF','成本+保险+运费（指定目的港）：卖方付到目的港的运费和保费，但风险仍在装运港过船舷时转给买方。'],
  ['CFR','CFR','成本+运费（指定目的港）：与 CIF 类似但卖方不买保险，买方自理。'],
  ['EXW','EXW','工厂交货：卖方只把货备在自家工厂，买方自提并承担之后一切，卖方责任最小。'],
  ['FCA','FCA','货交承运人：卖方把货交给买方指定的承运人或地点即完成交货，适合空运/铁路/拼箱。'],
  ['MOQ','MOQ','最小起订量（Minimum Order Quantity）：工厂要求的一次最少下单数量，决定你的起订门槛与现金流。'],
  ['PI','PI','形式发票（Proforma Invoice）：报价/打样前给客户的预发票，用于申请进口许可或付汇，非正式结算单据。'],
  ['RFQ','RFQ','采购询盘（Request for Quotation）：买家发给供应商的询价需求，是开发信的高意向回复。'],
  ['ETA','ETA','预计到达时间（Estimated Time of Arrival）。'],
  ['ETD','ETD','预计开船/出发时间（Estimated Time of Departure）。'],
  ['LC','L/C','信用证（Letter of Credit）：银行担保付款，单证相符才放款，是外贸最安全的收款方式之一。'],
  ['BL','B/L','提单（Bill of Lading）：海运物权凭证，提货必备，谁持正本谁提货。'],
  ['INCOTERMS','Incoterms','国际贸易术语解释通则，规定买卖双方在交货、风险、费用上的责任划分（如 FOB/CIF）。'],
  ['HSCODE','HS\\s*编码','HS 编码（商品编码）：海关用来分类和征税的统一商品编号，报关必填。'],
  ['DESTPORT','目的港','货物最终到达的港口。'],
  ['POLPORT','装货港','货物装船起运的港口。'],
  ['PIFORM','形式发票','即 PI（Proforma Invoice）。'],
  ['CI','商业发票','Commercial Invoice：清关与结算用的正式发票，金额须与提单等单单一致。'],
  ['BLADING','提单','即 B/L，海运物权凭证。'],
  ['LCREDIT','信用证','即 L/C，银行担保付款。'],
  ['DOCS','单证','外贸全套单据（发票/箱单/提单/产地证等），须做到单单一致、单证一致。'],
  ['SEALSAMPLE','封样','打样后双方确认的样品，作为大货验收标准，避免货不对板。'],
  ['BULK','大货','正式批量生产的订单货物（区别于样品）。'],
  ['MOREORLESS','溢短装','交货数量允许的合理上下浮动（如 ±3%），以装运量为准。'],
  ['TT','T/T|电汇','电汇（Telegraphic Transfer）：买家直接汇款，常见于定金+尾款。']
 ];
 _GLOSS=D; return D;
}
function glossRegex(){ if(_GLOSS_RE)return _GLOSS_RE;
 var D=glossDefs(); var alt=D.map(function(d,i){return '(?<g'+i+'>'+d[1]+')';}).join('|');
 _GLOSS_RE=new RegExp('(?<![A-Za-z0-9])('+alt+')(?![A-Za-z0-9])','g'); return _GLOSS_RE;
}
function glossText(key){ var D=glossDefs(); for(var i=0;i<D.length;i++) if(D[i][0]===key) return D[i][2]; return ''; }
function ensureTip(){ if(_tipReady)return;_tipReady=true;
 var tip=document.createElement('div'); tip.id='wbTip'; tip.style.cssText='position:fixed;z-index:9999;max-width:300px;background:#1f2937;color:#fff;padding:9px 11px;border-radius:8px;font-size:12.5px;line-height:1.55;box-shadow:0 6px 22px rgba(0,0,0,.28);pointer-events:none;display:none';
 (document.body||document.documentElement).appendChild(tip);
 document.addEventListener('mouseover',function(e){ var t=e.target.closest?e.target.closest('.g'):null; if(!t){return;} var txt=glossText(t.getAttribute('data-g')); if(!txt){tip.style.display='none';return;} tip.textContent=txt; tip.style.display='block'; var r=t.getBoundingClientRect(); var x=r.left,y=r.bottom+8; if(x+300>window.innerWidth)x=window.innerWidth-308; if(y+tip.offsetHeight>window.innerHeight)y=r.top-tip.offsetHeight-8; tip.style.left=Math.max(6,x)+'px'; tip.style.top=Math.max(6,y)+'px'; });
 document.addEventListener('mouseout',function(e){ var t=e.target.closest?e.target.closest('.g'):null; if(t)tip.style.display='none'; });
}
function applyGlossary(){
 try{
  ensureTip();
  var root=document.getElementById('view'); if(!root)return;
  var skip={INPUT:1,TEXTAREA:1,SELECT:1,SCRIPT:1,STYLE:1,OPTION:1};
  var re=glossRegex(); re.lastIndex=0; var D=glossDefs();
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false);
  var list=[],node; while((node=walker.nextNode())){ if(skip[node.parentNode.tagName])continue; if(node.parentNode.classList&&node.parentNode.classList.contains('g'))continue; re.lastIndex=0; if(!re.test(node.nodeValue))continue; list.push(node); }
  list.forEach(function(n){
   var str=n.nodeValue, frag=document.createDocumentFragment(), last=0, m; re.lastIndex=0;
   while((m=re.exec(str))){
    if(m.index>last)frag.appendChild(document.createTextNode(str.slice(last,m.index)));
    var key=''; for(var i=0;i<D.length;i++){ if(m.groups['g'+i]!==undefined){key=D[i][0];break;} }
    var sp=document.createElement('span'); sp.className='g'; sp.setAttribute('data-g',key); sp.textContent=m[0];
    frag.appendChild(sp); last=re.lastIndex;
   }
   if(last<str.length)frag.appendChild(document.createTextNode(str.slice(last)));
   n.parentNode.replaceChild(frag,n);
  });
 }catch(e){}
}

function reconAuto(){

 reconCollect(l);
 var box=$('recon_ai');
 var txt=String((box?box.value:'')||(l.recon&&l.recon.ai)||'');
 if(!txt.trim()){ toast(TX('先把 AI 返回的内容粘到下面的框里','Paste the AI output first')); return; }
 var neg=/(not found|could not find|cannot find|couldn't find|no records?|no evidence|no information|no public|no\s+(?:record|evidence|negative|complaint|lawsuit|litigation|dispute|public|information)\b|未找到|查不到|没有找到|无记录|无相关信息|暂无)/i;
 var risk=/(complaints?|lawsuit|litigation|dispute|blacklist|scam|fraud|unpaid|bad review|投诉|纠纷|诉讼|黑名单|诈骗|失信)/i;
 var POL={entity:'bad',biz:'bad',buy:'bad',dm:'bad',credit:'ok',comply:'skip'};
 var kw={
  entity:/(official site|official website|website|company regist|registered|registration|官网|注册|实体)/i,
  biz:/(main products|product line|portfolio|catalog|brand|brands|retailer|distributor|主营|经营范围|货架|门店)/i,
  buy:/(import|importer|purchas|procure|sourcing|hs code|bill of lading|进口|采购|报关)/i,
  dm:/(founder|owner|ceo|managing director|purchas|procurement|linkedin|创始人|总经理|决策人|采购经理)/i,
  credit:/(complaint|lawsuit|litigation|dispute|blacklist|negative|reviews?|投诉|纠纷|诉讼|黑名单|负面)/i,
  comply:/(certificat|halal|\bce\b|fda|reach|compliance|认证|合规)/i
 };
 var n=0, lines=txt.split(/\n+/);
 RECON_CHECKS.forEach(function(c){
  if(POL[c.k]==='skip') return;
  var hit='',isNeg=false;
  for(var i=0;i<lines.length;i++){
   var ln=lines[i];
   if(kw[c.k]&&kw[c.k].test(ln)){ hit=ln; isNeg=neg.test(ln); break; }

  if(!hit) return;
  if(isNeg){ l.recon.ev[c.k]=(POL[c.k]==='ok')?'ok':'bad'; }
  else { l.recon.ev[c.k]=(c.k==='credit'&&risk.test(hit))?'bad':'ok'; }
  n++;
 });
 if(!l.recon.evnote) l.recon.evnote={};

 l.recon.report=reconReport(l);
 snapLeads(); save('leads',S.leads);
 refreshAll();

}

 var l={id:uid(),name:name,country:$('ld_country').value.trim(),market:$('ld_market').value,wa:$('ld_wa').value.trim(),email:$('ld_email').value.trim(),product:$('ld_product').value.trim(),stage:$('ld_stage').value,source:($('ld_source')?$('ld_source').value:''),amount:0,last:todayStr(),note:'',logs:[]};
 S.leads.unshift(l);snapLeads();save('leads',S.leads);refreshAll();toast(TX('已添加','Added'));
}
function leadAdv(id){var l=S.leads.find(function(x){return x.id===id;});if(!l)return;var i=PIPE.indexOf(l.stage);if(i<PIPE.length-1)l.stage=PIPE[i+1];l.last=todayStr();snapLeads();save('leads',S.leads);refreshAll();}
function leadTouch(id){var l=S.leads.find(function(x){return x.id===id;});if(!l)return;var note=prompt(TX('记录本次跟进（如：发了绣金样品质检）：','Log this follow-up (e.g. sent embroidered sample QC):'),l.note||'');if(note!==null){l.logs=l.logs||[];l.logs.unshift({date:todayStr(),text:note});l.note=note;l.last=todayStr();snapLeads();save('leads',S.leads);refreshAll();toast(TX('已记录','Logged'));}}
function logSend(id,channel,text){var l=S.leads.find(function(x){return x.id===id;});if(!l)return;l.logs=l.logs||[];var sn=(text||'').replace(/\s+/g,' ').trim().slice(0,40);var ch=channel==='wa'?TX('WhatsApp','WhatsApp'):TX('邮件','Email');l.logs.unshift({date:todayStr(),text:ch+'：'+(sn||TX('(已发起联系)','contact initiated'))});l.last=todayStr();snapLeads();save('leads',S.leads);refreshAll();}
function recordMail(leadId,to,subject,body,channel){try{S.mails=S.mails||[];var lead=(S.leads||[]).find(function(x){return x.id===leadId;});S.mails.unshift({id:uid(),leadId:leadId||'',toName:(lead&&lead.name)?lead.name:(to||''),to:to||'',subject:subject||'',body:body||'',channel:channel||'email',date:todayStr()});save('mails',S.mails);}catch(e){}}
function mailCount(leadId){if(!leadId)return 0;var n=0;(S.mails||[]).forEach(function(m){if(m.leadId&&String(m.leadId)===String(leadId))n++;});return n;}
function mailStats(){var l=S.mails||[],c7=iso(new Date(),-6),c30=iso(new Date(),-29);var s={total:l.length,w7:0,w30:0,cli:0,wa:0,unlinked:0};var seen={};l.forEach(function(m){if(m.date>=c7)s.w7++;if(m.date>=c30)s.w30++;if(m.channel==='wa')s.wa++;if(m.leadId){if(!seen[m.leadId]){seen[m.leadId]=1;s.cli++;}}else s.unlinked++;});return s;}
function viewMails(){
 var h=shead('mails',TX('所有发出去的邮件 / WhatsApp 都会留痕在这里。点「重发」可一键再次调取原内容发送——适合跟进、催单、节期问候的重复触达。','Every sent email / WhatsApp is logged here. Hit “Re-send” to pull the original content and send again — great for follow-ups, balance chasing and festival greetings.'));
 var list=S.mails||[];
 if(!list.length){
  h+='<div class="card" style="text-align:center;color:var(--sub);padding:30px 16px">'+TX('还没有发送记录。去「触达建联 / 建立信任 / 报价成交 / 交付履约 / 复购转介」任一板块生成话术后点「发邮件 / 发 WhatsApp」即可留痕。','No records yet. Generate a script in any board and hit “Send” to log it here.')+'</div>';
  h+='<div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap">';
  ['reach','trust','deal','deliver','repeat'].forEach(function(k){var m=STAGE_META[k];h+='<button class="btn ghost mini" data-action="nav" data-view="'+k+'">'+TX(m.t,m.te)+'</button>';});
  h+='</div>';
  return h;
 }
 var st=mailStats();
 h+='<div class="card" style="margin-bottom:12px"><div class="grid g4" style="gap:10px">';
 h+='<div class="stat"><div class="v">'+st.total+'</div><div class="k">'+TX('累计发送','Total sent')+'</div></div>';
 h+='<div class="stat"><div class="v">'+st.w7+'</div><div class="k">'+TX('近7天','Last 7 days')+'</div></div>';
 h+='<div class="stat"><div class="v">'+st.cli+'</div><div class="k">'+TX('覆盖客户','Clients reached')+'</div></div>';
 h+='<div class="stat"><div class="v"'+(st.unlinked?' style="color:#b45309"':'')+'>'+st.unlinked+'</div><div class="k">'+TX('未关联客户','Not linked')+'</div></div>';
 h+='</div>';
 var mf=S._mailFilter||'all';
 var opt='<option value="all"'+(mf==='all'?' selected':'')+'>'+TX('全部记录','All records')+'</option>';
 opt+='<option value="unlinked"'+(mf==='unlinked'?' selected':'')+'>'+TX('未关联客户的记录','Not linked to a client')+'</option>';
 var _co=[];
 (S.leads||[]).forEach(function(l){var c=mailCount(l.id);if(c)_co.push('<option value="'+esc(String(l.id))+'"'+(String(mf)===String(l.id)?' selected':'')+'>'+esc(l.name)+'（'+c+'）</option>');});
 if(_co.length)opt+='<optgroup label="'+TX('按客户查看','By client')+'">'+_co.join('')+'</optgroup>';
 h+='<div class="row" style="align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap"><span class="hint" style="margin:0">'+TX('查看','View')+'</span><select id="mailFilter" onchange="mailFilterSet(this.value)" style="min-width:210px">'+opt+'</select><span style="flex:1"></span><button class="btn amber mini" data-action="bulkOpen">'+TX('群发助手','Bulk send')+'</button><button class="btn ghost mini" data-action="mailClear">'+TX('清空记录','Clear all')+'</button></div></div>';
 var shown=mailFiltered(list);
 if(!shown.length){h+='<div class="card muted" style="text-align:center;padding:22px">'+TX('该筛选下没有记录。','No records under this filter.')+'</div>';}
 else h+='<div id="mailWrap">'+mailListHTML(shown)+'</div>';
 h+='<div class="hint" style="margin-top:8px">'+TX('发送记录与「找客户」的跟进时间线、客户360、以及客户驾驶舱的「已发送」指标是同一份数据：在这里重发一次，客户的最后跟进日会同步刷新。','This log shares one dataset with the lead timeline, Client 360 and the Customer Hub “Sent” KPI — re-sending here also refreshes the client’s last-contact date.')+'</div>';
 return h;
}
function mailFiltered(list){
 var mf=S._mailFilter||'all';
 if(mf==='unlinked')return list.filter(function(m){return !m.leadId;});
 if(mf&&mf!=='all')return list.filter(function(m){return String(m.leadId)===String(mf);});
 return list;
}
function mailFilterSet(v){S._mailFilter=v||'all';save('_mailFilter',S._mailFilter);refreshAll();}
function mailOf(id){S._mailFilter=id||'all';save('_mailFilter',S._mailFilter);S.view='mails';save('view',S.view);S._activeClient='';refreshAll();}
function mailListHTML(src){
 var list=src||S.mails||[],html='';
 list.forEach(function(m){
  var sub=enText(m.subject)||TX('（无主题）','（no subject）');
  var ch=m.channel==='wa'?TX('WhatsApp','WhatsApp'):TX('邮件','Email');
  var sn=enText(m.body||'').replace(/\s+/g,' ').trim().slice(0,80);
  html+='<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px"><b style="font-size:14px">'+esc(sub)+'</b><span class="tag">'+esc(ch)+'</span></div>';
  var ld=m.leadId?((S.leads||[]).find(function(x){return String(x.id)===String(m.leadId);})):null;
  html+='<div class="muted" style="font-size:12.5px;margin-bottom:4px">'+TX('收件','To')+': '+esc(m.toName||'')+' &lt;'+esc(m.to||'')+'&gt; · '+esc(m.date||'')+(ld?'':' · <span class="tagmini">'+TX('未关联客户','Not linked')+'</span>')+'</div>';
  if(sn)html+='<div class="out" style="margin-bottom:8px">'+esc(sn)+(sn.length>=80?'…':'')+'</div>';
  html+='<div style="margin-top:6px">'+(ld?'<button class="btn mini" data-action="lead360" data-id="'+esc(String(m.leadId))+'">'+TX('客户360','Client 360')+'</button>':'')+'<button class="btn amber mini" data-action="resendMail" data-id="'+m.id+'">'+TX('重发','Re-send')+'</button>'+(ld?'<button class="btn ghost mini" data-action="leadTouch" data-id="'+esc(String(m.leadId))+'" style="margin-left:6px">'+TX('记录跟进','Log')+'</button>':'')+'<button class="btn ghost mini" data-action="mailDel" data-id="'+m.id+'" style="margin-left:6px;color:var(--red)">'+TX('删除','Delete')+'</button></div>';
  html+='</div>';
 });
 return html;
}
function mailList360(id){
 var list=(S.mails||[]).filter(function(m){return m.leadId===id;});
 if(!list.length)return '<div class="muted">'+TX('暂无发送给该客户的邮件记录','No emails sent to this client yet')+'</div>';
 var html='';
 list.forEach(function(m){
  var sub=enText(m.subject)||TX('（无主题）','（no subject）');
  var sn=enText(m.body||'').replace(/\s+/g,' ').trim().slice(0,60);
  html+='<div style="padding:6px 0;border-top:1px dashed var(--line);font-size:13px"><span class="tag b">'+esc(m.date||'')+'</span> '+esc(sub)+(sn?' <span class="muted">'+esc(sn)+'…</span>':'')+' <button class="btn ghost mini" data-action="resendMail" data-id="'+m.id+'" style="margin-left:6px">'+TX('重发','Re')+'</button></div>';
 });
 return html;
}
function resendMail(id){
 var m=(S.mails||[]).find(function(x){return x.id===id;});if(!m){toast(TX('记录不存在','Record missing'));return;}
 var l=(S.leads||[]).find(function(x){return String(x.id)===String(m.leadId);});
 if(!l){l={name:m.toName||'',email:m.to||''};}
 openEmailModal(l,m.subject||'',m.body||'');
}
function mailDel(id){
 var arr=S.mails||[];var i=arr.findIndex(function(x){return x.id===id;});
 if(i>=0){arr.splice(i,1);save('mails',arr);}
 refreshAll();toast(TX('已删除','Deleted'));
}
function mailClear(){
 if(!(typeof confirm==='function'?confirm(TX('清空全部发送记录？此操作不可恢复','Permanently clear all sent records?')):true)){return;}
 S.mails=[];save('mails',S.mails);refreshAll();toast(TX('已清空','Cleared'));
}
/* ============ 群发助手（逐封 Gmail 发送） ============ */
var _bulk=null;
function bulkFill(t,l){
 t=(''+(t||''));
 var name=l.name||'',company=l.company||(S.me&&S.me.company)||'',product=l.product||(S.me&&S.me.product)||'',market=enMarket(l.market)||l.country||'',country=enMarket(l.country)||enMarket(l.market)||'';
 return (''+t).replace(/\{name\}/g,name).replace(/\{姓名\}/g,name).replace(/\{company\}/g,company).replace(/\{公司\}/g,company).replace(/\{product\}/g,product).replace(/\{产品\}/g,product).replace(/\{market\}/g,market).replace(/\{市场\}/g,market).replace(/\{country\}/g,country).replace(/\{国家\}/g,country);
}
function bulkRecipientsBox(){
 var leads=(S.leads||[]).filter(function(x){return x.email&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x.email);});
 var h='<label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">'+TX('从线索库选择（有邮箱的）','Select leads with email')+'</label>';
 h+='<div style="max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px">';
 if(!leads.length)h+='<div class="muted" style="font-size:13px">'+TX('线索库还没有带邮箱的客户。可去「找客户」录入，或在下方粘贴邮箱。','No leads with email yet. Add in Find Leads, or paste emails below.')+'</div>';
 leads.forEach(function(l){h+='<label style="display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13px"><input type="checkbox" class="bulk-chk" value="'+esc(l.id)+'"> '+esc(l.name)+' <span class="muted">&lt;'+esc(l.email)+'&gt;</span>'+(l.market?' <span class="tag b">'+esc(l.market)+'</span>':'');});
 h+='</div><div class="row" style="margin-top:6px"><button class="btn ghost mini" data-action="bulkToggleAll">'+TX('全选/全不选','Select all/none')+'</button><span class="muted" style="font-size:12px" id="bulkCnt"></span></div>';
 h+='<label style="font-size:12px;color:var(--sub);display:block;margin-top:8px">'+TX('或粘贴邮箱（每行一个）','Or paste emails (one per line)')+'</label><textarea id="bulkPaste" rows="2" placeholder="buyer1@x.com&#10;buyer2@y.com" style="width:100%;margin-top:4px"></textarea>';
 return h;
}
function bulkTplBox(){
 var opts='<option value="">'+TX('（空白模版，自己写）','（blank, write your own）')+'</option>';
 (S.scripts||[]).forEach(function(s){opts+='<option value="s_'+s.id+'">'+TX('话术库','Lib')+': '+esc(s.title||'')+'</option>';});
 (EMAIL_TPLS||[]).forEach(function(t,i){opts+='<option value="t_'+i+'">'+TX('模版库','TPL')+': '+esc(t.title||t.stage||'')+'</option>';});
 var h='<div class="field" style="margin-top:10px"><label>'+TX('套用模版（可选）','Template (optional)')+'</label><select id="bulkTplSel" onchange="bulkTplFill(this.value)">'+opts+'</select></div>';
 h+='<div class="field" style="margin-top:8px"><label>'+TX('邮件主题','Subject')+'（可用 {name}{company}{product}{market}）</label><input id="bulkSubj" placeholder="'+TX('{product} for {market} buyers — {company}','{product} for {market} buyers — {company}')+'"></div>';
 h+='<div class="field" style="margin-top:8px"><label>'+TX('邮件正文','Body')+'（可用 {name}{company}{product}{market}{country}）</label><textarea id="bulkBody" rows="6" placeholder="'+TX('Dear {name},\\n\\nWe supply {product}...','Dear {name},\\n\\nWe supply {product}...')+'"></textarea></div>';
 return h;
}
function phEn(s){return (''+(s==null?'':s)).replace(/\{产品\}/g,'{product}').replace(/\{国家\}/g,'{country}').replace(/\{市场\}/g,'{market}').replace(/\{姓名\}/g,'{name}').replace(/\{公司\}/g,'{company}');}
function tplEnSubject(t){if(!t)return '';var en=t.en||'';var m=/^Subject:\s*(.+)$/m.exec(en);if(m)return phEn(m[1].trim());var ti=t.title||'';var i=ti.indexOf(' / ');return phEn(i>=0?ti.slice(i+3).trim():ti);}
function bulkTplFill(v){
 if(!v)return;var subj='',body='';
 if(v.indexOf('s_')===0){var s=(S.scripts||[]).find(function(x){return x.id===v.slice(2);});if(s){subj=tplEnSubject({en:s.en||'',title:''});body=s.en||'';}}
 else if(v.indexOf('t_')===0){var t=(EMAIL_TPLS||[])[parseInt(v.slice(2),10)];if(t){subj=tplEnSubject(t);body=phEn(t.en||'');}}
 if(subj&&$('bulkSubj'))$('bulkSubj').value=enText(subj);if(body&&$('bulkBody'))$('bulkBody').value=enText(body);
}
function bulkOpen(){
 var h='<h3>'+TX('群发助手','Bulk send')+'</h3><div class="muted" style="font-size:12.5px;margin-bottom:8px">'+TX('选多收件人 → 套模版 → 系统给每人生成个性化邮件 → 逐封打开 Gmail 发送，每封自动记入「发送记录」。','Pick recipients → choose template → personalized per recipient → send one-by-one via Gmail, each auto-logged.')+'</div>';
 h+=bulkRecipientsBox()+bulkTplBox();
 h+='<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-action="closeModal">'+TX('取消','Cancel')+'</button><button class="btn" data-action="bulkStart">'+TX('下一步：预览','Next: preview')+'</button></div>';
 $('modalBody').innerHTML=h;$('modal').classList.add('show');
}
function bulkToggleAll(){
 var chs=document.querySelectorAll('.bulk-chk');if(!chs.length)return;var all=chs[0].checked;for(var i=0;i<chs.length;i++)chs[i].checked=!all;
}
function bulkStart(){
 var leads=(S.leads||[]),sel=[];
 document.querySelectorAll('.bulk-chk:checked').forEach(function(c){var l=leads.find(function(x){return x.id===c.value;});if(l)sel.push({leadId:l.id,name:l.name,email:l.email,company:l.company,product:l.product,market:l.market,country:l.country});});
 var paste=$('bulkPaste')?$('bulkPaste').value.trim():'';
 if(paste)paste.split(/[\s,;]+/).forEach(function(e){e=e.trim();if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))sel.push({leadId:'',name:e,email:e,company:'',product:'',market:'',country:''});});
 if(!sel.length){toast(TX('请至少选一位收件人','Select at least one recipient'));return;}
 var subj=$('bulkSubj')?$('bulkSubj').value.trim():'',body=$('bulkBody')?$('bulkBody').value.trim():'';
 if(!body){toast(TX('请填写邮件正文','Fill email body'));return;}
 if(!subj)subj=(S.me&&S.me.product||'prayer pillow')+' for '+(enMarket(S.me&&S.me.market)||'global')+' buyers';
 _bulk={list:sel.map(function(r){return {leadId:r.leadId,name:r.name,email:r.email,subject:enText(bulkFill(subj,r)),body:enText(bulkFill(body,r)),done:false};}),idx:0};
 bulkRender();
}
function bulkRender(){
 var b=_bulk;if(!b)return;var r=b.list[b.idx];
 if(!r){bulkDone();return;}
 var n=b.idx+1,total=b.list.length,to=esc(r.email),su=encodeURIComponent(r.subject),bd=encodeURIComponent(r.body);
 var h='<h3>'+TX('群发发送中','Bulk sending')+' ('+n+'/'+total+')</h3>';
 h+='<div class="row" style="margin-bottom:6px"><span class="tag">'+TX('收件人','To')+'</span><span>'+esc(r.name)+' &lt;'+to+'&gt;</span></div>';
 h+='<div style="font-size:12px;color:var(--sub);margin-bottom:2px">'+TX('主题','Subject')+'</div><div style="border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;white-space:pre-wrap;font-size:14px">'+esc(r.subject)+'</div>';
 h+='<div style="font-size:12px;color:var(--sub);margin-bottom:2px">'+TX('正文','Body')+'</div><div style="border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;max-height:240px;overflow:auto;font-size:14px;line-height:1.55">'+esc(r.body)+'</div>';
 h+='<div class="row" style="flex-wrap:wrap;gap:8px;margin-top:14px">'
  +'<button class="btn amber" data-action="emGmail" data-to="'+to+'" data-su="'+esc(su)+'" data-bd="'+esc(bd)+'" data-id="'+esc(r.leadId||'')+'">'+TX('用 Gmail 网页发送','Send via Gmail')+'</button>'
  +'<button class="btn" data-action="emOutlook" data-to="'+to+'" data-su="'+esc(su)+'" data-bd="'+esc(bd)+'" data-id="'+esc(r.leadId||'')+'">'+TX('用 Outlook 网页发送','Send via Outlook')+'</button>'
  +'<button class="btn" data-action="emClient" data-mailto="'+esc('mailto:'+r.email+'?subject='+su+'&body='+bd)+'" data-id="'+esc(r.leadId||'')+'">'+TX('本机邮件客户端','Desktop app')+'</button>'
  +'<button class="btn ghost" data-action="emCopy" data-to="'+to+'" data-su="'+esc(su)+'" data-bd="'+esc(bd)+'" data-id="'+esc(r.leadId||'')+'">'+TX('复制全文','Copy all')+'</button>'
  +'</div>';
 h+='<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-action="bulkSkip">'+TX('跳过这封','Skip')+'</button><button class="btn" data-action="bulkNext">'+TX('下一封 →','Next →')+'</button></div>';
 h+='<div class="muted" style="margin-top:8px">'+TX('点上面任一方式发送/复制即记入「发送记录」，发完点「下一封」继续。','Send/copy logs it; hit “Next” after each.')+'</div>';
 $('modalBody').innerHTML=h;
}
function bulkNext(){if(!_bulk)return;_bulk.idx++;bulkRender();}
function bulkSkip(){bulkNext();}
function bulkDone(){
 var total=_bulk?_bulk.list.length:0;
 var h='<h3>'+TX('群发完成','Bulk done')+'</h3><div class="card" style="text-align:center;padding:24px;color:var(--sub)">'+TX('已处理 ','Processed ')+total+TX(' 封邮件，全部记入「发送记录」。',' emails, all logged.')+'</div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-action="closeModal">'+TX('完成','Done')+'</button></div>';
 $('modalBody').innerHTML=h;
}

function docXlsStamp(t){
 return String(t==null?'':t).replace(/<span class="stamp">([\s\S]*?)<\/span>/g,'<span style="color:#b91c1c;border:1px solid #b91c1c;padding:1px 6px;font-weight:bold">$1</span>');

function docXlsCells(t){
 return String(t==null?'':t).replace(/<(td|th)([^>]*)>/g,function(m,tag,attrs){
  var cls=(attrs.match(/class="([^"]*)"/)||[])[1]||'';
  var sty=(attrs.match(/style="([^"]*)"/)||[])[1]||'';
  var rest=attrs.replace(/\s*class="[^"]*"/,'').replace(/\s*style="[^"]*"/,'');
  var ex='border:1px solid #999;padding:4px 6px;vertical-align:top;';
  if(tag==='th')ex+='background:#eef2f6;text-align:center;font-weight:bold;';
  if(/(^|\s)r(\s|$)/.test(cls))ex+='text-align:right;';
  return '<'+tag+rest+' style="'+ex+sty+'">';
 });
}
function docXlsClauses(body){
 var b=String(body==null?'':body),rows='';
 b=b.replace(/<ul>|<\/ul>/g,'');
 b=b.replace(/<li>([\s\S]*?)<\/li>/g,function(m,li){rows+='<tr><td style="border:none;padding:2px 0 2px 4px">\u2022 '+li+'</td></tr>';return '';});
 b=b.replace(/<b>([\s\S]*?)<\/b>/g,function(m,t){rows='<tr><td style="border:none;padding:2px 0;font-weight:bold">'+t+'</td></tr>'+rows;return '';});
 var rest=String(b).replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim();
 if(rest)rows+='<tr><td style="border:none;padding:2px 0">'+rest+'</td></tr>';
 return '<table width="100%" cellspacing="0" cellpadding="0" border="0">'+rows+'</table>';
}
function docXlsSign(box){
 var rows='';
 String(box==null?'':box).split(/<br\s*\/?>/i).forEach(function(l){
  l=String(l).trim();if(!l)return;
  rows+='<tr><td style="border:none;padding:1px 0">'+l+'</td></tr>';
 });
 return '<table width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td style="border:none" width="58%"></td><td style="border:none"><table cellspacing="0" cellpadding="0" border="0">'+rows+'</table></td></tr></table>';
}
function docXlsHtml(dd,inner){
 var h=String(inner==null?'':inner);
 var open='<div class="doc">';
 var i=h.indexOf(open);if(i>=0)h=h.slice(i+open.length);
 var j=h.lastIndexOf('</div>');if(j>=0)h=h.slice(0,j);
 h=docXlsStamp(h);
 var head='',pairs=[];
 h=h.replace(/<h1>([\s\S]*?)<\/h1>/,function(m,t){head+='<tr><td colspan="4" style="border:none;text-align:center;font-size:18px;font-weight:bold;padding:3px 0">'+t+'</td></tr>';return '';});
 h=h.replace(/<div class="dsub">([\s\S]*?)<\/div>/,function(m,t){head+='<tr><td colspan="4" style="border:none;text-align:center;color:#555;padding:0 0 6px">'+t+'</td></tr>';return '';});
 h=h.replace(/<div class="row"><span class="k">([\s\S]*?)<\/span><span class="v">([\s\S]*?)<\/span><\/div>/g,function(m,k,v){pairs.push([k,v]);return '';});
 h=h.replace(/<div class="doc-meta">\s*<\/div>/g,'@@META@@');
 for(var n=0;n<pairs.length;n+=2){
  var a=pairs[n],b=pairs[n+1];
  head+='<tr><td style="border:none;font-weight:bold;padding:2px 8px 2px 0;white-space:nowrap">'+a[0]+'</td><td style="border:none;padding:2px 8px 2px 0">'+a[1]+'</td>'
   +(b?('<td style="border:none;font-weight:bold;padding:2px 8px 2px 0;white-space:nowrap">'+b[0]+'</td><td style="border:none;padding:2px 0">'+b[1]+'</td>'):'<td style="border:none"></td><td style="border:none"></td>')
   +'</tr>';
 }
 var headTbl='<table width="100%" cellspacing="0" cellpadding="0" border="0">'+head+'</table>';

 h=h.replace(/<div class="doc-sign">\s*<div class="box">([\s\S]*?)<\/div>\s*<\/div>/g,function(m,box){return docXlsSign(box);});
 h=docXlsCells(h);
 return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"><style>td,th{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:11px;color:#111}table{border-collapse:collapse}</style></head><body>'+h+'</body></html>';
}

   function(){dealIODo();});
 };

 ids.forEach(function(id){if(d.docs[id]!==undefined)d.docs[id]='done';});
 save('deals',S.deals);
 S._defShow=false;S._chkShow=false;S._recShow=false;
 refreshAll();
 toast(TX('已按【'+p.zh+'】套用：已设置交易条件并预勾所需单证，请逐项核对实际出单后取消未出的勾选','Applied preset: '+p.en+'. Review and uncheck docs not actually issued.'));
}
/* ============ 初始化 ============ */
function init(){hotDailyCheck();hotStartTimer();refreshAll();}

/* ===== 本地身份门禁（纯前端：账号与数据仅存本机浏览器，非云端账号） ===== */
function wbHash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h.toString(16);}
function wbSess(){try{return JSON.parse(localStorage.getItem('wb_auth_sess')||'null');}catch(e){return null;}}
function wbHasSess(){var s=wbSess();return !!(s&&s.uid);}
function wbSessKey(){var s=wbSess();return (s&&s.uid)?('wb_ftloop_'+s.uid+'_'):'wb_ftloop_';}
function wbAccounts(){try{return JSON.parse(localStorage.getItem('wb_auth_accounts')||'[]');}catch(e){return [];}}
function wbShowUserBar(name){
  var b=document.getElementById('wbUserBar');if(b)return;
  b=document.createElement('div');b.id='wbUserBar';
  b.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99999;background:#1f2a44;color:#fff;padding:6px 10px;border-radius:20px;font:13px/1.4 system-ui;box-shadow:0 2px 8px rgba(0,0,0,.3);';
  b.innerHTML='\uD83D\uDC64 '+name+' · <span id="wbLogout" style="color:#7fd1ff;cursor:pointer;">退出</span>';
  document.body.appendChild(b);
  document.getElementById('wbLogout').onclick=function(){localStorage.removeItem('wb_auth_sess');location.reload();};
}
function wbAuthOK(uid,name){
  localStorage.setItem('wb_auth_sess',JSON.stringify({uid:uid,name:name}));
  KEY='wb_ftloop_'+uid+'_';
  var o=document.getElementById('wbAuth');if(o)o.remove();
  wbShowUserBar(name);
  boot();
}
function wbRenderAuth(){
  var css='#wbAuth{position:fixed;inset:0;z-index:100000;background:linear-gradient(135deg,#0f1830,#1b2b50);display:flex;align-items:center;justify-content:center;font-family:system-ui,"Microsoft YaHei",sans-serif;}'+
    '#wbAuth .card{width:340px;max-width:92vw;background:#fff;border-radius:14px;padding:26px 24px;box-shadow:0 10px 40px rgba(0,0,0,.35);}'+
    '#wbAuth .auth-logo{width:48px;height:48px;margin:0 auto 10px;background:#eff6ff;border-radius:12px;display:flex;align-items:center;justify-content:center;}'+
    '#wbAuth .auth-logo svg{width:32px;height:32px;}'+
    '#wbAuth h2{margin:0 0 4px;font-size:19px;color:#16233f;text-align:center;}'+
    '#wbAuth .sub{margin:0 0 16px;font-size:12px;color:#8a93a6;text-align:center;}'+
    '#wbAuth .tabs{display:flex;gap:8px;margin-bottom:14px;}'+
    '#wbAuth .tab{flex:1;text-align:center;padding:8px;font-size:14px;border-radius:8px;cursor:pointer;background:#eef1f7;color:#5a6478;}'+
    '#wbAuth .tab.on{background:#2b6cff;color:#fff;}'+
    '#wbAuth label{display:block;font-size:12px;color:#55617a;margin:10px 0 4px;}'+
    '#wbAuth input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d6dbe6;border-radius:8px;font-size:14px;}'+
    '#wbAuth .btn{margin-top:16px;width:100%;padding:11px;border:0;border-radius:8px;background:#2b6cff;color:#fff;font-size:15px;cursor:pointer;}'+
    '#wbAuth .msg{margin-top:10px;font-size:12px;min-height:16px;}'+
    '#wbAuth .note{margin-top:12px;font-size:11px;color:#9aa3b5;line-height:1.5;}';
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  var box=document.createElement('div');box.id='wbAuth';
  box.innerHTML='<div class="card">'+
    '<div class="auth-logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g stroke="#2563eb"><circle cx="9.5" cy="12" r="7"/><path d="M2.5 12h14"/><path d="M9.5 5c2 2 2 12 0 14"/><path d="M9.5 5c-2 2-2 12 0 14"/></g><path stroke="#f59e0b" d="M12.5 9l8-4-3 8 3 5-7-4"/></svg></div>'+
    '<h2>外贸一体化平台</h2>'+
    '<p class="sub">请先实名登录，进入您自己的工作台</p>'+
    '<div class="tabs"><div class="tab on" data-t="reg">注册</div><div class="tab" data-t="login">登录</div></div>'+
    '<label>实名姓名 *</label><input id="wbName" placeholder="如：张三 / Mr. Ali">'+
    '<label>邮箱 或 电话 *</label><input id="wbContact" placeholder="用于登录的身份标识">'+
    '<label>密码 *</label><input id="wbPwd" type="password" placeholder="设置或输入密码">'+
    '<button class="btn" id="wbGo">注册并进入</button>'+
    '<div class="msg" id="wbMsg"></div>'+
    '<p class="note">说明：本工作台为纯前端工具，账号与数据仅保存在您本机浏览器（localStorage），不是云端账号。同一台设备可多人各自登录、互不干扰；换设备需重新注册。</p>'+
    '</div>';
  document.body.appendChild(box);
  var mode='reg';
  box.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){mode=t.getAttribute('data-t');box.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});t.classList.add('on');document.getElementById('wbGo').textContent=(mode==='reg'?'注册并进入':'登录进入');document.getElementById('wbMsg').textContent='';};});
  document.getElementById('wbGo').onclick=function(){
    var name=document.getElementById('wbName').value.trim();
    var contact=document.getElementById('wbContact').value.trim();
    var pwd=document.getElementById('wbPwd').value;
    var msg=document.getElementById('wbMsg');
    if(!name||!contact||!pwd){msg.style.color='#d33';msg.textContent='请完整填写姓名、邮箱/电话、密码';return;}
    if(!/^[\w.+-]+@[\w-]+\.[\w.-]+$|^\+?[\d\s\-]{6,}$/.test(contact)){msg.style.color='#d33';msg.textContent='邮箱或电话格式不正确';return;}
    var accs=wbAccounts();
    if(mode==='reg'){
      if(accs.some(function(a){return a.contact===contact;})){msg.style.color='#d33';msg.textContent='该邮箱/电话已注册，请切到“登录”';return;}
      var uid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      accs.push({uid:uid,name:name,contact:contact,pw:wbHash(pwd)});
      localStorage.setItem('wb_auth_accounts',JSON.stringify(accs));
      wbAuthOK(uid,name);
    }else{
      var a=accs.find(function(x){return x.contact===contact;});
      if(!a){msg.style.color='#d33';msg.textContent='未找到该账号，请先注册';return;}
      if(a.pw!==wbHash(pwd)){msg.style.color='#d33';msg.textContent='密码错误';return;}
      wbAuthOK(a.uid,a.name);
    }
  };
}
function authGate(){
  if(wbHasSess()){ KEY=wbSessKey(); wbShowUserBar((wbSess().name||'用户')); boot(); return; }
  wbRenderAuth();
}

boot();
</script>
